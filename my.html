<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>My Desk | The Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#11191e;--mute:#5f6b76;--paper:#f8f4ed;--card:#fffdfa;--accent:#ff5a14;--accent-ink:#c2410c;--line:#ddd7cf;--soft:#eee7dd;--warm:#fff7ed;--warm-line:#fed7aa;--ok:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "DM Sans",Arial,sans-serif}
a{color:var(--ink)}a:hover{color:var(--accent-ink)}
header.top{background:var(--card);border-bottom:1px solid var(--line)}.hin{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font:600 24px/1 "Fraunces",Georgia,serif;color:inherit;text-decoration:none}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.pill{border-radius:999px;padding:5px 11px;font-weight:700;font-size:12px;background:var(--warm);color:#9a3412;border:1px solid var(--warm-line)}
main{max-width:1200px;margin:0 auto;padding:24px 16px 80px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:500;line-height:1.15;margin:0}h1{font-size:clamp(28px,4vw,36px)}h2{font-size:22px}h3{font-size:20px}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.btn{font:700 14px "DM Sans",Arial,sans-serif;border:1px solid var(--ink);border-radius:999px;padding:11px 18px;background:var(--ink);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn:hover{color:#fff;opacity:.92}.btn.ghost{background:transparent;color:var(--ink)}.btn.ghost:hover{background:var(--ink);color:#fff}.btn.hot{background:var(--accent);border-color:var(--accent)}
.mute{color:var(--mute);font-size:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid3>*{min-width:0}.span2{grid-column:span 2}
.hero{background:var(--ink);color:#fff;border-radius:16px;padding:24px 26px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.hero .kicker{color:#ffb38f}.big{font:500 72px/1 "Fraunces",Georgia,serif;color:#ff8a52}
.up{display:inline-block;margin-top:12px;background:rgba(21,128,61,.28);color:#bbf7d0;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.down{background:rgba(185,28,28,.3);color:#fecaca}
.tl{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.12);padding:7px 0}.tl:last-child{border-bottom:0}
.bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.act{display:flex;flex-direction:column;gap:6px;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;color:var(--ink)}
.act:hover{border-color:var(--ink);color:var(--ink)}.act.urgent{background:var(--warm);border-color:var(--warm-line)}
.act .kicker{font-size:10px;color:var(--accent-ink)}.act b{font-size:16px}.act span.d{font-size:13px;color:#3b4652}
.tool{display:flex;flex-direction:column;gap:12px}.tool .row{display:flex;justify-content:space-between;font-size:14px;gap:8px}.tool .btn{margin-top:auto}
.spark{display:flex;align-items:flex-end;gap:6px;height:64px}.spark i{flex:1;background:var(--line);border-radius:4px}.spark i:last-child{background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}th{text-align:left;font-size:11px;letter-spacing:.1em;color:var(--mute);padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:10px 6px;border-bottom:1px solid var(--soft);vertical-align:middle}tr:last-child td{border-bottom:0}
select,input,textarea{font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:0}
.scroll{overflow-x:auto}.due{color:var(--bad);font-weight:700}
.news a{display:block;text-decoration:none;border-bottom:1px solid var(--soft);padding:8px 0;font-size:14px;font-weight:600}.news a:last-child{border-bottom:0}
.lock{color:var(--mute);font-size:13px}
.notice{background:var(--warm);border:1px solid var(--warm-line);border-radius:12px;padding:12px 14px;font-size:14px}
.addbox{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--soft);padding-top:12px}.addbox:first-child{border-top:0;padding-top:0}.addrow{display:flex;gap:8px;flex-wrap:wrap}.addrow select,.addrow input{flex:1;min-width:160px}#addPanel[hidden]{display:none!important}form.add[hidden]{display:none}form.add{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px}
details.ans{border-top:1px solid var(--soft);padding:10px 0}details.ans:first-child{border-top:0}summary{cursor:pointer;font-weight:600}
.signin{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.signin input{flex:1;max-width:340px}
.panel{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:center}
.faces{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}.face{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.3}
.av{width:38px;height:38px;border-radius:50%;background:#dbe5f1;color:#123459;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.face.lead .av{background:var(--ink);color:#fff;box-shadow:0 0 0 3px var(--accent)}
.pnote{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:#3b4652}
.pnote .av{width:24px;height:24px;font-size:10px}.pnote b{font-size:13px}
.ask{background:var(--warm);border:1px solid var(--warm-line);border-radius:12px;padding:14px 16px;font-size:14px;display:flex;flex-direction:column;gap:10px}
.myth{display:flex;flex-direction:column;gap:8px}.myth s{color:var(--mute)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.grid4>*{min-width:0}
@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid3.twocol{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:900px){.grid4{grid-template-columns:1fr}.grid3.twocol{grid-template-columns:1fr}.panel{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}.span2{grid-column:auto}.hero{grid-template-columns:1fr}form.add{grid-template-columns:1fr 1fr}.big{font-size:60px}}
.member-panel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:stretch}.member-panel h2{font-size:26px;line-height:1.2;margin:10px 0 12px}.panel-route>.mute{max-width:580px}.route-person{display:flex;align-items:center;gap:12px;margin:20px 0}.route-person img{border-radius:50%;object-fit:cover;flex:none}.route-person strong,.route-person span,.route-person small{display:block}.route-person span{font-size:12px;color:var(--accent-ink);margin:2px 0}.route-person small{color:var(--mute)}.panel-question{background:#fff5eb;border-color:#edcdb7;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start}.panel-question>.btn{margin-top:10px}.panel-included{font-size:12px;color:var(--mute);margin:12px 0 0}.panel-prompts{border-top:1px solid var(--line);padding-top:14px}.panel-prompts>strong{font-size:13px}.panel-prompts button{display:flex;justify-content:space-between;gap:14px;width:100%;padding:10px 0;background:none;border:0;border-bottom:1px solid var(--soft);text-align:left;color:var(--ink);font-family:inherit;font-size:13px;line-height:1.45;cursor:pointer}.panel-prompts button:hover{color:var(--accent-ink)}.panel-team{margin-top:16px;font-size:13px}.panel-call{margin-top:auto;padding-top:20px;font-size:13px;font-weight:700}.panel-state p{font-size:14px;color:var(--mute)}#panelQuestionForm{width:100%;margin-top:16px}#panelQuestionForm[hidden]{display:none!important}#panelQuestionForm label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}#panelQuestionForm input,#panelQuestionForm textarea{width:100%}.paid-tools .tool>div:first-child{display:flex!important;flex-direction:column;align-items:flex-start!important;gap:8px;min-height:62px}.paid-tools .tool h3{line-height:1.2}.tool-route{font-size:12px}.paid-tools .tool{gap:16px}.next-actions{display:grid;grid-template-columns:repeat(var(--action-count),minmax(0,1fr));gap:16px}@media(max-width:760px){.member-panel,.next-actions{grid-template-columns:1fr}.member-panel h2{font-size:24px}.paid-tools .tool>div:first-child{min-height:0}}
.sector-interests{position:relative;max-width:620px;text-align:right}.interest-chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.interest-chips span{font-size:12px;border:1px solid var(--line);padding:5px 9px;border-radius:999px;background:#fffdfa}.interest-change{border:0;background:none;font:600 12px inherit;text-decoration:underline;margin-top:6px;cursor:pointer}.interest-form{position:absolute;right:0;top:100%;width:min(520px,calc(100vw - 40px));background:#fffdfa;border:1px solid var(--line);border-radius:14px;padding:20px;text-align:left;z-index:40;box-shadow:0 12px 40px #11191e22}.interest-form[hidden]{display:none!important}.interest-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.interest-options label{display:flex;gap:7px;align-items:flex-start;font-size:13px}.interest-form select{margin:8px 0}.interest-form input{accent-color:var(--accent)}@media(max-width:600px){.sector-interests{text-align:left}.interest-chips{justify-content:flex-start}.interest-form{left:0;right:auto}.interest-options{grid-template-columns:1fr}}
</style>
<script src="/desk-me.js" defer></script>
<script src="/desk-nav.js" defer></script>
<link rel="stylesheet" href="/community.css"><script src="/community.js" defer></script><script src="/sector-news.js" defer></script><script src="/desk-interests.js" defer></script></head>
<body>
<header class="top"><div class="hin"><a class="logo" href="/">The Desk</a><div class="who" id="who"></div></div></header>
<main id="app"><p class="mute">Loading your desk…</p></main>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app'),who=document.getElementById('who'),qp=new URLSearchParams(location.search);
const day=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const dayY=d=>new Date(d).toLocaleDateString('en-GB',{month:'short',year:'numeric'});
const post=(url,body)=>fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(async r=>({ok:r.ok,data:await r.json().catch(()=>({}))}));
const greet=()=>{const h=new Date().getHours();return h<12?'Morning':h<18?'Afternoon':'Evening'};
let D=null,ME=null,showAll=false;

async function syncTracker(){
  // The programme tracker keeps its shortlist in this browser; copy it to the Desk so it shows here and on other devices.
  try{const list=JSON.parse(localStorage.getItem('desk_mylist')||'{}');if(list&&typeof list==='object'&&Object.keys(list).length)await post('/api/desk-home',{action:'tracker-sync',list});}catch(e){}
}
async function load(){
  if(qp.get('preview')!=='empty')await syncTracker();
  const [d,me]=await Promise.all([fetch('/api/desk-home',{credentials:'same-origin'}).then(r=>r.ok?r.json():null).catch(()=>null),fetch('/api/value-account?view=me',{credentials:'same-origin'}).then(r=>r.ok?r.json():null).catch(()=>null)]);
  if(!d){app.innerHTML='<div class="card">We couldn’t load your desk. Refresh to try again.</div>';return}
  D=d;ME=me||{items:[]};
  if(qp.get('preview')==='empty'){
   D={...d,member:false,until:null,profile:{},report:null,readiness:null,tests:{last:null,count:0},interview:{left:1,recent:[],count:0,per:'this week'},interviewUrl:'/interview-start.html',applications:[],news:[],game:null,challenge:null,actions:[{tag:'Start here',title:'Take the free assessment',detail:'Add your CV and complete two short tests to get your free assessment score.',href:'/assessment.html'},{tag:'Try it',title:'Try the 30-second interview check',detail:'Record one answer and see a short feedback preview.',href:'/interview-teaser.html'},{tag:'Explore',title:'See a sample Full Cycle report',detail:'A fictional example of the paid report and preparation plan.',href:'/fullcycle.html?sample=amelia'}],practitioners:d.practitioners?{...d.practitioners,question:null,canAsk:false}:null};
   ME={...ME,items:[],assessments:[],call:null};
  }
  document.title=D.member?'My Desk | The Desk':'My Desk Preview | The Desk';
  try{if(d.interviewUrl)localStorage.setItem('desk-interview-url',d.interviewUrl);if(d.report?.url){localStorage.setItem('desk-report-url',d.report.url);document.querySelectorAll('.desk-nav a').forEach(a=>{if(a.textContent==='Report')a.href='/report.html'})}}catch(e){}
  render();
}
function headerBits(){
  const parts=[];
  if(!D.member)parts.push('<span class="pill">My Desk Preview</span>');
  if(D.member)parts.push(`<span class="pill">Member${D.until?' until '+esc(dayY(D.until)):''}</span>`);
  else if(D.report)parts.push(`<button class="btn hot" id="join" style="min-height:40px;padding:9px 16px">Become a member · £89 a year</button>`);
  if(D.signedIn)parts.push(`<span>${esc(D.email)}</span><button class="btn ghost" id="out" style="min-height:36px;padding:6px 12px">Sign out</button>`);
  else parts.push('<a class="btn ghost" href="/signin.html" style="min-height:36px;padding:6px 12px">Sign in</a>');
  who.innerHTML=parts.join('');
}
function memberPanel(P){
 const q=P.question,lead=P.lead||P.panel[0],role=D.profile.targetDivision||D.profile.targetSector||'your chosen role',firm=D.profile.targetFirm||'your target firm';
 const prompts=['Which part of my CV should I strengthen first for '+role+'?','How can I make my motivation for '+firm+' more specific?','Which experience should I use to demonstrate my analytical judgement?'];
 let state=q?.answered?`<div class="panel-state"><strong>${esc(q.by||'The panel')} has replied.</strong><p>Your written response is ready.</p><a class="btn hot" href="/practitioner-answer.html?id=${encodeURIComponent(q.id)}">Read your answer →</a></div>`:q?`<div class="panel-state"><strong>Your question is with the panel.</strong><p>Reply due ${esc(new Date(q.dueAt).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'}))}.</p><a class="btn ghost" href="/practitioner-answer.html?id=${encodeURIComponent(q.id)}">View your question →</a></div>`:P.canAsk&&D.report?`<p class="mute">A specific question about your CV, your firm or your next interview. Your written answer is normally due within 48 hours.</p><button class="btn hot" id="panelCompose">Write my question →</button><p class="panel-included">1 question included with your Full Cycle plan.</p><form id="panelQuestionForm" hidden><label for="panelQuestion">What would you like help with?</label><textarea id="panelQuestion" required minlength="20" maxlength="2000" rows="4" placeholder="Include the decision you’re trying to make and the experience or role it relates to."></textarea><label for="panelEmail">Email for your question</label><input id="panelEmail" type="email" autocomplete="email" maxlength="254" required value="${esc(D.email||'')}"><p class="mute">Your question and reply are private.</p><button class="btn" type="submit">Send my question</button><p id="panelQuestionStatus" role="status"></p></form>`:`<div class="panel-state"><strong>Your included question has been used.</strong><p>Keep your written response alongside your preparation plan.</p></div>`;
 return `<section class="member-panel" aria-label="Practitioner questions and interview help"><div class="card panel-question"><div class="kicker">Your included practitioner question</div><h2>Ask the panel.</h2>${state}${!q&&P.canAsk?`<div class="panel-prompts"><strong>Start with a question</strong>${prompts.map((p,i)=>`<button type="button" data-panel-prompt="${i}">${esc(p)} <span aria-hidden="true">↗</span></button>`).join('')}</div>`:''}</div><div class="card panel-route"><div class="kicker">One-to-one interview help</div><h2>Interview coming up?</h2><p class="mute">Work through your answers with a practitioner. Practise the follow-ups, sharpen your examples and focus on the role you’re interviewing for.</p><div class="route-person">${/rao/i.test(lead.name)?'<img src="/assets/kayyor-rao.jpg" width="56" height="56" alt="Kayyor Rao">':`<span class="av">${esc(lead.init)}</span>`}<div><strong>${esc(lead.name)}</strong><span>Panel lead for your route</span><small>${esc(lead.firms)}</small></div></div><a class="btn" href="${esc(ME.call?.url||'/mentor.html')}"${ME.call?' target="_blank" rel="noopener"':''}>${ME.call?'Arrange your practitioner call':'Explore one-to-one coaching'} →</a><p class="panel-included">${ME.call?'Your included call is available above.':'View session options and availability.'}</p><details class="panel-team"><summary>Meet the rest of the panel</summary><div class="faces">${P.panel.filter(m=>m.name!==lead.name).map(m=>`<div class="face"><span class="av">${esc(m.init)}</span><span><b>${esc(m.name)}</b><br><small>${esc(m.firms)}</small></span></div>`).join('')}</div></details></div></section>`;
}
function panelBand(){
  const P=D.practitioners;if(!P)return '';if(D.member)return memberPanel(P);
  const q=P.question;let ask;
  if(q&&q.answered)ask=`<div class="ask"><b>${esc(q.by||'The panel')} answered your question.</b><a class="btn" href="/practitioner-answer.html?id=${encodeURIComponent(q.id)}">Read the answer</a></div>`;
  else if(q)ask=`<div class="ask"><b>Your question is with the panel.</b><span>Answer due by ${esc(new Date(q.dueAt).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'}))}.</span></div>`;
  else if(P.canAsk&&D.report)ask=`<div class="ask"><b>Your membership includes one question to the panel.</b><span>Ask about your CV, a firm or an interview. Answered within 48 hours.</span><a class="btn" href="${esc(D.report.url)}#ask">Ask the panel</a></div>`;
  else if(!D.member)ask=`<div class="ask"><b>Members put a question to the panel.</b><span>Answered by one of them within 48 hours, plus a call to talk it through.</span>${D.report?'<button class="btn hot" id="join3">£89 for the whole year</button>':''}</div>`;
  else ask=`<div class="ask"><b>Your panel question has been used.</b><span>Members also get a call with a practitioner.</span></div>`;
  if(D.member&&ME.call)ask=ask.replace('</div>',`<a class="btn ghost" href="${esc(ME.call.url)}" target="_blank" rel="noopener">${esc(ME.call.label)}</a></div>`);
  return `<section class="card panel"><div><div class="kicker">Your practitioner panel</div><h2 style="margin-top:6px">Support from The Desk practitioners.</h2>
    <p class="mute" style="margin:6px 0 0">${P.approved?`The scoring, the tips and the interview feedback on your Desk use points our practitioners have checked and approved${P.approved>=50?` (${P.approved.toLocaleString('en-GB')} so far)`:''}. Where they disagree with popular advice, we tell you.`:'Your score, your report and your interview feedback are built on The Desk’s practitioner-developed framework.'}</p>
    <div class="faces">${P.panel.map(m=>`<div class="face${m.name===P.lead.name?' lead':''}" title="${esc(m.firms)}"><span class="av" aria-hidden="true">${esc(m.init)}</span><span><b>${esc(m.name)}</b>${m.name===P.lead.name?' · <span style="color:var(--accent-ink);font-weight:700">your route</span>':''}<br><span class="mute" style="font-size:12px">${esc(m.firms)}</span></span></div>`).join('')}</div></div>
    ${ask}</section>`;
}
function readinessCard(){
  const r=D.readiness;
  if(!D.member)return `<div class="hero span2 free-score"><div><div class="kicker">${r?'Free assessment score':'My Desk Preview · No assessment yet'}</div>${r?`<div style="display:flex;align-items:baseline;gap:12px;margin-top:12px"><div class="big">${r.score}</div><span>out of 100</span></div><p style="font-size:18px;font-weight:700;margin:12px 0">Your initial application snapshot.</p><p style="font-size:14px;color:#cfd6db">Based on your CV and the short tests in your free assessment. Full Cycle adds detailed analysis, CV repairs and your preparation plan.</p><a class="btn hot" href="${esc(D.report?.url||'/assessment.html')}">View my free assessment →</a>`:`<h2 style="font-size:28px;margin-top:12px">Explore your Desk. Start when you’re ready.</h2><p style="font-size:14px;color:#cfd6db">You haven’t completed an assessment, so there’s no score yet. Add your CV and take the short tests to bring your free assessment result into this preview.</p><a class="btn hot" href="/assessment.html">Start my free assessment →</a>`}</div><div><div class="kicker">${r?'What this score includes':'What happens next'}</div><ol style="font-size:14px;line-height:1.8;padding-left:20px;color:#e5e9ed"><li>CV and application evidence</li><li>Numeracy and commercial test answers</li><li>Your three immediate priorities</li></ol><p style="font-size:13px;color:#cfd6db">${r?'This is the free assessment, not your detailed Full Cycle review.':'Complete the assessment to see your own starting point here.'}</p></div></div>`;
  if(!r)return `<div class="hero span2"><div><div class="kicker">Readiness score</div><p style="font:500 26px/1.25 Fraunces,Georgia,serif;margin:10px 0 0">You don’t have a score yet.</p><p style="color:#cfd6db;font-size:14px">The free assessment reads your CV against your target route and gives you a readiness score and your top 3 fixes. About 10 minutes.</p><a class="btn hot" href="/assessment.html" style="margin-top:6px">Take the free assessment</a></div><div><div class="kicker">How it moves</div><p style="color:#cfd6db;font-size:14px;margin:10px 0 0">Your score changes only when you prove something: a recheck of an improved CV, or a better result on a fresh test. Practice and ticked-off tasks show in your progress, not your score.</p></div></div>`;
  const gap=r.score>=75?'':r.score>=65?`${75-r.score} points from Competitive`:`${65-r.score} points from Borderline`;
  return `<div class="hero span2"><div><div class="kicker">Readiness score</div><div style="display:flex;align-items:baseline;gap:12px;margin-top:8px"><div class="big">${r.score}</div><div><div style="font-size:18px;font-weight:700">${esc(r.band)}</div><div style="font-size:14px;color:#cfd6db">${esc(gap)}</div></div></div>

  const pick=()=>PROGS.programmes.filter(x=>x.sector===sec.value&&(!typ.value||x.type===typ.value)&&!mine.has(x.key));
  const upd=()=>{const n=pick().length;info.textContent=n?`${n} programme${n===1?'':'s'} not on your list yet.`:'All of these are already on your list.';document.getElementById('grpAdd').disabled=!n};
  sec.onchange=upd;typ.onchange=upd;upd();
  document.getElementById('progList').innerHTML=PROGS.programmes.filter(x=>!mine.has(x.key)).map(x=>`<option value="${esc(x.firm+' · '+x.name)}"></option>`).join('');
  document.getElementById('grpAdd').onclick=()=>addKeys(pick().map(x=>x.key));
  document.getElementById('oneAdd').onclick=()=>{const v=document.getElementById('oneProg').value;const x=PROGS.programmes.find(p=>p.firm+' · '+p.name===v);if(!x){document.getElementById('addMsg').textContent='Pick a programme from the list, or add it yourself below.';return}addKeys([x.key])};
}
async function addKeys(keys){
  if(!keys.length)return;
  const r=await post('/api/desk-home',{action:'tracker-add',keys});
  if(!r.ok){document.getElementById('addMsg').textContent=r.data.error||'Could not add those.';return}
  try{localStorage.setItem('desk_mylist',JSON.stringify(r.data.list))}catch(e){}
  showAll=true;await load();const pn=document.getElementById('addPanel');if(pn){pn.hidden=false;loadProgrammes();document.getElementById('addMsg').textContent=`Added ${r.data.added} programme${r.data.added===1?'':'s'}.`}
}
async function join(){location.href='/signup.html?plan=member'}

function bind(){
  const composer=document.getElementById('panelCompose'),questionForm=document.getElementById('panelQuestionForm');
  function compose(text){if(!questionForm)return;questionForm.hidden=false;if(text)document.getElementById('panelQuestion').value=text;composer.style.display='none';document.getElementById('panelQuestion').focus();}
  if(composer)composer.onclick=()=>compose();
  document.querySelectorAll('[data-panel-prompt]').forEach(button=>button.onclick=()=>compose(button.textContent.replace(/↗/g,'').trim()));
  if(questionForm)questionForm.onsubmit=async event=>{event.preventDefault();const button=questionForm.querySelector('button[type=submit]'),message=document.getElementById('panelQuestionStatus');button.disabled=true;message.textContent='Sending your question…';try{const r=await post('/api/practitioner-questions',{id:D.report.assessmentId,email:document.getElementById('panelEmail').value,question:document.getElementById('panelQuestion').value,publish:false});if(!r.ok&&!(r.data.questionId&&r.data.error))throw Error(r.data.error||'Please try again.');const link=document.createElement('a');link.href='/practitioner-answer.html?id='+encodeURIComponent(r.data.questionId);link.textContent='Question sent. Open your private question and reply page →';message.replaceChildren(link);questionForm.querySelectorAll('textarea,input').forEach(el=>el.disabled=true);}catch(error){message.textContent=error.message;button.disabled=false;}};

  ['join','join2','join3','join4','join5'].forEach(id=>{const b=document.getElementById(id);if(b)b.onclick=join});
  const o=document.getElementById('out');if(o)o.onclick=async()=>{await post('/api/value-account',{action:'signout'});location.href='/my.html'};

  const more=document.getElementById('appMore');if(more)more.onclick=()=>{showAll=!showAll;render();document.getElementById('applications').scrollIntoView()};
  const t=document.getElementById('addToggle'),f=document.getElementById('addForm');
  const panel=document.getElementById('addPanel');
  if(t)t.onclick=e=>{e.preventDefault();panel.hidden=!panel.hidden;if(!panel.hidden)loadProgrammes()};
  if(f)f.onsubmit=async e=>{e.preventDefault();const r=await post('/api/desk-home',{action:'app-save',firm:f.firm.value,programme:f.programme.value,deadline:f.deadline.value,stage:f.stage.value});if(!r.ok)return alert(r.data.error||'Could not add that.');load()};
  document.querySelectorAll('[data-stage]').forEach(sel=>sel.onchange=async()=>{
    const id=sel.dataset.stage,a=D.applications.find(x=>x.id===id);if(!a)return;
    if(id.startsWith('t:')){try{const l=JSON.parse(localStorage.getItem('desk_mylist')||'{}');if(l[id.slice(2)]){l[id.slice(2)]={stage:sel.value};localStorage.setItem('desk_mylist',JSON.stringify(l))}}catch(e){}await post('/api/desk-home',{action:'app-stage',id,stage:sel.value})}
    else await post('/api/desk-home',{action:'app-save',id,firm:a.firm,programme:a.programme,deadline:a.deadline,url:a.url,notes:a.notes,stage:sel.value});
    load()});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.del;if(!confirm('Remove this application?'))return;
    if(id.startsWith('t:')){try{const l=JSON.parse(localStorage.getItem('desk_mylist')||'{}');delete l[id.slice(2)];localStorage.setItem('desk_mylist',JSON.stringify(l))}catch(e){}}
    await post('/api/desk-home',{action:'app-delete',id});load()});
  document.querySelectorAll('[data-delans]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this answer?'))return;await post('/api/value-account',{action:'delete-item',id:b.dataset.delans});load()});
  const oc=document.getElementById('outcome');if(oc)oc.onclick=()=>window.DeskOutcome&&window.DeskOutcome.open({});
}
let refreshPending=false;function refreshDesk(){if(document.hidden||refreshPending||document.activeElement?.closest('form')||document.getElementById('addPanel')?.hidden===false)return;refreshPending=true;load().finally(()=>refreshPending=false);}window.addEventListener('focus',refreshDesk);window.addEventListener('storage',e=>{if(e.key==='desk_mylist')refreshDesk();});setInterval(refreshDesk,60000);
load();
</script>
