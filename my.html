<body>
<header class="top"><div class="hin"><a class="logo" href="/">The Desk</a><div class="who" id="who"></div></div></header>
<div class="dashboard-frame" id="dashboardFrame"><aside class="desk-tools" id="deskTools" hidden aria-label="Your tools"></aside><main id="app"><p class="mute">Loading your desk…</p></main></div>
<script src="/live-sessions.js"></script>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app'),who=document.getElementById('who'),qp=new URLSearchParams(location.search);
const day=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const dayY=d=>new Date(d).toLocaleDateString('en-GB',{month:'short',year:'numeric'});
const post=(url,body)=>fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(async r=>({ok:r.ok,data:await r.json().catch(()=>({}))}));
const greet=()=>{const h=new Date().getHours();return h<12?'Morning':h<18?'Afternoon':'Evening'};
let D=null,ME=null,showAll=false;

async function syncTracker(){
  // The programme tracker keeps its shortlist in this browser; copy it to the Desk so it shows here and on other devices.
  try{const list=JSON.parse(localStorage.getItem('desk_mylist')||'{}');if(list&&typeof list==='object'&&Object.keys(list).length)await post('/api/desk-home',{action:'tracker-sync',list});}catch(e){}
}
async function load(){
  if(qp.get('preview')!=='empty')await syncTracker();
  const [d,me]=await Promise.all([fetch('/api/desk-home',{credentials:'same-origin'}).then(r=>r.ok?r.json():null).catch(()=>null),fetch('/api/value-account?view=me',{credentials:'same-origin'}).then(r=>r.ok?r.json():null).catch(()=>null)]);
  if(!d){app.innerHTML='<div class="card">We couldn’t load your desk. Refresh to try again.</div>';return}
  D=d;ME=me||{items:[]};
  if(qp.get('preview')==='empty'){
   D={...d,member:false,needsAssessment:false,until:null,profile:{},report:null,readiness:null,tests:{last:null,count:0},interview:{left:1,recent:[],count:0,per:'this week'},interviewUrl:'/interview-start.html',applications:[],news:[],game:null,challenge:null,actions:[{tag:'Start here',title:'Take the free assessment',detail:'Add your CV and complete two short tests to get your free assessment score.',href:'/assessment.html'},{tag:'Try it',title:'Try the 30-second interview check',detail:'Record one answer and see a short feedback preview.',href:'/interview.html?ready=1&taster=interview&trial=1'},{tag:'Explore',title:'See a sample Deep Assessment',detail:'A fictional example of the paid report and preparation plan.',href:'/report-sample.html'}],practitioners:d.practitioners?{...d.practitioners,question:null,canAsk:false}:null};
   ME={...ME,items:[],assessments:[],call:null};
  }
  document.title=D.member?'Member Dashboard | The Desk':D.signedIn?'Free Account | The Desk':'My Desk Preview | The Desk';
  try{if(d.interviewUrl)localStorage.setItem('desk-interview-url',d.interviewUrl);if(d.report?.url){localStorage.setItem('desk-report-url',d.report.url);document.querySelectorAll('.desk-nav a').forEach(a=>{if(a.textContent==='Report')a.href='/report.html'})}}catch(e){}
  render();
}
function headerBits(){
  const parts=[];
  if(!D.member)parts.push('<span class="pill">'+(D.signedIn?'Free account':'My Desk Preview')+'</span>');
  if(D.member)parts.push(`<span class="pill">Member${D.until?' until '+esc(dayY(D.until)):''}</span>`);
  else if(D.report)parts.push(`<button class="btn hot" id="join" style="min-height:40px;padding:9px 16px">Become a member · £89 a year</button>`);
  if(D.signedIn)parts.push(`<span>${esc(D.email)}</span><button class="btn ghost" id="out" style="min-height:36px;padding:6px 12px">Sign out</button>`);
  else parts.push('<a class="btn ghost" href="/signin.html" style="min-height:36px;padding:6px 12px">Sign in</a>');
  who.innerHTML=parts.join('');
}
function memberPanel(P){
 if(!D.report)return `<section class="card"><div class="kicker">Practitioner support included</div><h2>Your panel is part of your membership.</h2><p class="mute">Complete your assessment first, so you can put a specific question to the panel using your own CV and preparation priorities.</p><a href="/assessment.html">Start my assessment →</a></section>`;
 const q=P.question,lead=P.lead||P.panel[0],role=D.profile.targetDivision||D.profile.targetSector||'your chosen role',firm=D.profile.targetFirm||'your target firm';
 const prompts=['Which part of my CV should I strengthen first for '+role+'?','How can I make my motivation for '+firm+' more specific?','Which experience should I use to demonstrate my analytical judgement?'];
 let state=!D.member?`<div class="panel-state"><strong>Advice from experienced practitioners.</strong><p>Preview how the panel helps with your CV, target firm and interview preparation.</p><a class="btn" href="/practitioners-preview.html?tour=1">Open panel preview →</a></div>`:q?.answered?`<div class="panel-state"><strong>${esc(q.by||'The panel')} has replied.</strong><p>Your written response is ready.</p><a class="btn hot" href="/practitioner-answer.html?id=${encodeURIComponent(q.id)}">Read your answer →</a></div>`:q?`<div class="panel-state"><strong>Your question is with the panel.</strong><p>Reply due ${esc(new Date(q.dueAt).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'}))}.</p><a class="btn ghost" href="/practitioner-answer.html?id=${encodeURIComponent(q.id)}">View your question →</a></div>`:P.canAsk&&D.report?`<p class="mute">A specific question about your CV, your firm or your next interview. Your written answer is normally due within 48 hours.</p><button class="btn hot" id="panelCompose">Write my question →</button><p class="panel-included">1 question included with your membership.</p><form id="panelQuestionForm" hidden><label for="panelQuestion">What would you like help with?</label><textarea id="panelQuestion" required minlength="20" maxlength="2000" rows="4" placeholder="Include the decision you’re trying to make and the experience or role it relates to."></textarea><label for="panelEmail">Email for your question</label><input id="panelEmail" type="email" autocomplete="email" maxlength="254" required value="${esc(D.email||'')}"><p class="mute">Your question and reply are private.</p><button class="btn" type="submit">Send my question</button><p id="panelQuestionStatus" role="status"></p></form>`:`<div class="panel-state"><strong>Your included question has been used.</strong><p>Keep your written response alongside your preparation plan.</p></div>`;
 return `<section class="card compact-panel" aria-label="Practitioner support"><div class="compact-panel-head"><div><h2 class="kicker">Ask the panel</h2><p class="mute">${D.member?"1 question included with your membership · written reply normally within 48 hours.":"Member · personal guidance on your next step."}</p></div></div>${state}${!q&&P.canAsk?`<details class="panel-prompts"><summary>3 suggested questions</summary>${prompts.map((p,i)=>`<button type="button" data-panel-prompt="${i}">${esc(p)} <span aria-hidden="true">↗</span></button>`).join('')}</details>`:''}</section>`;

}
function panelBand(){
  const P=D.practitioners;if(!P)return '';if(D.signedIn)return memberPanel(P);
  const q=P.question;let ask;
  if(q&&q.answered)ask=`<div class="ask"><b>${esc(q.by||'The panel')} answered your question.</b><a class="btn" href="/practitioner-answer.html?id=${encodeURIComponent(q.id)}">Read the answer</a></div>`;
  else if(q)ask=`<div class="ask"><b>Your question is with the panel.</b><span>Answer due by ${esc(new Date(q.dueAt).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'}))}.</span></div>`;
  else if(P.canAsk&&D.report)ask=`<div class="ask"><b>Your membership includes one question to the panel.</b><span>Ask about your CV, a firm or an interview. Answered within 48 hours.</span><a class="btn" href="${esc(D.report.url)}#ask">Ask the panel</a></div>`;
  else if(!D.member)ask=`<div class="ask"><b>Members put a question to the panel.</b><span>Answered by one of them within 48 hours, plus a call to talk it through.</span>${D.report?'<button class="btn hot" id="join3">£89 for the whole year</button>':''}</div>`;

 const firstFreeFix=(D.report?.fixes||[])[0];
 const task=(D.actions||[]).find(a=>a.tag==='Your next task')||(D.actions||[]).find(a=>!/deadline|interview/i.test(a.tag||''));
 let scoreCard=`<section class="card member-next-fix"><div class="kicker">${D.deep?.status==='complete'?'CV score':'Full score'}</div><div class="member-score-number">${score?esc(score.score):'—'}<small>/100</small></div><h2>Next fix: ${esc((free?firstFreeFix?.title:null)||next.title||task?.title||'Start your assessment')}</h2><a class="btn" href="${esc((free?firstFreeFix?.href||D.report?.url:null)||task?.href||D.report?.url||'/assessment-start.html')}">Do it · ${Number(next.minutes)||5} mins →</a><p class="mute">${free?((D.report?.fixes||[]).length+' priority fixes'):done+' of '+total+' fixes in'}${D.report?' · <a href="'+esc(D.report.url)+'">View report →</a>':''}</p><progress max="${free?(D.report?.fixes||[]).length||1:total||1}" value="${done}"></progress><a class="panel-perk" href="${free?"/practitioners-preview.html?tour=1":"/my.html#practitionerPanel"}">${free?"Ask the practitioner panel · Member →":"Ask the panel: 1 question included →"}</a></section>`;

 const library=D.library||{};
 const libraryCard=`<section class="card member-library-summary"><a href="${free?'/feature-preview.html?feature=answers&tour=1':'/saved-answers.html'}">${library.answers||0} answers saved ${free?'<span class="tier-tag">Member</span>':''} →</a><a href="${free?'/feature-preview.html?feature=story&tour=1':'/your-story.html'}">${library.storyFacts||0} of 10 story facts · each fact improves your answers ${free?'<span class="tier-tag">Member</span>':''} →</a></section>`;
 return `<div class="member-home-grid"><div class="member-home-left"><div id="memberDailySlot"></div>${scoreCard}</div><div class="member-home-right">${upcomingCard()}${interviewHelpCard()}${libraryCard}</div></div><div class="dashboard-workspace">${dashboardQuickTools()}${D.needsAssessment?memberOnboardingCard():D.deep?.status==='complete'?'':deepStatusCard()}<div class="dashboard-updates-grid">${newsCard()}${liveEventCard()}</div>${'<div id="practitionerPanel">'+panelBand()+'</div>'}<section class="card"><div class="kicker">Community</div><h3>Prepare together.</h3><a href="/community.html">Open the forum →</a></section></div>`;
}
function render(){
  headerBits();dashboardSidebar();document.body.classList.toggle('free-dashboard',D.signedIn&&!D.member);
  const name=D.profile.firstName;
  const target=[D.profile.targetFirm,D.profile.targetDivision||D.profile.targetSector,D.profile.programme].filter(Boolean).join(' · ');
  app.innerHTML=`${D.testFixture?'<div class="notice">Synthetic test account · no payment or email was sent. Use sign-up for a real student account.</div>':''}${qp.get('signed_in')?'<div class="notice">You’re signed in. Your desk is now saved to your account.</div>':''}${qp.get('link')==='expired'?'<div class="notice">That sign-in link has expired or was already used. Ask for a new one below.</div>':''}
    <div class="entry-intro" style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px"><div><div class="kicker">${D.member?'Member dashboard':D.signedIn?'Free account':'Explore My Desk'}</div><h1>${esc(greet())}${name?', '+esc(name):''}.</h1>${D.member?'<p class="member-progress-greeting">You’re '+(D.prep?.completed||0)+' of '+(D.prep?.total||0)+' fixes in.</p>':'<p class="mute" style="max-width:610px;margin:8px 0 0;line-height:1.6"></p>'}</div></div>
    ${!D.member&&(!D.signedIn||D.report)?`<div class="entry-account-actions" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:12px 0 20px">${!D.signedIn?'<a class="btn hot" href="/assessment-start.html">Get my free assessment</a><a class="btn ghost" href="/signin.html">Log in</a>':''}<a class="btn ghost" href="/signup.html?plan=member">Explore membership →</a></div>`:''}
    <div class="dashboard-desktop-detail tier-dashboard-main">${!D.member&&qp.has('assessment')?'<div class="notice" role="status">Your free assessment is ready. Your score and result are saved below.</div>':''}${D.member?memberDesk():`${D.signedIn?freeDesk():readinessCard()+freeRow()+lockedRow()}`}</div>`;

  bind();document.dispatchEvent(new Event('desk:render'));if((D.member||D.report)&&matchMedia('(min-width:600px)').matches){loadNews();loadCommunityActivity();bindSnapshot();}
  if(location.hash){const t=document.querySelector(location.hash);if(t)t.scrollIntoView()}
}
let PROGS=null;
async function loadProgrammes(){
  if(!PROGS)PROGS=await fetch('/api/desk-home?view=programmes',{credentials:'same-origin'}).then(r=>r.ok?r.json():null).catch(()=>null);
  if(!PROGS)return;
  const mine=new Set(D.applications.filter(a=>a.source==='tracker').map(a=>a.id.slice(2)));
  const sec=document.getElementById('grpSector'),typ=document.getElementById('grpType'),info=document.getElementById('grpInfo');
  sec.innerHTML=PROGS.sectors.map(x=>`<option value="${esc(x.key)}">${esc(x.label)} (${x.count})</option>`).join('');
  typ.innerHTML='<option value="">All programme types</option>'+PROGS.types.map(t=>`<option>${esc(t)}</option>`).join('');
  const pick=()=>PROGS.programmes.filter(x=>x.sector===sec.value&&(!typ.value||x.type===typ.value)&&!mine.has(x.key));
  const upd=()=>{const n=pick().length;info.textContent=n?`${n} programme${n===1?'':'s'} not on your list yet.`:'All of these are already on your list.';document.getElementById('grpAdd').disabled=!n};
  sec.onchange=upd;typ.onchange=upd;upd();
  document.getElementById('progList').innerHTML=PROGS.programmes.filter(x=>!mine.has(x.key)).map(x=>`<option value="${esc(x.firm+' · '+x.name)}"></option>`).join('');
  document.getElementById('grpAdd').onclick=()=>addKeys(pick().map(x=>x.key));
  document.getElementById('oneAdd').onclick=()=>{const v=document.getElementById('oneProg').value;const x=PROGS.programmes.find(p=>p.firm+' · '+p.name===v);if(!x){document.getElementById('addMsg').textContent='Pick a programme from the list, or add it yourself below.';return}addKeys([x.key])};
}
async function addKeys(keys){
  if(!keys.length)return;
  const r=await post('/api/desk-home',{action:'tracker-add',keys});
  if(!r.ok){document.getElementById('addMsg').textContent=r.data.error||'Could not add those.';return}
  try{localStorage.setItem('desk_mylist',JSON.stringify(r.data.list))}catch(e){}
  showAll=true;await load();const pn=document.getElementById('addPanel');if(pn){pn.hidden=false;loadProgrammes();document.getElementById('addMsg').textContent=`Added ${r.data.added} programme${r.data.added===1?'':'s'}.`}
}
async function join(){location.href='/membership-start.html?return='+encodeURIComponent(location.pathname+location.search+location.hash)}

function bind(){
  const composer=document.getElementById('panelCompose'),questionForm=document.getElementById('panelQuestionForm');
  function compose(text){if(!questionForm)return;questionForm.hidden=false;if(text)document.getElementById('panelQuestion').value=text;composer.style.display='none';document.getElementById('panelQuestion').focus();}
  if(composer)composer.onclick=()=>compose();
  document.querySelectorAll('[data-panel-prompt]').forEach(button=>button.onclick=()=>compose(button.textContent.replace(/↗/g,'').trim()));
  if(questionForm)questionForm.onsubmit=async event=>{event.preventDefault();const button=questionForm.querySelector('button[type=submit]'),message=document.getElementById('panelQuestionStatus');button.disabled=true;message.textContent='Sending your question…';try{const r=await post('/api/practitioner-questions',{id:D.report.assessmentId,email:document.getElementById('panelEmail').value,question:document.getElementById('panelQuestion').value,publish:false});if(!r.ok&&!(r.data.questionId&&r.data.error))throw Error(r.data.error||'Please try again.');const link=document.createElement('a');link.href='/practitioner-answer.html?id='+encodeURIComponent(r.data.questionId);link.textContent='Question sent. Open your private question and reply page →';message.replaceChildren(link);questionForm.querySelectorAll('textarea,input').forEach(el=>el.disabled=true);}catch(error){message.textContent=error.message;button.disabled=false;}};

  ['join','join2','join3','join4','join5'].forEach(id=>{const b=document.getElementById(id);if(b)b.onclick=join});
  const o=document.getElementById('out');if(o)o.onclick=async()=>{await post('/api/value-account',{action:'signout'});sessionStorage.clear();location.href='/my.html'};

  const more=document.getElementById('appMore');if(more)more.onclick=()=>{showAll=!showAll;render();document.getElementById('applications').scrollIntoView()};
  const t=document.getElementById('addToggle'),f=document.getElementById('addForm');
  const panel=document.getElementById('addPanel');
  if(t)t.onclick=e=>{e.preventDefault();panel.hidden=!panel.hidden;if(!panel.hidden)loadProgrammes()};
  if(f)f.onsubmit=async e=>{e.preventDefault();const r=await post('/api/desk-home',{action:'app-save',firm:f.firm.value,programme:f.programme.value,deadline:f.deadline.value,stage:f.stage.value});if(!r.ok)return alert(r.data.error||'Could not add that.');load()};
  document.querySelectorAll('[data-stage]').forEach(sel=>sel.onchange=async()=>{
    const id=sel.dataset.stage,a=D.applications.find(x=>x.id===id);if(!a)return;
    if(id.startsWith('t:')){try{const l=JSON.parse(localStorage.getItem('desk_mylist')||'{}');if(l[id.slice(2)]){l[id.slice(2)]={stage:sel.value};localStorage.setItem('desk_mylist',JSON.stringify(l))}}catch(e){}await post('/api/desk-home',{action:'app-stage',id,stage:sel.value})}
    else await post('/api/desk-home',{action:'app-save',id,firm:a.firm,programme:a.programme,deadline:a.deadline,url:a.url,notes:a.notes,stage:sel.value});
    load()});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.del;if(!confirm('Remove this application?'))return;
    if(id.startsWith('t:')){try{const l=JSON.parse(localStorage.getItem('desk_mylist')||'{}');delete l[id.slice(2)];localStorage.setItem('desk_mylist',JSON.stringify(l))}catch(e){}}
    await post('/api/desk-home',{action:'app-delete',id});load()});
  document.querySelectorAll('[data-delans]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this answer?'))return;await post('/api/value-account',{action:'delete-item',id:b.dataset.delans});load()});
  const oc=document.getElementById('outcome');if(oc)oc.onclick=()=>window.DeskOutcome&&window.DeskOutcome.open({});
}
let refreshPending=false;function refreshDesk(){if(document.hidden||refreshPending||document.activeElement?.closest('form')||document.getElementById('addPanel')?.hidden===false)return;refreshPending=true;load().finally(()=>refreshPending=false);}window.addEventListener('focus',refreshDesk);window.addEventListener('storage',e=>{if(e.key==='desk_mylist'||e.key==='desk-progress')refreshDesk();});setInterval(refreshDesk,60000);
load();
</script>
