<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>My Desk | The Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#11191e;--mute:#5f6b76;--paper:#f8f4ed;--card:#fffdfa;--accent:#ff5a14;--accent-ink:#c2410c;--line:#ddd7cf;--soft:#eee7dd;--warm:#fff7ed;--warm-line:#fed7aa;--ok:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "DM Sans",Arial,sans-serif}
a{color:var(--ink)}a:hover{color:var(--accent-ink)}
header.top{background:var(--card);border-bottom:1px solid var(--line)}.hin{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font:600 24px/1 "Fraunces",Georgia,serif;color:inherit;text-decoration:none}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.pill{border-radius:999px;padding:5px 11px;font-weight:700;font-size:12px;background:var(--warm);color:#9a3412;border:1px solid var(--warm-line)}
main{max-width:1200px;margin:0 auto;padding:24px 16px 80px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:500;line-height:1.15;margin:0}h1{font-size:clamp(28px,4vw,36px)}h2{font-size:22px}h3{font-size:20px}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.btn{font:700 14px "DM Sans",Arial,sans-serif;border:1px solid var(--ink);border-radius:999px;padding:11px 18px;background:var(--ink);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn:hover{color:#fff;opacity:.92}.btn.ghost{background:transparent;color:var(--ink)}.btn.ghost:hover{background:var(--ink);color:#fff}.btn.hot{background:var(--accent);border-color:var(--accent)}
.mute{color:var(--mute);font-size:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid3>*{min-width:0}.span2{grid-column:span 2}
.hero{background:var(--ink);color:#fff;border-radius:16px;padding:24px 26px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.hero .kicker{color:#ffb38f}.big{font:500 72px/1 "Fraunces",Georgia,serif;color:#ff8a52}
.up{display:inline-block;margin-top:12px;background:rgba(21,128,61,.28);color:#bbf7d0;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.down{background:rgba(185,28,28,.3);color:#fecaca}
.tl{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.12);padding:7px 0}.tl:last-child{border-bottom:0}
.bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.act{display:flex;flex-direction:column;gap:6px;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;color:var(--ink)}
.act:hover{border-color:var(--ink);color:var(--ink)}.act.urgent{background:var(--warm);border-color:var(--warm-line)}
.act .kicker{font-size:10px;color:var(--accent-ink)}.act b{font-size:16px}.act span.d{font-size:13px;color:#3b4652}
.tool{display:flex;flex-direction:column;gap:12px}.tool .row{display:flex;justify-content:space-between;font-size:14px;gap:8px}.tool .btn{margin-top:auto}
.spark{display:flex;align-items:flex-end;gap:6px;height:64px}.spark i{flex:1;background:var(--line);border-radius:4px}.spark i:last-child{background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}th{text-align:left;font-size:11px;letter-spacing:.1em;color:var(--mute);padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:10px 6px;border-bottom:1px solid var(--soft);vertical-align:middle}tr:last-child td{border-bottom:0}
select,input,textarea{font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:0}
.scroll{overflow-x:auto}.due{color:var(--bad);font-weight:700}
.news a{display:block;text-decoration:none;border-bottom:1px solid var(--soft);padding:8px 0;font-size:14px;font-weight:600}.news a:last-child{border-bottom:0}
.lock{color:var(--mute);font-size:13px}
.notice{background:var(--warm);border:1px solid var(--warm-line);border-radius:12px;padding:12px 14px;font-size:14px}
form.add[hidden]{display:none}form.add{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px;margin-top:12px}
details.ans{border-top:1px solid var(--soft);padding:10px 0}details.ans:first-child{border-top:0}summary{cursor:pointer;font-weight:600}
.signin{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.signin input{flex:1;max-width:340px}
.panel{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:center}
.faces{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}.face{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.3}
.av{width:38px;height:38px;border-radius:50%;background:#dbe5f1;color:#123459;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.face.lead .av{background:var(--ink);color:#fff;box-shadow:0 0 0 3px var(--accent)}
.pnote{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:#3b4652}
.pnote .av{width:24px;height:24px;font-size:10px}.pnote b{font-size:13px}
.ask{background:var(--warm);border:1px solid var(--warm-line);border-radius:12px;padding:14px 16px;font-size:14px;display:flex;flex-direction:column;gap:10px}
.myth{display:flex;flex-direction:column;gap:8px}.myth s{color:var(--mute)}
@media(max-width:900px){.panel{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}.span2{grid-column:auto}.hero{grid-template-columns:1fr}form.add{grid-template-columns:1fr 1fr}.big{font-size:60px}}
</style>
<script src="/desk-me.js" defer></script>
<script src="/desk-nav.js" defer></script>
</head>
<body>
<header class="top"><div class="hin"><a class="logo" href="/">The Desk</a><div class="who" id="who"></div></div></header>
<main id="app"><p class="mute">Loading your desk…</p></main>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app'),who=document.getElementById('who'),qp=new URLSearchParams(location.search);
const day=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const dayY=d=>new Date(d).toLocaleDateString('en-GB',{month:'short',year:'numeric'});
const post=(url,body)=>fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(async r=>({ok:r.ok,data:await r.json().catch(()=>({}))}));
const greet=()=>{const h=new Date().getHours();return h<12?'Morning':h<18?'Afternoon':'Evening'};
let D=null,ME=null;

async function syncTracker(){
  // The programme tracker keeps its shortlist in this browser; copy it to the Desk so it shows here and on other devices.
  try{const list=JSON.parse(localStorage.getItem('desk_mylist')||'{}');if(list&&typeof list==='object'&&Object.keys(list).length)await post('/api/desk-home',{action:'tracker-sync',list});}catch(e){}
}
async function load(){
  await syncTracker();
  const [d,me]=await Promise.all([fetch('/api/desk-home',{credentials:'same-origin'}).then(r=>r.ok?r.json():null).catch(()=>null),fetch('/api/value-account?view=me',{credentials:'same-origin'}).then(r=>r.ok?r.json():null).catch(()=>null)]);
  if(!d){app.innerHTML='<div class="card">We couldn’t load your desk. Refresh to try again.</div>';return}
  D=d;ME=me||{items:[]};
  try{if(d.report?.url){localStorage.setItem('desk-report-url',d.report.url);document.querySelectorAll('.desk-nav a').forEach(a=>{if(a.textContent==='Report')a.href=d.report.url})}}catch(e){}
  render();
}
function headerBits(){
  const parts=[];
  if(D.member)parts.push(`<span class="pill">Member${D.until?' until '+esc(dayY(D.until)):''}</span>`);
  else if(D.report)parts.push(`<button class="btn hot" id="join" style="min-height:40px;padding:9px 16px">Become a member · £89 a year</button>`);
  if(D.signedIn)parts.push(`<span>${esc(D.email)}</span><button class="btn ghost" id="out" style="min-height:36px;padding:6px 12px">Sign out</button>`);
  who.innerHTML=parts.join('');
}
function panelBand(){
  const P=D.practitioners;if(!P)return '';
  const q=P.question;let ask;
  if(q&&q.answered)ask=`<div class="ask"><b>${esc(q.by||'The panel')} answered your question.</b><a class="btn" href="/practitioner-answer.html?id=${encodeURIComponent(q.id)}">Read the answer</a></div>`;
  else if(q)ask=`<div class="ask"><b>Your question is with the panel.</b><span>Answer due by ${esc(new Date(q.dueAt).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'}))}.</span></div>`;
  else if(P.canAsk&&D.report)ask=`<div class="ask"><b>Your membership includes one question to the panel.</b><span>Ask about your CV, a firm or an interview. Answered within 48 hours.</span><a class="btn" href="${esc(D.report.url)}#ask">Ask the panel</a></div>`;
  else if(!D.member)ask=`<div class="ask"><b>Members put a question to the panel.</b><span>Answered by one of them within 48 hours, plus a call to talk it through.</span>${D.report?'<button class="btn hot" id="join3">£89 for the whole year</button>':''}</div>`;
  else ask=`<div class="ask"><b>Your panel question has been used.</b><span>Members also get a call with a practitioner.</span></div>`;
  if(D.member&&ME.call)ask=ask.replace('</div>',`<a class="btn ghost" href="${esc(ME.call.url)}" target="_blank" rel="noopener">${esc(ME.call.label)}</a></div>`);
  return `<section class="card panel"><div><div class="kicker">Your practitioner panel</div><h2 style="margin-top:6px">Built on what people who’ve hired for banks actually look for.</h2>
    <p class="mute" style="margin:6px 0 0">The scoring, the tips and the interview feedback on your Desk use points our practitioners have checked and approved${P.approved>=50?` (${P.approved.toLocaleString('en-GB')} so far)`:''}. Where they disagree with popular advice, we tell you.</p>
    <div class="faces">${P.panel.map(m=>`<div class="face${m.name===P.lead.name?' lead':''}" title="${esc(m.firms)}"><span class="av" aria-hidden="true">${esc(m.init)}</span><span><b>${esc(m.name)}</b>${m.name===P.lead.name?' · <span style="color:var(--accent-ink);font-weight:700">your route</span>':''}<br><span class="mute" style="font-size:12px">${esc(m.firms)}</span></span></div>`).join('')}</div></div>
    ${ask}</section>`;
}
function readinessCard(){
  const r=D.readiness;
  if(!r)return `<div class="hero span2"><div><div class="kicker">Readiness score</div><p style="font:500 26px/1.25 Fraunces,Georgia,serif;margin:10px 0 0">You don’t have a score yet.</p><p style="color:#cfd6db;font-size:14px">The free assessment reads your CV against your target route and gives you a readiness score and your top 3 fixes. About 10 minutes.</p><a class="btn hot" href="/assessment.html" style="margin-top:6px">Take the free assessment</a></div><div><div class="kicker">How it moves</div><p style="color:#cfd6db;font-size:14px;margin:10px 0 0">Your score changes only when you prove something: a recheck of an improved CV, or a better result on a fresh test. Practice and ticked-off tasks show in your progress, not your score.</p></div></div>`;
  const gap=r.score>=75?'':r.score>=65?`${75-r.score} points from Competitive`:`${65-r.score} points from Borderline`;
  return `<div class="hero span2"><div><div class="kicker">Readiness score</div><div style="display:flex;align-items:baseline;gap:12px;margin-top:8px"><div class="big">${r.score}</div><div><div style="font-size:18px;font-weight:700">${esc(r.band)}</div><div style="font-size:14px;color:#cfd6db">${esc(gap)}</div></div></div>
    ${r.change?`<div class="up ${r.change<0?'down':''}">${r.change>0?'+':''}${r.change} since your first assessment</div>`:''}
    <p style="margin:12px 0 0;font-size:13px;color:#cfd6db">Moves only when you prove something: a recheck of a better CV, or better test results (your best of the last 3 tests counts).</p><p style="margin:8px 0 0;font-size:13px"><a href="/how-we-score.html" style="color:#ffb38f">Scoring framework set by our practitioners →</a></p></div>
    <div><div class="kicker">What moved it</div><div style="margin-top:6px">${r.timeline.map(t=>`<div class="tl"><span>${esc(day(t.at))} · ${esc(t.note)}</span><b>${t.score}</b></div>`).join('')}</div>
    <p style="margin:8px 0 0;font-size:13px;color:#cfd6db">${D.member?'Next: recheck after your CV rewrites, or take a fresh test.':'Next: take a fresh test. Members can also recheck their CV.'}</p></div></div>`;
}
function sideCard(){
  if(D.member){
    let p=null;try{const x=JSON.parse(localStorage.getItem('desk-progress')||'null');if(x&&x.id===D.report?.assessmentId)p=x}catch(e){}
    return `<div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="kicker">Prep progress</div>
      ${p?`<div style="font:500 34px Fraunces,Georgia,serif">${p.done} <span style="font-size:18px;color:var(--mute)">of ${p.tot} actions</span></div><div class="bar"><i style="width:${p.tot?Math.round(p.done/p.tot*100):0}%"></i></div>`:`<p style="margin:0;font-size:14px;color:#3b4652">Tick off tasks in your report’s plan and checklist. Your progress shows here.</p>`}
      <a href="${esc(D.report.url)}#plan" style="font-weight:700;font-size:14px;margin-top:auto">Open your plan →</a></div>`;
  }
  return `<div class="card" style="background:var(--warm);border-color:var(--warm-line);display:flex;flex-direction:column;gap:10px"><div class="kicker" style="color:#9a3412">Members get</div>
    <ul style="margin:0;padding-left:18px;font-size:14px;line-height:1.6;color:#3b4652"><li>Your weakest CV lines rewritten</li><li>7 model interview answers from your CV</li><li>Interview practice with follow-up questions, up to ${60} a day</li><li>A 30-day plan and CV rechecks all year</li><li>Unlimited fresh tests</li><li>A call with a practitioner</li></ul>
    ${D.report?`<button class="btn hot" id="join2" style="margin-top:auto">£89 for the whole year</button>`:`<a class="btn hot" href="/assessment.html" style="margin-top:auto">Start with the free assessment</a>`}</div>`;
}
function actionsCard(){
  if(!D.actions.length)return '';
  return `<section class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><h2>Your next ${D.actions.length===1?'action':D.actions.length+' actions'}</h2><span class="mute">From your report, applications and practice</span></div>
    <div class="grid3" style="margin-top:14px">${D.actions.map(a=>`<a class="act${a.urgent?' urgent':''}" href="${esc(a.href)}"><span class="kicker">${esc(a.tag)}</span><b>${esc(a.title)}</b><span class="d">${esc(a.detail)}</span>${a.note?`<span class="pnote"><span class="av" aria-hidden="true">${esc(a.note.init||'TD')}</span><span><b>${a.note.by?esc(a.note.by.split(' ')[0])+'’s note':'Practitioner note'}:</b> ${esc(a.note.text)}</span></span>`:''}</a>`).join('')}</div></section>`;
}
function toolsRow(){
  const R=D.report,T=D.tests,I=D.interview,b=R?.breakdown;
  const report=R?`<div class="card tool"><div style="display:flex;justify-content:space-between;align-items:baseline"><h3>${R.paid?'Your report':'Your result'}</h3><span class="mute">${R.paid?'Full Cycle':'Free'}</span></div>
      ${b?`<div class="row"><span>CV and evidence</span><b>${(b.application||0)+(b.ats||0)}/40</b></div><div class="row"><span>Competencies</span><b>${b.competency||0}/25</b></div><div class="row"><span>Tests (from your assessment)</span><b>${(b.numerical||0)+(b.technical||0)}/35</b></div>`:''}
      ${R.paid?`<div class="row"><span>Rechecks used</span><b>${R.rechecks}</b></div>`:`<p class="lock" style="margin:0">CV rewrites, model answers and your plan open with membership.</p>`}
      <a class="btn" href="${esc(R.url)}">${R.paid?'Open your report':'See your result'}</a></div>`
    :`<div class="card tool"><h3>Your report</h3><p class="mute" style="margin:0">Starts with the free assessment: your CV read against your target route.</p><a class="btn" href="/assessment.html">Take the free assessment</a></div>`;
  const rec=I.recent;const max=Math.max(100,...rec);
  const interview=`<div class="card tool"><div style="display:flex;justify-content:space-between;align-items:baseline"><h3>Interview</h3><span class="mute">${I.leftToday!=null?I.leftToday+' feedback'+(I.leftToday===1?'':'s')+' left today':''}</span></div>
      ${rec.length?`<div class="spark" aria-hidden="true">${rec.map(s=>`<i style="height:${Math.max(8,Math.round(s/max*100))}%"></i>`).join('')}</div><div style="font-size:14px;color:#3b4652">Last ${rec.length} answer${rec.length===1?'':'s'}: ${rec.join(' → ')}. Tracked separately from your readiness score.</div>`:`<p style="margin:0;font-size:14px;color:#3b4652">Answer real interview questions on camera, timed like HireVue, and get feedback on structure, evidence and delivery.</p>`}
      <a class="btn hot" href="/interview-start.html">${rec.length?'Practise next question':'Practise a question'}</a></div>`;
  const tests=`<div class="card tool"><div style="display:flex;justify-content:space-between;align-items:baseline"><h3>Tests</h3><span class="mute">${esc(D.profile.targetSector||'Your route')}</span></div>
      ${T.last?`<div class="row"><span>Commercial</span><b>${T.last.commercial}/5</b></div><div class="bar" style="height:6px"><i style="width:${T.last.commercial*20}%"></i></div><div class="row"><span>Numerical</span><b>${T.last.numerical}/5</b></div><div class="bar" style="height:6px"><i style="width:${T.last.numerical*20}%"></i></div><div class="mute">Last test ${esc(day(T.last.at))}</div>`:`<p style="margin:0;font-size:14px;color:#3b4652">10 fresh questions for your route from a bank of over 2,000. A better score moves your readiness.</p>`}
      ${T.freeEveryDays?`<p class="lock" style="margin:0">Free: one fresh test a week. Members: unlimited.</p>`:''}
      <a class="btn ghost" href="/tests.html">Take a fresh test · about 8 min</a></div>`;
  return `<section class="grid3">${report}${interview}${tests}</section>`;
}
function appsCard(){
  const A=D.applications,stages=D.stages;const today=new Date();today.setHours(0,0,0,0);
  const due=a=>{if(!a.deadline)return a.rolling?'Rolling':'—';const x=new Date(a.deadline+'T00:00:00');const n=Math.round((x-today)/864e5);const t=x.toLocaleDateString('en-GB',{day:'numeric',month:'short'});return n<0?`<span class="mute">Closed ${t}</span>`:n<=7&&['Shortlisted','Preparing'].includes(a.stage)?`<span class="due">${t} · ${n===0?'today':n+' day'+(n===1?'':'s')}</span>`:t};
  const prep=a=>{const l=[];if(D.report?.paid)l.push(`<a href="${esc(D.report.url)}#prep">Firm prep</a>`);l.push(`<a href="/interview-start.html">Practise</a>`);if(a.url)l.push(`<a href="${esc(a.url)}" target="_blank" rel="noopener">Apply ↗</a>`);return l.join(' · ')};
  return `<section class="card span2" id="applications"><div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px"><h3>Applications</h3><span style="display:flex;gap:14px;font-size:14px;font-weight:700"><a href="/tracker.html">Find programmes in the tracker</a><a href="#" id="addToggle">+ Add another firm</a></span></div>
    <form class="add" id="addForm" hidden><input name="firm" placeholder="Firm" required aria-label="Firm"><input name="programme" placeholder="Programme" aria-label="Programme"><input name="deadline" type="date" aria-label="Deadline"><select name="stage" aria-label="Stage">${stages.map(s=>`<option>${esc(s)}</option>`).join('')}</select><button class="btn">Add</button></form>
    ${A.length?`<div class="scroll" style="margin-top:10px"><table><thead><tr><th>FIRM</th><th>STAGE</th><th>DEADLINE</th><th>PREP</th><th><span class="mute" style="font-size:11px">REMOVE</span></th></tr></thead><tbody>${A.map(a=>`<tr><td><b>${esc(a.firm)}</b>${a.programme?`<div class="mute">${esc(a.programme)}</div>`:''}</td><td><select data-stage="${esc(a.id)}" aria-label="Stage for ${esc(a.firm)}">${stages.map(s=>`<option ${s===a.stage?'selected':''}>${esc(s)}</option>`).join('')}</select></td><td>${due(a)}</td><td>${prep(a)}</td><td><button class="btn ghost" data-del="${esc(a.id)}" aria-label="Remove ${esc(a.firm)}" style="min-height:32px;padding:4px 10px">×</button></td></tr>`).join('')}</tbody></table></div>`
      :`<p class="mute" style="margin:10px 0 0">Nothing yet. Add programmes from the <a href="/tracker.html">tracker</a> (live deadlines for 60+ programmes) or add a firm yourself.</p>`}
    <p class="mute" style="margin:10px 0 0">Programmes you add in the tracker appear here. ${D.signedIn?'Saved to your account.':'Saved in this browser. Sign in to keep them on every device.'}</p></section>`;
}
function mythCard(){
  const m=D.practitioners?.myth;if(!m)return '';
  return `<section class="card myth"><div class="kicker">Advice our practitioners disagree with</div><p style="margin:0;font-size:14px"><s>${esc(m.myth)}</s></p><div class="pnote" style="margin-top:0"><span class="av" aria-hidden="true">${esc(m.init||'TD')}</span><span><b>${m.by?esc(m.by)+' says':'Our view'}:</b> ${esc(m.view)}</span></div></section>`;
}
function newsCard(){
  return `<section class="card" id="news" style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;align-items:baseline"><h3>News on your firms</h3><span class="mute">Daily</span></div>
    <div class="news" id="newsList">${D.news.length?'<p class="mute">Loading…</p>':'<p class="mute" style="margin:0">Add a firm to your applications to see its latest news here. Covered so far: Barclays, BofA, Deutsche Bank, EY, Goldman Sachs, J.P. Morgan, PwC and UBS.</p>'}</div></section>`;
}
async function loadNews(){
  const box=document.getElementById('newsList');if(!box||!D.news.length)return;
  const all=await Promise.all(D.news.map(n=>fetch('/api/interview-news?firm='+encodeURIComponent(n.key)).then(r=>r.ok?r.json():null).catch(()=>null).then(x=>({firm:n.firm,items:(x?.items||[]).slice(0,2)}))));
  const rows=all.flatMap(x=>x.items.map(i=>({...i,firm:x.firm})));
  box.innerHTML=rows.length?rows.slice(0,5).map(i=>`<a href="${esc(i.url)}" target="_blank" rel="noopener"><span class="mute" style="font-weight:700;font-size:12px">${esc(i.firm)}${i.publishedAt?' · '+esc(day(i.publishedAt)):''}</span><br>${esc(i.title)}</a>`).join(''):'<p class="mute" style="margin:0">No fresh news from your firms’ newsrooms right now.</p>';
}
function extrasRow(){
  const ints=(ME.items||[]).filter(i=>i.kind==='interview');
  const call='';
  const signin=D.signedIn?'':`<div class="card"><h3>Keep your desk on every device</h3><p class="mute" style="margin:6px 0 0">Everything here is saved in this browser. Sign in with your email (no password) to open it on your phone and laptop.</p><form class="signin" id="signin"><input type="email" id="email" required placeholder="you@university.ac.uk" autocomplete="email" aria-label="Email address"><button class="btn">Email me a sign-in link</button></form><p class="mute" id="smsg" role="status"></p></div>`;
  const saved=ints.length?`<details class="card"><summary>Your saved interview answers (${ints.length})</summary><div style="margin-top:8px">${ints.slice(0,20).map(i=>{const f=i.data.feedback||{};return `<details class="ans"><summary>${esc(i.data.followUp?'Follow-up: ':'')}${esc(i.data.question)} <span style="color:var(--accent-ink);margin-left:6px">${f.overall??''}</span></summary><p class="mute">${esc(day(i.createdAt))}${i.data.firm?' · '+esc(i.data.firm):''}</p>${f.verdictTitle?`<p style="font-size:14px"><b>${esc(f.verdictTitle)}</b> ${esc(f.verdict||'')}</p>`:''}${(f.fixes||[]).length?`<p style="font-size:14px"><b>Fix next time:</b> ${f.fixes.map(x=>esc(x.fix)).join(' ')}</p>`:''}<p class="mute">Your answer: ${esc(i.data.transcript)}</p><button class="btn ghost" data-delans="${esc(i.id)}" style="min-height:32px;padding:4px 12px">Delete</button></details>`}).join('')}</div></details>`:'';
  const outcome=`<div class="card" style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between"><div style="font-size:14px"><b>Had an interview?</b><br>Tell us what you were asked. Two minutes, and it keeps the firm guides accurate.</div><button class="btn ghost" id="outcome">How did it go?</button></div>`;
  return signin+call+saved+outcome;
}
function render(){
  headerBits();
  const name=D.profile.firstName;
  const target=[D.profile.targetFirm,D.profile.targetDivision||D.profile.targetSector,D.profile.programme].filter(Boolean).join(' · ');
  app.innerHTML=`${qp.get('signed_in')?'<div class="notice">You’re signed in. Your desk is now saved to your account.</div>':''}${qp.get('link')==='expired'?'<div class="notice">That sign-in link has expired or was already used. Ask for a new one below.</div>':''}
    <div style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px"><h1>${esc(greet())}${name?', '+esc(name):''}.</h1><div class="mute">${D.member?'':'Free account'}${!D.member&&target?' · ':''}${esc(target)}</div></div>
    <section class="grid3">${readinessCard()}${sideCard()}</section>
    ${panelBand()}
    ${actionsCard()}${toolsRow()}
    <section class="grid3">${appsCard()}<div style="display:flex;flex-direction:column;gap:16px">${mythCard()}${newsCard()}</div></section>
    ${extrasRow()}`;
  bind();loadNews();
  if(location.hash){const t=document.querySelector(location.hash);if(t)t.scrollIntoView()}
}
async function join(){
  const id=D.report?.assessmentId;if(!id){location.href='/assessment.html';return}
  const r=await post('/api/start-checkout',{assessmentId:id});
  if(r.ok&&r.data.url)location.href=r.data.url;else location.href=D.report.url;
}
function bind(){
  ['join','join2','join3'].forEach(id=>{const b=document.getElementById(id);if(b)b.onclick=join});
  const o=document.getElementById('out');if(o)o.onclick=async()=>{await post('/api/value-account',{action:'signout'});location.href='/my.html'};
  const s=document.getElementById('signin');if(s)s.onsubmit=async e=>{e.preventDefault();const r=await post('/api/value-account',{action:'request',email:document.getElementById('email').value,next:'/my.html'});document.getElementById('smsg').textContent=r.ok?'Check your inbox for the link (and your spam folder). It works for 30 minutes.':(r.data.error||'Something went wrong.')};
  const t=document.getElementById('addToggle'),f=document.getElementById('addForm');
  if(t)t.onclick=e=>{e.preventDefault();f.hidden=!f.hidden;if(!f.hidden)f.firm.focus()};
  if(f)f.onsubmit=async e=>{e.preventDefault();const r=await post('/api/desk-home',{action:'app-save',firm:f.firm.value,programme:f.programme.value,deadline:f.deadline.value,stage:f.stage.value});if(!r.ok)return alert(r.data.error||'Could not add that.');load()};
  document.querySelectorAll('[data-stage]').forEach(sel=>sel.onchange=async()=>{
    const id=sel.dataset.stage,a=D.applications.find(x=>x.id===id);if(!a)return;
    if(id.startsWith('t:')){try{const l=JSON.parse(localStorage.getItem('desk_mylist')||'{}');if(l[id.slice(2)]){l[id.slice(2)]={stage:sel.value};localStorage.setItem('desk_mylist',JSON.stringify(l))}}catch(e){}await post('/api/desk-home',{action:'app-stage',id,stage:sel.value})}
    else await post('/api/desk-home',{action:'app-save',id,firm:a.firm,programme:a.programme,deadline:a.deadline,url:a.url,notes:a.notes,stage:sel.value});
    load()});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.del;if(!confirm('Remove this application?'))return;
    if(id.startsWith('t:')){try{const l=JSON.parse(localStorage.getItem('desk_mylist')||'{}');delete l[id.slice(2)];localStorage.setItem('desk_mylist',JSON.stringify(l))}catch(e){}}
    await post('/api/desk-home',{action:'app-delete',id});load()});
  document.querySelectorAll('[data-delans]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this answer?'))return;await post('/api/value-account',{action:'delete-item',id:b.dataset.delans});load()});
  const oc=document.getElementById('outcome');if(oc)oc.onclick=()=>window.DeskOutcome&&window.DeskOutcome.open({});
}
load();
</script>
</body>
</html>
