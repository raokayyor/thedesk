<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>The Desk — Assessment</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;background:#F7F3EE;color:#1A1714}.wrap{max-width:760px;margin:0 auto;padding:32px 20px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.logo{font-family:'Fraunces',serif;font-size:22px;text-decoration:none;color:#1A1714}.logo em{color:#B85C38;font-style:italic}.progress{font-size:12px;color:#777}.card{background:#fff;border:1px solid rgba(26,23,20,.08);border-radius:12px;padding:28px;margin-bottom:20px}h1,h2{font-family:'Fraunces',serif;font-weight:300}h1{font-size:42px;margin:0 0 10px}h2{font-size:28px;margin:0 0 18px}.sub{color:#666;line-height:1.6;margin-bottom:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}input,select,textarea{width:100%;padding:12px;border:1px solid #d9d5cf;border-radius:8px;background:#fff;font:inherit}textarea{min-height:220px;resize:vertical}.upload{display:block;border:2px dashed #cfc9c0;border-radius:10px;padding:24px;text-align:center;color:#666;cursor:pointer;margin-top:8px}.upload input{display:none}.q{margin-bottom:22px}.q p{font-weight:600;line-height:1.45}.opts label{display:block;font-weight:400;padding:8px 10px;border:1px solid #e4e0db;border-radius:7px;margin:7px 0;cursor:pointer}.opts input{width:auto;margin-right:8px}.actions{display:flex;justify-content:space-between;gap:12px}.btn{border:0;border-radius:8px;padding:13px 20px;font:inherit;cursor:pointer}.primary{background:#1A1714;color:#fff}.secondary{background:#ece8e2}.hidden{display:none}.status{margin-top:12px;font-size:13px;color:#666}.err{color:#b42318}@media(max-width:640px){.grid{grid-template-columns:1fr}.card{padding:20px}h1{font-size:34px}.actions{flex-direction:column-reverse}.btn{width:100%}}</style></head><body><div class="wrap"><div class="top"><a class="logo" href="/">The<em>Desk</em></a><div class="progress" id="progress">Step 1 of 3</div></div>
<section class="step" id="s1"><div class="card"><h1>Your application profile</h1><p class="sub">Give us the context a recruiter will see first.</p><div class="field"><label>Name</label><input id="name" placeholder="Your name"></div><div class="grid"><div class="field"><label>University</label><input id="uni" placeholder="e.g. University of Bristol"></div><div class="field"><label>Course</label><input id="course" placeholder="e.g. Economics"></div><div class="field"><label>Grade</label><select id="grade"><option>First Class (predicted)</option><option>First Class</option><option selected>2:1 (predicted)</option><option>2:1</option><option>2:2 (predicted)</option><option>2:2</option><option>Third</option></select></div><div class="field"><label>Year</label><select id="year"><option>1st Year</option><option>2nd Year</option><option>Final Year</option><option>Graduate</option></select></div><div class="field"><label>Target firm</label><select id="firm"><option>Goldman Sachs</option><option>JP Morgan</option><option>Morgan Stanley</option><option>Barclays</option><option>UBS</option><option>Lazard</option><option>Rothschild & Co</option><option>Other</option></select></div><div class="field"><label>Division</label><select id="division"><option>Investment Banking / IBD</option><option>Sales & Trading / Markets</option><option>Asset Management / Investing</option><option>Corporate Banking</option><option>General Finance</option></select></div></div><div class="actions"><span></span><button class="btn primary" onclick="go(2)">Continue →</button></div></div></section>
<section class="step hidden" id="s2"><div class="card"><h2>Your CV</h2><p class="sub">Paste the full text for the most reliable read, or upload the file.</p><textarea id="cvText" placeholder="Paste your CV here..."></textarea><label class="upload">Upload PDF or Word<input type="file" id="cvFile" accept=".pdf,.doc,.docx"></label><div id="fileName" class="status"></div><div class="actions"><button class="btn secondary" onclick="go(1)">← Back</button><button class="btn primary" onclick="go(3)">Continue →</button></div></div></section>
<section class="step hidden" id="s3"><div class="card"><h2>Two short tests</h2><p class="sub">Five commercial-awareness questions and five numerical-reasoning questions.</p><div id="quiz"></div><div class="actions"><button class="btn secondary" onclick="go(2)">← Back</button><button id="submitBtn" class="btn primary" onclick="submitAssessment()">Get my Desk MOT →</button></div><div id="status" class="status"></div></div></section></div>
<script>
const commercial=[['If the Bank of England unexpectedly raises rates, which is the most direct likely effect?',['Borrowing costs rise','Government spending automatically rises','Equity prices must rise','Inflation instantly falls to zero'],0],['A company issues new shares. What is the most direct effect on existing shareholders?',['Possible dilution','Guaranteed dividend increase','Debt always rises','Revenue doubles'],0],['EBITDA is best described as:',['Profit before interest, tax, depreciation and amortisation','Cash in the bank','Revenue after tax','Market capitalisation'],0],['In M&A, a strategic buyer is usually:',['An operating company buying another business','A retail investor','A bondholder','A regulator'],0],['A widening credit spread usually signals:',['Higher perceived credit risk','Lower perceived credit risk','Guaranteed rate cuts','Higher dividends'],0]];
const numerical=[['Revenue rises from £80m to £100m. Percentage increase?',['20%','25%','30%','40%'],1],['A £200 share falls 15%. New price?',['£160','£165','£170','£175'],2],['EBITDA is £30m and EV/EBITDA is 8x. Enterprise value?',['£180m','£210m','£240m','£300m'],2],['Debt £120m, cash £20m. Net debt?',['£80m','£100m','£120m','£140m'],1],['A margin rises from 10% to 12%. Increase in percentage points?',['1','2','10','20'],1]];
function render(){let h='<h3>Commercial awareness</h3>';commercial.forEach((q,i)=>{h+=`<div class="q"><p>${i+1}. ${q[0]}</p><div class="opts">${q[1].map((o,j)=>`<label><input type="radio" name="c${i}" value="${j}">${o}</label>`).join('')}</div></div>`});h+='<h3>Numerical reasoning</h3>';numerical.forEach((q,i)=>{h+=`<div class="q"><p>${i+1}. ${q[0]}</p><div class="opts">${q[1].map((o,j)=>`<label><input type="radio" name="n${i}" value="${j}">${o}</label>`).join('')}</div></div>`});document.getElementById('quiz').innerHTML=h}render();
function go(n){if(n===2&&!document.getElementById('uni').value.trim()){alert('Please enter your university.');return}if(n===3&&!document.getElementById('cvText').value.trim()&&!document.getElementById('cvFile').files[0]){alert('Please paste or upload your CV.');return}document.querySelectorAll('.step').forEach(x=>x.classList.add('hidden'));document.getElementById('s'+n).classList.remove('hidden');document.getElementById('progress').textContent='Step '+n+' of 3';window.scrollTo(0,0)}
document.getElementById('cvFile').addEventListener('change',e=>{document.getElementById('fileName').textContent=e.target.files[0]?'Selected: '+e.target.files[0].name:''});
function score(group,qs){let s=0;for(let i=0;i<qs.length;i++){const x=document.querySelector(`input[name="${group}${i}"]:checked`);if(!x)return null;if(Number(x.value)===qs[i][2])s++}return s}
async function submitAssessment(){const cs=score('c',commercial),ns=score('n',numerical);const status=document.getElementById('status');if(cs===null||ns===null){status.className='status err';status.textContent='Please answer all 10 questions.';return}const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Analysing...';status.className='status';status.textContent='Reading your application...';const profile={name:document.getElementById('name').value.trim(),university:document.getElementById('uni').value.trim(),course:document.getElementById('course').value.trim(),year:document.getElementById('year').value,grade:document.getElementById('grade').value,targetFirm:document.getElementById('firm').value,targetDivision:document.getElementById('division').value,programme:'Summer Internship',track:document.getElementById('division').value};const quiz={commercialCorrect:cs,commercialTotal:5,technicalCorrect:ns,technicalTotal:5};const cvText=document.getElementById('cvText').value.trim(),file=document.getElementById('cvFile').files[0];try{let resp;if(file&&!cvText){const fd=new FormData();fd.append('profile',JSON.stringify(profile));fd.append('quiz',JSON.stringify(quiz));fd.append('cvFile',file);resp=await fetch('/api/analyse-mot',{method:'POST',body:fd})}else{resp=await fetch('/api/analyse-mot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile,quiz,cv:{fileName:'pasted.txt',text:cvText}})})}const data=await resp.json();if(!resp.ok||!data.success||!data.result)throw new Error(data.message||data.error||'Assessment failed');const motData={result:data.result,name:profile.name,firm:profile.targetFirm,div:profile.targetDivision,uni:profile.university,crs:profile.course,gr:profile.grade,fS:cs,nS:ns,cvText,profile,quiz};sessionStorage.setItem('tdesk_r',JSON.stringify(motData));window.location.href='/thedesk_mot.html'}catch(e){status.className='status err';status.textContent=e.message;btn.disabled=false;btn.textContent='Get my Desk MOT →'}}
</script></body></html>
