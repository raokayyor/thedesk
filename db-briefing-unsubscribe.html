<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Leave the DB briefing list | The Desk</title><link rel="stylesheet" href="/programme-guides.css"></head><body><main><div class="hero"><a class="logo" href="/">The Desk</a><h1>Leave the DB briefing list.</h1><p>Remove your email address from the weekly DB briefing launch list.</p><button class="btn" id="leave">Leave the list</button><p id="status" role="status"></p><a href="/deutsche-bank.html#news">Back to DB news →</a></div></main><script type="module">const button=document.getElementById('leave'),status=document.getElementById('status');button.onclick=async()=>{button.disabled=true;try{const response=await fetch('/api/db-briefing-unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:new URLSearchParams(location.search).get('token')})});const result=await response.json();if(!response.ok||!result.success)throw Error(result.error||'Could not remove your address. Please retry.');status.textContent='You have left the DB briefing list.';}catch(e){status.textContent=e.message;button.disabled=false;}};</script></body></html>
