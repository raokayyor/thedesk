<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Full Cycle Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Source+Sans+3:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f4ee;--card:#fffdfa;--ink:#0d1620;--ink2:#3d4954;--mute:#6b7682;--rule:#e3ddd3;--rule2:#d4ccbf;
  --or:#d9480f;--or-soft:#ffe8dc;--or-ink:#a8360a;--gr:#1f6f5c;--gr-soft:#e4f1ec;--hl:#fff0b8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11171d;--card:#182028;--ink:#eef0ee;--ink2:#c3cad0;--mute:#8d98a2;--rule:#2a343d;--rule2:#36424c;
  --or:#ff7a3d;--or-soft:#3a2418;--or-ink:#ffab80;--gr:#5cc3a3;--gr-soft:#16302a;--hl:#4a3f12;}}
:root[data-theme="dark"]{--paper:#11171d;--card:#182028;--ink:#eef0ee;--ink2:#c3cad0;--mute:#8d98a2;--rule:#2a343d;--rule2:#36424c;--or:#ff7a3d;--or-soft:#3a2418;--or-ink:#ffab80;--gr:#5cc3a3;--gr-soft:#16302a;--hl:#4a3f12;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Source Sans 3",Arial,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.serif{font-family:Lora,Georgia,serif}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--or)}
.mute{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:1280px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
.logo{font-family:Lora,Georgia,serif;font-size:22px;font-weight:600;text-decoration:none;letter-spacing:-.01em}
.logo i{color:var(--or);font-weight:500}
.top-meta{font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.tag{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--rule2);padding:4px 8px;border-radius:3px;color:var(--mute)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);border:0;border-radius:4px;padding:10px 16px;font-weight:700;font-size:15px;text-decoration:none}
.btn.or{background:var(--or);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule2)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* layout */
.wrap{max-width:1280px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:48px}
nav.side{position:sticky;top:64px;align-self:start;padding:32px 0;max-height:calc(100vh - 64px);overflow:auto}
.side ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.side a{display:grid;grid-template-columns:26px 1fr auto;align-items:baseline;gap:6px;padding:8px 10px;border-radius:4px;text-decoration:none;font-size:15px;color:var(--ink2)}
.side a .n{font-size:12px;font-weight:700;color:var(--mute)}
.side a .c{font-size:12px;color:var(--mute)}
.side a:hover{background:var(--card)}
.side a.on{background:var(--ink);color:var(--paper)}
.side a.on .n,.side a.on .c{color:inherit;opacity:.7}
.side .prog{margin-top:22px;padding:14px 10px;border-top:1px solid var(--rule)}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--or);width:0;transition:width .3s}
main{padding:36px 0 80px;min-width:0}
section.pane{display:none}
section.pane.on{display:block}
h1,h2{font-family:Lora,Georgia,serif;font-weight:500;letter-spacing:-.01em;margin:0}
h1{font-size:44px;line-height:1.08}
h2{font-size:34px;line-height:1.12}
h3{font-size:20px;line-height:1.3;margin:0}
.lede{font-size:19px;color:var(--ink2);max-width:46em;margin:12px 0 0}
.card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:24px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}.mt48{margin-top:48px}
.label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:56px;padding-top:20px;border-top:1px solid var(--rule)}
.pager a{text-decoration:none;font-weight:700;font-size:15px}
.pager a span{display:block;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}

/* overview */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:start}
.score{display:flex;align-items:flex-end;gap:14px}
.score .big{font-size:120px;font-weight:800;line-height:.8;letter-spacing:-.04em}
.score .of{font-size:22px;color:var(--mute);padding-bottom:6px}
.band{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--or-soft);color:var(--or-ink);padding:5px 10px;border-radius:3px}
.scale{position:relative;height:10px;margin:22px 0 6px;background:linear-gradient(90deg,var(--rule2) 0 65%,#f2c9b3 65% 75%,#b9dccd 75% 100%);border-radius:5px}
.scale i{position:absolute;top:-6px;width:4px;height:22px;background:var(--ink);border-radius:2px}
.scale-l{position:relative;height:18px;font-size:12px;color:var(--mute)}
.scale-l span{position:absolute;top:0;white-space:nowrap}
.pts{display:grid;gap:14px}
.pt-row{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:12px;align-items:center;font-size:15px}
.pt-track{height:14px;background:var(--rule);border-radius:2px;position:relative;overflow:hidden}
.pt-track b{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.pt-track s{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--or) 0 3px,transparent 3px 7px);opacity:.55}
.pt-miss{font-weight:700;color:var(--or-ink);text-align:right}
.fix{border-left:4px solid var(--or);padding:4px 0 4px 20px}
.fix p{font-family:Lora,Georgia,serif;font-size:22px;line-height:1.4;margin:6px 0 0}
.prio{list-style:none;margin:0;padding:0;counter-reset:p;display:grid;gap:0}
.prio li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:18px 0;border-top:1px solid var(--rule)}
.prio li:before{counter-increment:p;content:counter(p,decimal-leading-zero);font-weight:800;font-size:15px;color:var(--or);padding-top:2px}
.prio h3{font-size:19px}
.prio p{margin:6px 0 0;color:var(--ink2);font-size:16px}
.prio a{font-size:14px;font-weight:700;color:var(--or-ink)}
.route{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.steps span{font-size:13px;border:1px solid var(--rule2);border-radius:3px;padding:3px 8px}
.status{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gr)}
.verdict{font-family:Lora,Georgia,serif;font-size:19px;line-height:1.55;color:var(--ink2)}

/* CV */
.cv-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.paper{background:#fff;color:#111;border:1px solid var(--rule);box-shadow:0 10px 30px rgba(13,22,32,.07);padding:44px 52px;font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.5}
.paper .nm{font-size:26px;text-align:center;letter-spacing:.02em}
.paper .ct{text-align:center;font-size:13px;color:#555;margin-top:2px}
.paper .sec{font-family:"Source Sans 3",Arial,sans-serif;font-size:12px;font-weight:800;letter-spacing:.14em;margin:22px 0 6px;padding-bottom:4px;border-bottom:1px solid #222}
.paper .role{font-weight:700;margin-top:10px}
.paper .ln{margin:4px 0;padding-left:14px;position:relative}
.paper .ln:before{content:"";position:absolute;left:2px;top:.7em;width:4px;height:4px;background:#333;border-radius:50%}
.paper .ln.plain{padding-left:0}.paper .ln.plain:before{display:none}
.ln.new{background:linear-gradient(90deg,#fff3ec,#fff 70%);margin-left:-14px;padding-left:28px;border-left:3px solid #d9480f}
.ln.new:before{left:16px}
.ln .orig{display:none;color:#8a8f94;text-decoration:line-through;font-size:13.5px;margin-top:4px}
.ln.show-orig .orig{display:block}
.ln .tools{font-family:"Source Sans 3",Arial,sans-serif;font-size:12px;margin-top:4px;display:flex;gap:12px}
.ln .tools button{background:none;border:0;padding:0;color:#a8360a;font-weight:700}
.cut{text-decoration:line-through;text-decoration-color:#d9480f;text-decoration-thickness:2px;color:#9aa0a6}
.cut.kept{text-decoration:none;color:inherit}
.cutnote{font-family:"Source Sans 3",Arial,sans-serif;font-size:12px;font-weight:700;color:#a8360a;margin-left:6px;white-space:nowrap}
.cutnote button{background:none;border:0;padding:0;color:#a8360a;text-decoration:underline;font-weight:700;font-size:12px}
.q{background:#ffe9a8;border-bottom:2px dotted #b07b00;padding:0 3px;cursor:pointer;font-family:"Source Sans 3",Arial,sans-serif;font-size:13.5px;font-weight:600;color:#5a4300;border-radius:2px}
.q.done{background:#e4f1ec;border-bottom-color:#1f6f5c;color:#0f4a3b;font-family:Georgia,serif;font-size:15px;font-weight:400}
.side-notes{display:grid;gap:16px;position:sticky;top:84px}
.confirm-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.confirm-list li{font-size:14px;line-height:1.4;padding-left:22px;position:relative}
.confirm-list li:before{content:"";position:absolute;left:0;top:3px;width:12px;height:12px;border:1.5px solid var(--rule2);border-radius:2px}
.confirm-list li.done{color:var(--mute)}
.confirm-list li.done:before{background:var(--gr);border-color:var(--gr)}
.confirm-list li small{display:block;color:var(--mute);font-size:12px;font-weight:600}
.signoff{display:flex;gap:12px;align-items:flex-start}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:700;font-size:14px}
.pop{position:fixed;z-index:50;background:var(--card);border:1px solid var(--rule2);box-shadow:0 14px 40px rgba(0,0,0,.18);border-radius:6px;padding:16px;width:min(380px,calc(100vw - 32px));display:none}
.pop.on{display:block}
.pop textarea{width:100%;min-height:80px;margin-top:10px;font:inherit;font-size:15px;padding:8px;border:1px solid var(--rule2);border-radius:4px;background:var(--paper);color:var(--ink)}
.pop .row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.why-list{display:grid;gap:14px;margin-top:8px}
.why-list div{font-size:14px;line-height:1.45;color:var(--ink2)}
.why-list b{display:block;color:var(--ink);font-size:14px}

/* risks */
.risk{display:grid;grid-template-columns:110px minmax(0,1fr);gap:24px;padding:28px 0;border-top:1px solid var(--rule)}
.sev{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.sev.High{color:var(--or)}.sev.Medium{color:#b07b00}.sev.Low{color:var(--mute)}
.risk h3{font-family:Lora,Georgia,serif;font-weight:500;font-size:23px}
.risk .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:14px;font-size:15.5px;color:var(--ink2)}
.hier{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--card)}
.hier>div{padding:20px;border-left:1px solid var(--rule)}
.hier>div:first-child{border-left:0}
.hier .hd{font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding-bottom:10px;border-bottom:2px solid}
.hier .lead .hd{color:var(--gr);border-color:var(--gr)}
.hier .sup .hd{color:var(--ink2);border-color:var(--ink2)}
.hier .cutc .hd{color:var(--or);border-color:var(--or)}
.hier .it{padding:14px 0;border-bottom:1px solid var(--rule);font-size:15px}
.hier .it:last-child{border-bottom:0}
.hier .it b{display:block;line-height:1.35}
.hier .it p{margin:6px 0 0;color:var(--mute);font-size:14px}
.cutc .it b{text-decoration:line-through;text-decoration-color:var(--or)}
.fit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.fit .card h3{font-size:16px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.fit .like h3{color:var(--gr)}.fit .ques h3{color:var(--or)}

/* interview */
.iq{border:1px solid var(--rule);background:var(--card);border-radius:6px;margin-top:20px;overflow:hidden}
.iq-top{padding:24px 26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start}
.iq-top .qq{font-family:Lora,Georgia,serif;font-size:24px;line-height:1.3}
.timer{display:flex;align-items:center;gap:10px}
.timer .t{font-weight:800;font-size:20px;min-width:56px;text-align:right}
.iq-why{padding:0 26px 18px;color:var(--ink2);font-size:15.5px}
.iq-ab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--rule)}
.iq-ab>div{padding:20px 26px;font-size:15.5px}
.iq-ab .weak{background:color-mix(in srgb,var(--or-soft) 55%,transparent)}
.iq-ab .strong{background:color-mix(in srgb,var(--gr-soft) 70%,transparent);border-left:1px solid var(--rule)}
.iq-ab .label{color:inherit}
.iq-ab .weak .label{color:var(--or-ink)}.iq-ab .strong .label{color:var(--gr)}
.iq-ev{padding:14px 26px;border-top:1px solid var(--rule);font-size:14.5px;color:var(--ink2)}

/* competencies */
.comp{border-top:1px solid var(--rule)}
.comp:last-child{border-bottom:1px solid var(--rule)}
.comp-h{width:100%;display:grid;grid-template-columns:220px minmax(0,1fr) 70px 24px;gap:18px;align-items:center;padding:18px 4px;background:none;border:0;text-align:left}
.comp-h .nm{font-weight:700;font-size:17px}
.comp-h .nm small{display:block;font-weight:600;font-size:12px;color:var(--or-ink);letter-spacing:.06em;text-transform:uppercase}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.lv i{height:10px;background:var(--rule);border-radius:1px}
.lv i.f{background:var(--ink)}
.lv.low i.f{background:var(--or)}
.comp-h .sc{font-weight:800;text-align:right}
.chev{transition:transform .2s;color:var(--mute)}
.comp.open .chev{transform:rotate(90deg)}
.comp-b{display:none;padding:4px 4px 26px}
.comp.open .comp-b{display:block}
.star{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.star div{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--ink);padding:12px 14px;font-size:14.5px;border-radius:0 0 4px 4px}
.star div b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.raw{margin-top:16px;padding:14px 18px;border-left:3px solid var(--rule2);font-family:Lora,Georgia,serif;font-size:16px;color:var(--ink2)}
.next{margin-top:16px;display:flex;gap:10px;font-size:15.5px}
.next b{color:var(--or-ink);white-space:nowrap}

/* technical */
.gaps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.gap{display:flex;flex-direction:column;gap:10px}
.gap .sect{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.gap h3{font-family:Lora,Georgia,serif;font-weight:500;font-size:24px}
.reveal{border:1px dashed var(--rule2);border-radius:4px;padding:14px;font-size:16px;cursor:pointer;color:var(--mute);background:none;text-align:left;width:100%}
.reveal.on{border-style:solid;color:var(--ink);background:var(--paper);cursor:default}
.gap .go{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--rule);font-size:14.5px}
.gap .go a{font-weight:700;color:var(--or-ink);text-decoration:none}

/* ATS */
.ats{display:grid;grid-template-columns:260px minmax(0,1fr);gap:40px;align-items:start}
.gauge{position:relative;width:220px;height:220px}
.gauge svg{transform:rotate(-90deg)}
.gauge .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.gauge .v b{font-size:60px;font-weight:800;line-height:1;display:block}
.comp-bars{display:grid;gap:16px}
.cb{display:grid;grid-template-columns:170px minmax(0,1fr) 64px;gap:14px;align-items:center;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font-size:14px;padding:5px 11px;border-radius:3px;font-weight:600}
.chip.ok{background:var(--gr-soft);color:var(--gr)}
.chip.miss{border:1.5px dashed var(--or);color:var(--or-ink)}

/* plan */
.days{display:grid;gap:0;margin-top:24px}
.day{display:grid;grid-template-columns:90px minmax(0,1fr);gap:24px;padding:24px 0;border-top:1px solid var(--rule)}
.day .dn{font-weight:800}
.day .dn small{display:block;font-weight:600;color:var(--mute);font-size:13px}
.day h3{font-size:19px}
.day ul{margin:10px 0 0;padding-left:18px;color:var(--ink2);font-size:15.5px}
.day ul li{margin:4px 0}
.deliv{margin-top:12px;font-size:14.5px;display:flex;gap:8px;align-items:baseline}
.deliv b{white-space:nowrap;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.tick{display:inline-flex;align-items:center;gap:10px;margin-top:14px;font-size:15px;font-weight:700;cursor:pointer;user-select:none}
.tick input{appearance:none;width:22px;height:22px;border:2px solid var(--rule2);border-radius:3px;margin:0;display:grid;place-items:center;background:var(--card);cursor:pointer}
.tick input:checked{background:var(--gr);border-color:var(--gr)}
.tick input:checked:after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.day.done h3,.chk.done h3{text-decoration:line-through;color:var(--mute)}

/* checklist */
.chk{display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;padding:20px 0;border-top:1px solid var(--rule)}
.chk .tick{margin-top:0}
.chk p{margin:6px 0 0;font-size:15px;color:var(--ink2)}
.chk .why{color:var(--mute);font-size:14px}
.recheck{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;background:var(--ink);color:var(--paper);border-radius:6px;padding:26px 28px}
.recheck p{margin:8px 0 0;opacity:.8;font-size:15.5px}

/* people */
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.person{display:flex;flex-direction:column;gap:10px}
.person .avatar{width:56px;height:56px;font-size:18px;background:var(--or-soft);color:var(--or-ink)}
.person h3{font-size:19px}
.person p{margin:0;font-size:15px;color:var(--ink2)}
.ask textarea{width:100%;min-height:120px;font:inherit;padding:12px;border:1px solid var(--rule2);border-radius:4px;background:var(--paper);color:var(--ink);margin-top:10px}

.foot{font-size:13px;color:var(--mute);margin-top:40px}

/* v3 */
.warn{border:1px solid #e9b949;background:color-mix(in srgb,#ffe9a8 45%,var(--card));border-radius:6px;padding:16px 20px;margin-top:24px;font-size:15.5px}
.warn b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#8a5a00;margin-bottom:4px}
.draft{margin-top:16px;padding:18px 22px;background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--gr);border-radius:4px;font-family:Lora,Georgia,serif;font-size:17px;line-height:1.65}
.draft .cf{font-family:"Source Sans 3",Arial,sans-serif;font-size:14px;font-weight:600;background:#ffe9a8;color:#5a4300;padding:1px 5px;border-radius:2px}
.wa-steps{margin:0;padding-left:20px;font-size:15px;color:var(--ink2)}
.wa-steps li{margin:4px 0}
.wa-trap{font-size:14px;color:var(--or-ink)}
.weeks{display:grid;gap:20px;margin-top:20px}
.week h3{font-size:19px}
.sess{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 0;border-top:1px solid var(--rule);font-size:15px}
.sess a{font-weight:700;color:var(--ink);text-decoration:none}
.sess a:hover{color:var(--or-ink)}
.sess p{margin:2px 0 0;color:var(--mute);font-size:14px}
.removed{font-size:14px;color:var(--mute);margin-top:12px}
.removed s{color:var(--or-ink)}
/* mobile */
@media (max-width:960px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:0;padding:0 16px}
  nav.side,main{min-width:0;max-width:100%}
  nav.side{position:sticky;top:53px;z-index:15;background:var(--paper);padding:8px 0;margin:0 -16px;border-bottom:1px solid var(--rule);max-height:none;overflow:visible}
  .side ol{display:flex;overflow-x:auto;gap:4px;padding:0 16px;scrollbar-width:none}
  .side ol::-webkit-scrollbar{display:none}
  .side a{display:flex;white-space:nowrap;padding:7px 12px;font-size:14px;border:1px solid var(--rule)}
  .side a .c{display:none}
  .side .prog{display:none}
  .top-in{padding:10px 16px}
  .top-meta,.tag{display:none}
  main{padding-top:24px}
  h1{font-size:32px}h2{font-size:27px}
  .hero,.grid2,.grid3,.cv-layout,.fit,.gaps,.ats,.people,.hier,.iq-ab,.risk .cols{grid-template-columns:1fr}
  .hier>div{border-left:0;border-top:1px solid var(--rule)}
  .hier>div:first-child{border-top:0}
  .iq-ab .strong{border-left:0;border-top:1px solid var(--rule)}
  .score .big{font-size:96px}
  .pt-row{grid-template-columns:110px minmax(0,1fr) 74px;font-size:14px}
  .risk{grid-template-columns:1fr;gap:6px}
  .paper{padding:24px 18px;font-size:14px}
  .side-notes{position:static}
  .comp-h{grid-template-columns:minmax(0,1fr) 92px 44px 16px;gap:10px}
  .star{grid-template-columns:1fr 1fr}
  .day{grid-template-columns:1fr;gap:6px}
  .cb{grid-template-columns:120px minmax(0,1fr) 54px;font-size:14px}
  .gauge{margin:0 auto}
  .recheck{grid-template-columns:1fr}
  .iq-top{grid-template-columns:1fr}
  .iq-top .qq{font-size:21px}
  .card{padding:20px}
}
@media print{.top,nav.side,.pager,.tools,.cutnote button{display:none!important}.wrap{display:block}section.pane{display:block!important;page-break-after:always}}
.report-notice{max-width:1200px;margin:18px auto;padding:16px 24px;background:#fff3d9;border:1px solid #e3c583;border-radius:10px}.report-notice a{color:inherit;text-decoration:underline}.ask input{width:100%;font:inherit;padding:12px;margin:8px 0 12px;border:1px solid var(--rule);border-radius:6px}button:focus-visible,a:focus-visible{outline:3px solid #a33b10;outline-offset:3px}</style>
</head>
<body>
<header class="top"><div class="top-in">

  <div class="top-right">
    <span class="tag" id="sampleTag" hidden>Sample report</span>
    <button class="btn or" id="dlTop">Download CV</button>
  </div>
</div></header>

<div id="reportNotice" class="report-notice" role="status" hidden></div><div class="wrap">
  <nav class="side" aria-label="Report sections">
    <ol id="nav"></ol>
    <div class="prog">
      <div class="label">Your progress</div>
      <div class="bar"><i id="progBar"></i></div>
      <div class="mt8" style="font-size:14px"><b id="progTxt">0</b> <span class="mute" id="progOf"></span></div>
    </div>
  </nav>
  <main id="main"><div class="card"><h1>Your Full Cycle report</h1><p id="loadStatus" role="status">Loading your saved assessment…</p></div></main>
</div>

<div class="pop" id="pop" role="dialog" aria-modal="false">
  <div class="label">Confirm before you submit</div>
  <div id="popQ" style="font-weight:600;font-size:15px"></div>
  <textarea id="popA" placeholder="Your answer, in your words. Leave blank if you're not sure."></textarea>
  <div class="row"><button class="btn ghost" id="popCancel">Cancel</button><button class="btn" id="popSave">Use this</button></div>
</div>

<script type="application/json" id="report-data"></script>
<script>
(function(){
"use strict";
/* ---------- config the display owns (not engine data) ---------- */
var PEOPLE=[
 {init:"KR",name:"Kayyor Rao",role:"Banking · MD · 20 years’ experience",area:"UBS · Commerzbank · BGC · Knight · Stifel"},
 {init:"PC",name:"Peter Cheley",role:"Banking & Asset Management · MD · 40 years’ experience",area:"SocGen · Commerzbank · JPM IM · BGC"},
 {init:"NR",name:"Neil Robertson",role:"Banking · MD · 30 years’ experience",area:"UBS · Knight · Stifel · Aurel"},
 {init:"JS",name:"Jim Staples",role:"Banking · MD · 30 years’ experience",area:"Barclays · BGC"},
 {init:"CS",name:"Chris Sharkey",role:"Audit, Accounting & Insurance · MD · 20+ years’ experience",area:"Lancashire Insurance · EY"}
];
/* Test Hub deep links for missed quiz topics. Counts reflect the current question bank. */
var PRACTICE={
  "Equity dilution":{type:"numerical",topic:"Equity dilution",n:60},
  "Percentage fall":{type:"numerical",topic:"Percentage change",n:110},
  "Net debt":{type:"numerical",topic:"Enterprise value vs equity value",n:80},
  "Strategic buyer in M&A":{type:"technical",route:"investment_banking",topic:"M&A",n:43}
};
/* Live role from the deadline tracker, matched on firm + division. */
var TRACKER_ROLES={};
var ATS_NAMES={textReadability:"Readable text",sectionStructure:"Section headings",contactAndChronology:"Contact and dates",targetRoleTerms:"Role keywords"};
var LABELS={ats:"ATS",numerical:"Numerical",technical:"Commercial & technical",competency:"Competency",application:"CV & application"};

/* ---------- load ---------- */
var activeAssessmentId=null;
function status(text){var el=document.getElementById('loadStatus');if(el)el.textContent=text;}
async function api(url,options){var response=await fetch(url,options);var data=await response.json();if(!response.ok)throw new Error(data.error||'This step could not complete. Please retry.');return data;}
async function load(){
 var params=new URLSearchParams(location.search),id=params.get('id');
 var sample=location.pathname.includes('fullcycle-amelia')||params.get('sample')==='amelia'||(!id&&location.pathname.includes('fullcycle-report'));
 if(sample){var preview=await api('/samples/amelia-report-v3-preview.json');preview.sample=true;preview.preview=true;return preview;}
 if(!id||!/^[a-f0-9]{48}$/.test(id))throw new Error('Open Full Cycle from your paid assessment, or view the fictional sample below.');
 activeAssessmentId=id;
 var session=params.get('session_id');
 if(session){status('Verifying your checkout…');await api('/api/verify-checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assessmentId:id,sessionId:session})});history.replaceState(null,'','/fullcycle.html?id='+encodeURIComponent(id)+location.hash);}
 var saved=await api('/api/assessment-result?id='+encodeURIComponent(id));
 if(!saved.paid)throw new Error('Full Cycle purchase required. Open your assessment result to continue to checkout.');
 var paid={},parts=['verdict','repair','plan'];
 for(var i=0;i<parts.length;i++){
  var part=parts[i];status('Preparing '+part+' ('+(i+1)+' of 3)… Saved sections are reused.');
  var section=saved.report&&saved.report[part];
  if(!section){var controller=new AbortController(),timeout=setTimeout(function(){controller.abort();},330000);try{var response=await api('/api/full-cycle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assessmentId:id,part:part}),signal:controller.signal});section=response.data;}finally{clearTimeout(timeout);}}
  Object.assign(paid,section);
 }
 status('Building your CV from validated repairs…');
 var draft=await api('/api/generate-cv',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assessmentId:id})});
 return {sample:false,id:id,generatedAt:id,profile:saved.profile,result:saved.result,quiz:saved.quiz,recheck:saved.recheck,paid:paid,cv:draft.cv,repairedCvDraft:draft.cv.sourceText};
}

function safeLink(value){var s=String(value||'');return /^\/(?!\/)|^#[a-z][a-z0-9_-]*$/i.test(s)?s:'/test-hub.html';}
/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
var EMAP={};
function buildEvidenceMap(R){
 EMAP={};(R.paid.competencyRepair||[]).forEach(function(c){(c.evidenceSourceIds||[]).forEach(function(id){EMAP[id]='your cited CV evidence';});});
}
/* Replace internal evidence codes (E7, E8/E13) with plain words */
function clean(s){
  s=String(s==null?"":s);
  s=s.replace(/\bE\d{1,2}(?:\s*(?:\/|,|and|or)\s*E\d{1,2})*\b/g,function(m){
    var ids=m.match(/E\d{1,2}/g),seen={},out=[];
    ids.forEach(function(id){var l=EMAP[id]||("your CV");if(!seen[l]){seen[l]=1;out.push(l);}});
    return out.join(" and ");
  });
  s=s.replace(/ \(your (Redcliffe internship|Pho House role|LVMH project)\)/g,function(m,b,off,str){return str.slice(Math.max(0,off-40),off).indexOf(b.split(" ")[0])>-1?"":m;});
  return s.replace(/\byour (Redcliffe internship|Pho House role|LVMH project): /g,function(_,a){return a.charAt(0).toUpperCase()+a.slice(1)+": ";});
}
function h(s){return esc(clean(s));}
function splitStar(s){
  var parts=[],re=/(Situation|Action|Output|Result|Reflection):\s*/g,m,last=null,idx=0;
  while((m=re.exec(s))){if(last)parts.push({k:last,v:s.slice(idx,m.index).trim()});last=m[1];idx=re.lastIndex;}
  if(last)parts.push({k:last,v:s.slice(idx).trim()});
  return parts.length>=2?parts:null;
}

/* ---------- state (per-viewer convenience only) ---------- */
var KEY,ST={done:{},answers:{},kept:{}};
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){}}
function restore(){try{var v=localStorage.getItem(KEY);if(v){var o=JSON.parse(v);ST.done=o.done||{};ST.answers=o.answers||{};ST.kept=o.kept||{};}}catch(e){}}

/* ---------- sections ---------- */
var SECTIONS=[
  {id:"overview",t:"Overview"},
  {id:"cv",t:"Your CV"},
  {id:"ats",t:"ATS check"},
  {id:"interview",t:"Interview questions"},
  {id:"competencies",t:"Competency answers"},
  {id:"technical",t:"Technical gaps"},
  {id:"numerical",t:"Numerical practice"},
  {id:"application",t:"Application readiness"},
  {id:"plan",t:"7-day plan"},
  {id:"prep",t:"Prep"},
  {id:"submit",t:"Before you submit"},
  {id:"ask",t:"Ask a practitioner"}
];

function render(R){
  if(R.paid&&R.paid.weeksTwoToFour){SECTIONS.forEach(function(s){if(s.id==="plan")s.t="30-day plan";});}
  var P=R.paid,res=R.result,prof=R.profile||{},first=(prof.name||res.candidateName||"").split(" ")[0];
  KEY="desk-fc-"+(R.id||R.generatedAt||"sample-v3");restore();buildEvidenceMap(R);
  document.getElementById("sampleTag").hidden=!R.sample;
  document.getElementById("sampleTag").textContent=R.preview?'V3 design preview':'Sample report';
  var notice=document.getElementById('reportNotice');notice.hidden=!R.sample;if(R.sample)notice.innerHTML='<strong>Fictional sample · V3 design preview.</strong> Some STAR drafts and firm-preparation wording are hand-written examples of the intended output, not newly generated v3 results. Payment, practitioner submission and rechecks are disabled here. <a href="/assessment-start.html">Start your own assessment →</a>';
  document.getElementById("dlTop").disabled=false;
  document.getElementById("topMeta").textContent=(prof.name||"")+" · "+(prof.targetFirm||"")+" · "+(prof.targetDivision||"")+" · "+(prof.programme||"");

  var S={};

  /* OVERVIEW */
  (function(){
    var score=res.overallScore,band=res.band,gap=Math.max(0,75-score);
    var rows=Object.keys(res.weights).map(function(k){return{k:k,max:res.weights[k],got:res.breakdown[k]};})
      .sort(function(a,b){return(b.max-b.got)-(a.max-a.got);});
    var missing=rows.reduce(function(a,r){return a+(r.max-r.got);},0);
    var pr=res.priorities||[];
    function linkFor(p){var s=(p.title+' '+(p.description||'')).toLowerCase();if(/quiz|wacc|cash flow|technical|numerical|percentage|margin|net debt|dilution|test/.test(s))return 'technical';if(/ats|keyword/.test(s))return 'ats';if(/cv|bullet|lvmh|redcliffe|wording/.test(s))return 'cv';if(/leadership|resilience|teamwork|competenc|star|example/.test(s))return 'competencies';if(/commercial|market view|why /.test(s))return 'interview';return 'plan';}
    var links=pr.map(linkFor);
    var roleKey=(prof.targetFirm||"")+"|"+(prof.targetDivision||"").split(" /")[0];
    var role=TRACKER_ROLES[roleKey];
    S.overview=
    '<div class="eyebrow">Full Cycle · your plan</div>'+
    '<h1 class="mt8">'+esc(first)+', here’s your preparation plan.</h1>'+
    ((P.profileWarnings||[]).length?'<div class="warn"><b>Check this first</b>'+P.profileWarnings.map(function(w){return esc(w.message);}).join("<br>")+'</div>':'')+
    '<div class="hero mt32">'+
      '<div>'+
        '<div class="score"><span class="big num">'+score+'</span><span class="of">/ 100</span></div>'+
        '<div class="mt16"><span class="band">'+esc(band)+'</span> '+
        (gap?'<span style="margin-left:8px;font-weight:600">'+gap+' points from Competitive</span>':'<span style="margin-left:8px;font-weight:600">In the Competitive band</span>')+'</div>'+
        '<div class="scale"><i style="left:calc('+score+'% - 2px)"></i></div>'+
        '<div class="scale-l"><span style="left:0">Weak</span><span style="left:65%">65</span><span style="left:75%">75 · Competitive</span></div>'+
        '<div class="fix mt32"><div class="eyebrow">The one fix that matters most</div><p>'+h(P.executiveVerdict.mostImportantFix)+'</p><a class="mt8" style="display:inline-block;font-weight:700;color:var(--or-ink);font-size:15px" href="#cv">See it on your CV →</a></div>'+
      '</div>'+
      '<div class="card">'+
        '<h3>Where your '+missing+' missing points are</h3>'+
        '<p class="mute" style="margin:4px 0 18px;font-size:15px">Biggest gap first. Hatched = the difference from the framework maximum, not a promised score gain.</p>'+
        '<div class="pts">'+rows.map(function(r){
          return '<div class="pt-row"><span>'+esc(LABELS[r.k]||r.k)+'</span><div class="pt-track"><b style="width:'+(r.got/30*100)+'%"></b><s style="left:'+(r.got/30*100)+'%;width:'+((r.max-r.got)/30*100)+'%"></s></div><span class="pt-miss num">'+(r.max-r.got?'+'+(r.max-r.got)+' pts':'full')+'</span></div>';
        }).join("")+'</div>'+
        '<p class="mute" style="font-size:13px;margin:16px 0 0">Bars drawn to the same scale. CV &amp; application is worth up to 30.</p>'+
      '</div>'+
    '</div>'+
    '<h2 class="mt48">Your three priorities</h2>'+
    '<ol class="prio mt16">'+pr.map(function(p,i){return '<li><div><h3>'+h(p.title)+'</h3><p>'+h(p.description)+'</p><a href="#'+(links[i]||"plan")+'">Go to '+esc((SECTIONS.filter(function(s){return s.id===links[i];})[0]||{t:"plan"}).t.toLowerCase())+' →</a></div></li>';}).join("")+'</ol>'+
    (role?'<div class="card mt32"><div class="route"><div><div class="eyebrow">Your target on the deadline tracker</div><h3 class="mt8">'+esc(prof.targetFirm)+' · '+esc(role.name)+'</h3><div class="mt8"><span class="status">'+esc(role.status)+'</span> <span class="mute" style="font-size:15px">· '+esc(role.when)+'</span></div><div class="steps">'+role.steps.map(function(s){return'<span>'+esc(s)+'</span>';}).join("")+'</div><p style="margin:12px 0 0;font-size:15px;color:var(--ink2)">'+esc(role.note)+' Your 7-day plan is timed to get you ready before you apply.</p></div><div style="display:grid;gap:8px"><a class="btn" href="/tracker.html">Open tracker</a><a class="btn ghost" href="'+esc(role.url)+'" target="_blank" rel="noopener">Barclays page ↗</a></div></div></div>':'')+
    '<div class="grid2 mt32">'+
      '<div><div class="label">The Desk’s read</div><p class="verdict" style="margin:0">'+h(P.executiveVerdict.summary)+'</p></div>'+
      '<div><div class="label">Is this route realistic?</div><p style="margin:0;color:var(--ink2)">'+h(P.targetRouteMeaning.isRouteRealistic)+'</p><div class="label mt16">If this cycle doesn’t work out</div><p style="margin:0;color:var(--ink2)">'+h(P.targetRouteMeaning.steppingStoneRoute)+'</p></div>'+
    '</div>';
  })();

  /* CV */
  (function(){
    var repairs=P.bulletRepair||[],cuts=(P.evidenceHierarchy&&P.evidenceHierarchy.reduceOrCut)||[];
    var cutPhrases=[];cuts.forEach(function(c){c.evidence.split(" / ").forEach(function(p){p=p.trim();if(p.length>12&&!/\d/.test(p))cutPhrases.push({p:p,why:c.whyReduce});});});
    var flags=(R.cv&&R.cv.accuracyFlags)||[];
    var lines=String(R.repairedCvDraft||"").split("\n").map(function(s){return s.trim();}).filter(Boolean);
    var qn=0,qList=[];
    function confirmChips(text){
      return esc(text).replace(/\[CONFIRM:\s*([^\]]+)\]/g,function(_,q){var id="q"+(qn++);qList.push({id:id,q:q,item:curItem});
        var a=ST.answers[id];return '<span class="q'+(a?' done':'')+'" data-q="'+id+'" data-text="'+esc(q)+'" title="Click to answer">'+(a?esc(a):'Confirm: '+esc(q))+'</span>';});
    }
    function withCuts(text,li){
      var out=esc(text);
      cutPhrases.forEach(function(c,ci){var e=esc(c.p);var k="cut"+li+"_"+ci;if(out.indexOf(e)>-1){
        var kept=!!ST.kept[k];
        out=out.replace(e,'<span class="cut'+(kept?' kept':'')+'" data-cut="'+k+'">'+e+'</span><span class="cutnote">'+(kept?'':'Cut this ')+'<button data-keep="'+k+'">'+(kept?'Cut it':'Keep it')+'</button></span>');}});
      return out;
    }
    var html='',name=lines[0]||"",curItem="";
    var contact=lines[1]||"";
    html+='<div class="nm">'+esc(name)+'</div><div class="ct">'+esc(contact.replace(/^Email:\s*/,""))+'</div>';
    for(var i=2;i<lines.length;i++){
      var L=lines[i];
      if(/^[A-Z &]{4,}$/.test(L)){html+='<div class="sec">'+esc(L)+'</div>';continue;}
      var rep=repairs.filter(function(r){return r.exampleBullet===L;})[0];
      if(rep){curItem=rep.cvItem.split(" — ")[0];
        html+='<div class="ln new" data-rep="'+repairs.indexOf(rep)+'">'+confirmChips(L)+
          '<div class="orig">Before: '+esc(rep.originalBullet)+'</div>'+
          '<div class="tools"><button data-toggle-orig>Show before</button><span style="color:#888">Rewritten from your own facts, nothing added</span></div></div>';
        continue;
      }
      var isRole=/—/.test(L)&&/(20\d\d|present)/.test(L)&&L.length<110;
      if(isRole&&!/\.\s/.test(L)){html+='<div class="role">'+esc(L)+'</div>';continue;}
      var prev=lines[i-1]||"";var isPlain=/^[A-Z &]{4,}$/.test(prev)&&!/[.;]\s/.test(L.slice(0,60))&&L.length<200&&!/^(Supported|Built|Worked|Researched)/.test(L);
      html+='<div class="ln'+(isPlain?' plain':'')+'">'+withCuts(L,i)+'</div>';
    }
    var why=repairs.map(function(r){return '<div><b>'+esc(r.cvItem.split(" — ")[0])+'</b>'+h(r.whyThisWorks)+'</div>';}).join("");
    if(!qList.length){flags.forEach(function(f,i){qList.push({id:"f"+i,q:f.question,item:String(f.item||"").split(" — ")[0],flag:true});});}
    var flagsHtml=qList.map(function(x){return '<li data-ql="'+x.id+'"'+(x.flag?' class="q-flag'+(ST.answers[x.id]?' done':'')+'" data-q="'+x.id+'" data-text="'+esc(x.q)+'" style="cursor:pointer"':(ST.answers[x.id]?' class="done"':''))+'><small>'+esc(x.item)+'</small>'+esc(x.q.charAt(0).toUpperCase()+x.q.slice(1))+'</li>';}).join("");
    var extraFlags=flags.length-qList.length;
    var removed=(R.cv&&R.cv.removed)||[];
    S.cv=
    '<div class="eyebrow">Your CV</div><h2 class="mt8">Your CV, repaired from your own facts.</h2>'+
    (qList.length&&!qList[0].flag?'<p class="lede">Orange lines are rewritten. Yellow marks are questions only you can answer. Click one, type your answer, and it drops into the CV. Struck-through lines are ones we’d cut.</p>'
      :'<p class="lede">Orange lines are rewritten using only facts already on your CV, for you to review. Answer the questions on the right and confirm every claim before submitting.</p>')+
    (removed.length?'<p class="removed">Removed from your CV: '+removed.map(function(r){return'<s>'+esc(r.text)+'</s>';}).join(" · ")+'</p>':'')+
    '<div class="cv-layout mt32">'+
      '<div><div class="paper" id="paper">'+html+'</div>'+
        '<div class="mt16" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn or" id="dlCv">Download as Word</button><button class="btn ghost" id="copyCv">Copy text</button></div></div>'+
      '<aside class="side-notes">'+
        '<div class="card"><div class="label">To confirm · <span id="qCount"></span></div><ul class="confirm-list" id="qList">'+flagsHtml+'</ul>'+
          (extraFlags>0?'<p class="mute" style="font-size:13px;margin:12px 0 0">'+extraFlags+' more questions to check are in “Before you submit”.</p>':'')+'</div>'+
        '<div class="card"><div class="label">Your accuracy review</div><div class="signoff"><div class="avatar">AD</div><div style="font-size:14.5px"><b>Waiting for your answers</b><br><span class="mute">Your answers are saved in this browser. Check every factual claim before submitting; a human review has not taken place.</span></div></div></div>'+
        '<div class="card"><div class="label">Why each change</div><div class="why-list">'+why+'</div></div>'+
      '</aside>'+
    '</div>';
    S._qList=qList;
  })();

  /* APPLICATION */
  (function(){
    var E=P.evidenceHierarchy||{},F=P.firmDivisionFit||{},T=P.targetRouteMeaning||{};
    function items(arr,k1,k2){return(arr||[]).map(function(x){return '<div class="it"><b>'+h(x.evidence)+'</b><p>'+h(x[k1])+'</p></div>';}).join("");}

  });

  /* confirm popover */
  var pop=document.getElementById("pop"),popQ=document.getElementById("popQ"),popA=document.getElementById("popA"),cur=null;
  function closePop(){pop.classList.remove("on");cur=null;}
  document.addEventListener("click",function(e){
    var q=e.target.closest(".q,.q-flag");
    if(q){cur=q;popQ.textContent=q.getAttribute("data-text");popA.value=ST.answers[q.getAttribute("data-q")]||"";
      var r=q.getBoundingClientRect();pop.classList.add("on");
      var top=Math.min(r.bottom+8,window.innerHeight-pop.offsetHeight-12),left=Math.max(16,Math.min(r.left,window.innerWidth-pop.offsetWidth-16));
      pop.style.top=top+"px";pop.style.left=left+"px";popA.focus();return;}
    if(e.target.closest("#pop"))return;
    if(pop.classList.contains("on"))closePop();

    var t=e.target.closest("[data-toggle-orig]");
    if(t){var ln=t.closest(".ln");ln.classList.toggle("show-orig");t.textContent=ln.classList.contains("show-orig")?"Hide before":"Show before";return;}
    var k=e.target.closest("[data-keep]");
    if(k){var key=k.getAttribute("data-keep");ST.kept[key]=!ST.kept[key];save();var sp=document.querySelector('[data-cut="'+key+'"]');sp.classList.toggle("kept",ST.kept[key]);
      k.parentNode.firstChild.nodeType===3&&(k.parentNode.firstChild.textContent=ST.kept[key]?"":"Cut this ");k.textContent=ST.kept[key]?"Cut it":"Keep it";return;}
    var ch=e.target.closest(".comp-h");
    if(ch){var c=ch.parentNode;c.classList.toggle("open");ch.setAttribute("aria-expanded",c.classList.contains("open"));return;}
    var rv=e.target.closest("[data-reveal]");
    if(rv&&!rv.classList.contains("on")){var a=document.querySelector('[data-ans="'+rv.getAttribute("data-reveal")+'"]');rv.textContent=a.textContent;rv.classList.add("on");return;}
    var st=e.target.closest("[data-start]");
    if(st){timer(st);return;}
  });
  document.getElementById("popCancel").onclick=closePop;
  document.getElementById("popSave").onclick=function(){
    if(!cur)return;var id=cur.getAttribute("data-q"),v=popA.value.trim();
    var isFlag=cur.classList.contains("q-flag");
    if(isFlag){if(v)ST.answers[id]=v;else delete ST.answers[id];}
    else if(v){ST.answers[id]=v;cur.classList.add("done");cur.textContent=v;}
    else{delete ST.answers[id];cur.classList.remove("done");cur.textContent="Confirm: "+cur.getAttribute("data-text");}
    var li=document.querySelector('[data-ql="'+id+'"]');if(li)li.classList.toggle("done",!!v);
    save();progress();closePop();
  };
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closePop();});

  /* timers */
  var running={};
  function timer(btn){
    var i=btn.getAttribute("data-start"),el=document.querySelector('[data-timer="'+i+'"]');
    if(running[i]){clearInterval(running[i]);running[i]=null;btn.textContent="Start";el.textContent="1:30";return;}
    var s=90;btn.textContent="Stop";
    running[i]=setInterval(function(){s--;el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
      if(s<=0){clearInterval(running[i]);running[i]=null;btn.textContent="Again";el.textContent="Time";}},1000);
  }

  /* CV export */
  function cvText(){
    var out=[];document.querySelectorAll("#paper > div").forEach(function(d){
      if(d.classList.contains("cut"))return;
      var c=d.cloneNode(true);c.querySelectorAll(".orig,.tools,.cutnote").forEach(function(x){x.remove();});
      c.querySelectorAll(".cut:not(.kept)").forEach(function(x){x.remove();});
      c.querySelectorAll(".q:not(.done)").forEach(function(x){x.textContent="[CONFIRM: "+x.getAttribute("data-text")+"]";});
      var t=c.textContent.replace(/\s+/g," ").trim();if(!t)return;
      if(d.classList.contains("sec"))out.push("\n"+t);else if(d.classList.contains("role"))out.push("## "+t);else if(d.classList.contains("nm"))out.push("#N "+t);else if(d.classList.contains("ln")&&!d.classList.contains("plain"))out.push("• "+t);else out.push(t);
    });return out.join("\n");
  }
  function download(){
    var lines=cvText().split("\n"),body=lines.map(function(l){
      if(!l.trim())return"";
      if(/^[A-Z &]{4,}$/.test(l.trim()))return'<h3 style="font-family:Arial;font-size:11pt;letter-spacing:1px;border-bottom:1px solid #000;margin:14pt 0 4pt">'+esc(l.trim())+'</h3>';
      if(l.indexOf("#N ")===0)return'<p style="text-align:center;font-size:16pt;margin:0 0 2pt">'+esc(l.slice(3))+'</p>';
      if(l.indexOf("## ")===0)return'<p style="margin:8pt 0 2pt"><b>'+esc(l.slice(3))+'</b></p>';
      if(l.indexOf("• ")===0)return'<p style="margin:2pt 0 2pt 14pt;text-indent:-10pt">• '+esc(l.slice(2))+'</p>';
      return'<p style="margin:3pt 0">'+esc(l)+'</p>';}).join("");
    var doc='<html><head><meta charset="utf-8"></head><body style="font-family:Georgia;font-size:11pt">'+body+'</body></html>';
    var name=((R.profile||{}).name||"cv").replace(/\s+/g,"-")+"-CV-repaired.doc";
    var b=new Blob(["﻿"+doc],{type:"application/msword"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
  }
  document.getElementById("dlCv").onclick=download;
  document.getElementById("dlTop").onclick=download;
  document.getElementById("copyCv").onclick=function(){var b=this;try{navigator.clipboard.writeText(cvText()).then(function(){b.textContent="Copied";setTimeout(function(){b.textContent="Copy text";},1500);});}catch(e){}};
}

document.getElementById('dlTop').disabled=true;
load().then(render).catch(function(e){document.getElementById("main").innerHTML='<div class="card"><h2>We couldn’t load this report.</h2><p class="mute">'+esc(e.name==='AbortError'?'This section took too long. Retry to resume from saved sections.':e.message)+'</p><button class="btn" onclick="location.reload()">Retry</button><p><a href="/assessment-start.html">Start your assessment →</a> · <a href="/fullcycle-amelia.html">View the fictional sample →</a></p></div>';});
})();
</script>
