<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application questions · The Desk</title><link rel="stylesheet" href="/application-drafts.css"><script type="module" src="/public-session.js"></script></head><body><header class="ad-top"><a href="/programmes-admin.html">Programmes admin</a><a href="/my.html">My Desk</a></header><main><div class="ad-kicker">Staff only</div><h1>Questions from students.</h1><form id="login"><label>Knowledge-admin key<input type="password" id="key" required autocomplete="off"></label><button class="ad-ink">Open weekly counts →</button></form><div id="questionStats" role="status"></div><section id="questions"></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('login').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/application-drafts?view=staff',{headers:{Authorization:'Bearer '+document.getElementById('key').value}}),d=await r.json();if(!r.ok)throw Error(d.error);document.getElementById('login').remove();document.getElementById('questionStats').textContent=d.new_questions_this_week+' new student questions this week';document.getElementById('questions').innerHTML=d.questions.map(q=>'<article class="ad-card"><b>'+esc(q.firm)+' · '+esc(q.programme)+'</b><p>'+esc(q.text)+'</p><p>'+q.matches+' distinct verified students · '+esc(q.confidence)+'</p></article>').join('');}catch(error){document.getElementById('questionStats').textContent=error.message;}};</script></body></html>
