<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit the 50 proposed question cards</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f1ec;color:#1f2a2e;font:16px/1.5 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:32px 20px 100px}h1{font:600 36px Georgia,serif;margin:12px 0}header p{max-width:700px}nav{position:sticky;top:0;background:#f4f1ec;padding:12px 0;z-index:2;border-bottom:1px solid #d9d3ca;display:flex;gap:8px;flex-wrap:wrap}input,textarea,button,select{font:inherit}input[type=search]{flex:1;min-width:180px;padding:10px;border:1px solid #c8c1b8;border-radius:7px}button,.upload{border:1px solid #1f2a2e;border-radius:7px;padding:10px 13px;background:#1f2a2e;color:white;cursor:pointer}.secondary{background:white;color:#1f2a2e}article{padding:24px 0;border-bottom:1px solid #d9d3ca}article h2{font-size:16px;margin:0 0 12px}label{display:block;font-size:13px;font-weight:600;margin:10px 0}textarea{display:block;width:100%;resize:vertical;border:1px solid #c8c1b8;border-radius:7px;background:white;color:#1f2a2e;padding:12px;font-weight:400;line-height:1.5;margin-top:5px;min-height:90px}.guidance{min-height:115px;font-family:Georgia,serif;font-size:19px}.status{font-size:13px;color:#516a5d;margin:8px 0}small{letter-spacing:.08em;font-size:11px}.review-check{display:flex;align-items:center;gap:8px;font-weight:400}article.changed h2:after{content:' · Edited';color:#287447}a{color:inherit}.upload input{display:none}@media(max-width:600px){main{padding:20px 16px 80px}h1{font-size:30px}nav button{font-size:13px;padding:9px}}</style></head><body><main><header><small>THE DESK · WORDING REVIEW</small><h1>Edit the 50 proposed question cards</h1><p>Change the question or the “They want to know…” wording directly. Edits stay in this browser. Download them when you are ready to send them back. Nothing here publishes to the live site.</p></header><nav><input type="search" id="search" placeholder="Find a question or firm" aria-label="Find a question or firm"><button id="download">Download my edits</button><button id="save" class="secondary">Save in this browser</button><label class="upload secondary">Import edits<input id="import" type="file" accept=".json,application/json"></label></nav><p class="status" id="status" role="status">Loading the 50 questions…</p><section id="questions" aria-label="Editable question cards"></section></main><script type="module">
import {REALLY_ASKING_REVIEW as originals} from '../data/really-asking-review.mjs';
const key='desk-really-asking-review-24nov-v1',list=document.getElementById('questions'),status=document.getElementById('status');let rows=structuredClone(originals);
function valid(data){return Array.isArray(data)&&data.length===50&&data.every((r,i)=>r.id===originals[i].id&&typeof r.question==='string'&&typeof r.reallyAsking==='string'&&r.question.length<5000&&r.reallyAsking.length<5000);}
try{const stored=JSON.parse(localStorage.getItem(key));if(valid(stored))rows=stored;}catch{}
function persist(){try{localStorage.setItem(key,JSON.stringify(rows));status.textContent='All 50 cards saved in this browser. Download your edits to send them back.';}catch{status.textContent='Browser storage is unavailable. Use Download my edits to keep your changes.';}}
function draw(){list.replaceChildren();rows.forEach((r,i)=>{const a=document.createElement('article');a.dataset.id=r.id;const h=document.createElement('h2');h.textContent=(i+1)+'. '+r.firm;a.append(h);for(const [field,title] of [['question','Question'],['reallyAsking','Proposed wording — edit this']]){const label=document.createElement('label');label.textContent=title;const input=document.createElement('textarea');input.value=r[field];input.className=field==='reallyAsking'?'guidance':'';input.setAttribute('aria-label',title+' '+(i+1));input.oninput=()=>{r[field]=input.value;a.classList.add('changed');persist();};label.append(input);a.append(label);}const label=document.createElement('label');label.className='review-check';const check=document.createElement('input');check.type='checkbox';check.checked=r.reviewed===true;check.onchange=()=>{r.reviewed=check.checked;persist();};label.append(check,document.createTextNode('I have reviewed this wording'));a.append(label);if(r.question!==originals[i].question||r.reallyAsking!==originals[i].reallyAsking)a.classList.add('changed');list.append(a);});status.textContent='50 cards ready to edit. '+rows.filter(r=>r.reviewed).length+' marked reviewed.';filter();}
function filter(){const q=document.getElementById('search').value.toLowerCase();for(const [i,a] of [...list.children].entries())a.hidden=!([rows[i].firm,rows[i].question,rows[i].reallyAsking].join(' ').toLowerCase().includes(q));}
document.getElementById('search').oninput=filter;document.getElementById('save').onclick=persist;
document.getElementById('download').onclick=()=>{persist();const blob=new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='the-desk-50-question-wording-edits.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);};
document.getElementById('import').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!valid(data))throw Error('Choose a saved export containing the same 50 question IDs.');rows=data;persist();draw();}catch(error){status.textContent=error.message;}};draw();
</script></body></html>
