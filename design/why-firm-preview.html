<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Why firm · approval preview</title><link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/why-firm-sheet.css"><style>body{font:16px Figtree,sans-serif;background:#f4f1ec;color:#1f2a2e;margin:24px}h1{font:600 32px 'EB Garamond',Georgia}button,a{color:inherit}button{padding:12px;margin:8px;border-radius:8px;background:white;border:1px solid #ded8cf}#saved{white-space:pre-wrap}article{border-top:1px solid #ded8cf;padding:18px 0}blockquote{margin:10px 0;font:600 21px/1.3 'EB Garamond',Georgia}.review{max-width:800px;margin:auto}</style></head><body><main class="review"><small>PRIVATE REVIEW · PROPOSED COPY · NOT LIVE</small><h1>Why this firm?</h1><p>Same fictional student: Amelia Chen. Same saved CV evidence; different firm.</p><button data-firm="barclays">Barclays</button><button data-firm="rothschild">Rothschild & Co</button><p id="saved" role="status"></p><details><summary>Review the 50 proposed question cards</summary><div id="copy"></div></details></main><script type="module">
import {openWhyFirm} from '/why-firm-sheet.js';
import {evidenceSources} from '/lib/interview-evidence-guide.mjs';
import {REALLY_ASKING_REVIEW} from '/data/really-asking-review.mjs';
const fixture=await fetch('/samples/amelia-report-v3-preview.json').then(r=>r.json());let cv=fixture.cv.sourceText;for(const repair of fixture.paid.bulletRepair)cv=cv.replace(repair.exampleBullet,repair.originalBullet);const sources=evidenceSources(cv);
function open(firm){openWhyFirm({firm,division:'Investment Banking / IBD',sources,onUse:d=>{document.getElementById('saved').textContent='Preview only — no account changed.\n'+d.text;}});}
document.querySelectorAll('[data-firm]').forEach(b=>b.onclick=()=>open(b.dataset.firm));
const copy=document.getElementById('copy');for(const [i,r]of REALLY_ASKING_REVIEW.entries()){const a=document.createElement('article'),q=document.createElement('b'),t=document.createElement('blockquote');q.textContent=(i+1)+'. '+r.question;t.textContent=r.reallyAsking;a.append(q,t);copy.append(a);}
open(new URLSearchParams(location.search).get('firm')||'barclays');
</script></body></html>
