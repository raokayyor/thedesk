<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interview Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Source+Sans+3:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f4ee;--card:#fffdfa;--ink:#0d1620;--ink2:#3d4954;--mute:#6b7682;--rule:#e3ddd3;--rule2:#d4ccbf;--or:#d9480f;--or-soft:#ffe8dc;--or-ink:#a8360a;--gr:#1f6f5c;--gr-soft:#e4f1ec;--am:#b07b00;--am-soft:#fff3cf;--rec:#d92d20}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#11171d;--card:#182028;--ink:#eef0ee;--ink2:#c3cad0;--mute:#8d98a2;--rule:#2a343d;--rule2:#36424c;--or:#ff7a3d;--or-soft:#3a2418;--or-ink:#ffab80;--gr:#5cc3a3;--gr-soft:#16302a;--am:#f2c14e;--am-soft:#3a3016}}
:root[data-theme="dark"]{--paper:#11171d;--card:#182028;--ink:#eef0ee;--ink2:#c3cad0;--mute:#8d98a2;--rule:#2a343d;--rule2:#36424c;--or:#ff7a3d;--or-soft:#3a2418;--or-ink:#ffab80;--gr:#5cc3a3;--gr-soft:#16302a;--am:#f2c14e;--am-soft:#3a3016}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Source Sans 3",Arial,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
h1,h2{font-family:Lora,Georgia,serif;font-weight:500;letter-spacing:-.01em;margin:0}
h1{font-size:40px;line-height:1.1}h2{font-size:30px;line-height:1.2}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--or)}
.label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.mute{color:var(--mute)}
.top{border-bottom:1px solid var(--rule);background:var(--paper)}
.top-in{max-width:1080px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
.logo{font-family:Lora,Georgia,serif;font-size:22px;font-weight:600;text-decoration:none}
.logo i{color:var(--or);font-weight:500}
.top .ctx{font-size:14px;color:var(--mute);margin-left:auto;text-align:right}
.top .nav{display:flex;gap:14px;font-size:15px}.top .nav a{text-decoration:none;color:var(--ink2)}
main{max-width:1080px;margin:0 auto;padding:36px 24px 80px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:12px 20px;font-weight:700;font-size:16px;text-decoration:none}
.btn.or{background:var(--or);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule2)}
.btn.rec{background:var(--rec);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.notice{border:1px solid #e3c583;background:color-mix(in srgb,var(--am-soft) 70%,var(--card));border-radius:8px;padding:12px 16px;font-size:15px;margin-bottom:20px}
.hidden{display:none!important}

/* setup */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px}
.mode{text-align:left;background:var(--card);border:1.5px solid var(--rule);border-radius:8px;padding:18px 20px}
.mode b{display:block;font-size:18px}
.mode span{display:block;font-size:15px;color:var(--ink2);margin-top:4px}
.mode small{display:block;font-size:13px;color:var(--mute);margin-top:8px}
.mode[aria-pressed="true"]{border-color:var(--or);box-shadow:0 0 0 3px color-mix(in srgb,var(--or) 18%,transparent)}
.setup-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start;margin-top:28px}
.check{display:flex;align-items:center;gap:12px;font-size:15px}
.toggle{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px}
.meter{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;width:0;background:var(--gr);transition:width .08s}
ul.tips{margin:8px 0 0;padding-left:18px;font-size:15px;color:var(--ink2)}
ul.tips li{margin:4px 0}

/* question */
.progress{display:flex;gap:6px;margin-bottom:18px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--rule)}
.progress i.done{background:var(--gr)}
.progress i.on{background:var(--or)}
.qtype{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:4px;background:var(--or-soft);color:var(--or-ink)}
.qtext{font-family:Lora,Georgia,serif;font-size:30px;line-height:1.3;margin:14px 0 8px}
.qwhy{font-size:15px;color:var(--mute)}
.stage{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;margin-top:24px;align-items:start}
.cam{position:relative;background:#0d1620;border-radius:8px;overflow:hidden;aspect-ratio:4/3;display:grid;place-items:center;color:#c3cad0;font-size:15px}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam .badge{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rec);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.big-timer{font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tbar{height:8px;border-radius:4px;background:var(--rule);overflow:hidden;margin:10px 0 4px}
.tbar i{display:block;height:100%;background:var(--or);transition:width 1s linear}
.live{min-height:150px;max-height:260px;overflow:auto;border:1px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--card);font-size:16px;color:var(--ink2)}
.live .interim{color:var(--mute)}
textarea.ans{width:100%;min-height:170px;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--rule2);border-radius:8px;background:var(--card);color:var(--ink);resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.lookfor{margin-top:18px}
.lookfor ul{margin:6px 0 0;padding-left:18px;font-size:15px;color:var(--ink2)}

/* ready + asking */
.ready{max-width:720px;margin:10px auto 0;text-align:center}
.ready h2{font-size:40px;margin:10px 0 8px}
.ready p{color:var(--ink2);margin:0 auto;max-width:34em}
.ready .cam{max-width:360px;margin:22px auto 0;aspect-ratio:16/10}
.btn.big{font-size:19px;padding:16px 30px;margin-top:22px}
.interviewer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:15px;color:var(--ink2)}
.interviewer b{color:var(--ink)}
.bars{display:inline-flex;align-items:flex-end;gap:3px;height:18px}
.bars i{display:block;width:4px;height:5px;background:var(--mute);border-radius:2px}
.speaking .bars i{background:var(--or);animation:bar .9s ease-in-out infinite}
.speaking .bars i:nth-child(2){animation-delay:.15s}.speaking .bars i:nth-child(3){animation-delay:.3s}.speaking .bars i:nth-child(4){animation-delay:.45s}
@keyframes bar{50%{height:18px}}
@media (prefers-reduced-motion:reduce){.speaking .bars i{animation:none;height:12px}}
.qtext.big{font-size:38px;line-height:1.25;margin:16px 0 10px;animation:fadein .5s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.linkbtn{background:none;border:0;padding:0;color:var(--or-ink);font-weight:700;font-size:15px;text-decoration:underline}
.count{font-size:72px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
/* review + feedback */
.metrics{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.metric{font-size:14px;border:1px solid var(--rule2);border-radius:999px;padding:4px 12px;background:var(--card)}
.metric.warn{border-color:var(--am);color:var(--am)}
.fb-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.bandpill{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border-radius:4px}
.b-Strong{background:var(--gr-soft);color:var(--gr)}
.b-Getting{background:var(--am-soft);color:var(--am)}
.b-Needs{background:var(--or-soft);color:var(--or-ink)}
.overall{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.overall small{font-size:18px;color:var(--mute);font-weight:600}
.crit{display:grid;gap:10px;margin-top:18px}
.crit div{display:grid;grid-template-columns:150px minmax(0,1fr) 36px;gap:12px;align-items:center;font-size:15px}
.cbar{height:10px;border-radius:5px;background:var(--rule);overflow:hidden}
.cbar i{display:block;height:100%;background:var(--ink)}
.fbgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:22px}
.fbgrid ul{margin:6px 0 0;padding-left:18px}
.fbgrid li{margin:5px 0}
.stronger{margin-top:20px;border-left:4px solid var(--gr);padding:14px 18px;background:var(--card);border-radius:0 8px 8px 0;font-family:Lora,Georgia,serif;font-size:17px;line-height:1.6}
.cf{font-family:"Source Sans 3",Arial,sans-serif;font-size:14px;font-weight:600;background:#ffe9a8;color:#5a4300;padding:1px 5px;border-radius:2px}
.claims{margin-top:16px;font-size:15px;border:1px dashed var(--am);border-radius:8px;padding:12px 14px}
.verdict{font-family:Lora,Georgia,serif;font-size:20px;margin-top:16px}
video.playback{width:100%;border-radius:8px;background:#000;margin-top:12px}
details summary{cursor:pointer;font-weight:700}

.steps-line{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:22px}
.steps-line .on{color:var(--or)}.steps-line .done{color:var(--gr)}
.checkgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;margin-top:22px;align-items:start}
.say{font-family:Lora,Georgia,serif;font-size:22px;margin-top:4px}
ul.checks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
ul.checks li{display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:16px;color:var(--ink2)}
ul.checks li b{font-size:18px}
ul.checks li.ok{color:var(--gr)}ul.checks li.bad{color:var(--or-ink)}
details.guide{margin-top:14px;border:1px solid var(--rule);border-left:4px solid var(--gr);border-radius:0 8px 8px 0;background:var(--card);padding:12px 16px}
details.guide summary{font-weight:800;color:var(--gr)}
details.guide p{margin:8px 0 0;font-size:15px}
details.guide ul{margin:6px 0 0;padding-left:18px;font-size:15px;color:var(--ink2)}
details.guide li{margin:4px 0}
@media (max-width:820px){.checkgrid{grid-template-columns:1fr}}
.h-check{margin:6px 0 0}
.lede{font-size:18px;color:var(--ink2);margin:6px 0 16px}
.notice.small{font-size:14px;padding:10px 14px;margin-bottom:14px}
.check-cam{max-width:520px;aspect-ratio:4/3}
.checkrow{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;margin-top:16px;max-width:520px}
.checkrow .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:var(--rule);color:var(--ink2)}
.checkrow .ic.ok{background:var(--gr);color:#fff}.checkrow .ic.bad{background:#d92d20;color:#fff}.checkrow .ic.busy{background:var(--or);color:#fff}
.checkrow strong{display:block;font-size:17px}.checkrow span{color:var(--ink2);font-size:15px}
.checkrow em{font-style:normal;font-weight:700;color:var(--ink)}
.check-cam + .checkrow{margin-top:18px}
#lvl{transition:width .08s}
.meter{max-width:520px;margin-top:12px}
.heard{max-width:520px;margin-top:8px;font-family:Lora,Georgia,serif;font-size:18px;min-height:1.4em}
.help{max-width:520px;font-size:15px;color:var(--or-ink);margin:8px 0 0}
.stack{display:grid;gap:10px;max-width:520px;margin-top:16px}
.stack .btn{width:100%}
.stack .linkbtn{justify-self:start;padding:6px 0}
@media (max-width:640px){
  .wrap,main{padding-left:16px;padding-right:16px}
  .check-cam{aspect-ratio:auto;height:38vh;max-height:340px}
  .stage .cam{aspect-ratio:auto;height:30vh;max-height:280px}
  .ready .cam{height:26vh;aspect-ratio:auto}
  .qtext.big{font-size:26px}
  .btn.big{padding:16px 18px;font-size:17px}
  .stage .btn,.ready .btn{width:100%}
  .row{flex-wrap:wrap}
}
/* firm picker, follow-up */
.pickgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}
.pickgrid label{display:grid;gap:6px}
.pickgrid select,.pickgrid input{font:inherit;font-size:16px;padding:12px;border:1px solid var(--rule2);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.fu-tag{display:inline-block;margin-top:14px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--or);border-radius:999px;padding:4px 10px}
.fu-tag + .qtext{margin-top:8px}
textarea.ans.short{min-height:90px}
.pushback{margin-top:20px;padding:14px 16px;border-left:4px solid var(--or);background:var(--or-soft);border-radius:0 8px 8px 0}
.pushback h3{font-size:17px;margin:0}
.pushback .note{margin:6px 0 0;font-size:15px}
@media (max-width:820px){.pickgrid{grid-template-columns:1fr}}
/* how you came across */
.across{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:22px;padding-top:20px;border-top:1px solid var(--rule)}
.across h3{font-size:17px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.across ul{margin:6px 0 0;padding-left:18px;font-size:15px}
.across li{margin:4px 0}
.across .note{font-size:15px;color:var(--ink2);margin:6px 0 0}
.lang{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lang span{font-size:13px;border-radius:4px;padding:3px 8px;background:var(--or-soft);color:var(--or-ink)}
.lang span.ok{background:var(--gr-soft);color:var(--gr)}
@media (max-width:820px){.across{grid-template-columns:1fr}}
/* summary */
table.sum{width:100%;border-collapse:collapse;margin-top:16px;font-size:15px}
table.sum td,table.sum th{padding:12px 8px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
table.sum th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.cta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--ink);color:var(--paper);border-radius:8px;padding:24px 28px;margin-top:28px}
.cta p{margin:6px 0 0;opacity:.8;font-size:15px}
.foot{font-size:13px;color:var(--mute);margin-top:36px}

@media (max-width:820px){
 main{padding:24px 16px 60px}.top-in{padding:10px 16px}.top .ctx{display:none}
 h1{font-size:30px}.qtext{font-size:23px}.qtext.big{font-size:27px}.ready h2{font-size:30px}
 .modes,.setup-grid,.stage,.fbgrid{grid-template-columns:1fr}
 .crit div{grid-template-columns:110px minmax(0,1fr) 30px}
 .cta{grid-template-columns:1fr}
 .big-timer{font-size:48px}
}
</style>

<body>
<header class="top"><div class="top-in"><a class="logo" href="/">The <i>Desk</i></a><span class="ctx" id="ctxLine"></span><nav class="nav" id="deskNav"></nav></div></header>
<main id="app"><div class="card"><p>Loading interview practice…</p></div></main>

<script type="application/json" id="preview-data">/*__PREVIEW__*/</script>
<!--__CORE__-->
<script type="module">
// ---------------- setup ----------------
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const Core = window.IPCore || await import('/interview-practice-core.mjs');
const previewEl = document.getElementById('preview-data');
const PREVIEW = (() => { const t = previewEl.textContent.trim(); return t.startsWith('{') ? JSON.parse(t) : null; })();
const params = new URLSearchParams(location.search);
let assessmentId = params.get('id');
// Signed in with Full Cycle: practise on your own assessment without needing a link with an id.
const ME = PREVIEW ? { signedIn: false } : await fetch('/api/account').then(r => r.json()).catch(() => ({ signedIn: false }));
const isSample = !assessmentId && !(ME.signedIn && ME.access && ME.access.active);
const canSave = !PREVIEW && ME.signedIn && ME.access && ME.access.active;
// Natural interviewer voice and server transcription (OpenAI), when switched on for Full Cycle students.
const SERVER_VOICE = !!(canSave && ME.features && ME.features.serverVoice);
const SESSION_ID = Math.random().toString(36).slice(2, 12);
if (ME.signedIn) { const nav = document.getElementById('deskNav'); nav.innerHTML = '<a href="/my.html">My Desk</a>'; }

const S = { mode: 'video', camera: true, questions: [], i: 0, results: [], ctx: null, source: '', stream: null, recorder: null, chunks: [], recog: null, finalText: '', interimText: '', startedAt: 0, timer: null, prepTimer: null, blobUrl: null, typed: false };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const canMedia = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
const TTS = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance === 'function';
S.voiceOn = TTS;
// Anonymous usage events (see /desk-track.js). Never sends answers, transcripts or CV text.
const track = (e, p) => { try { if (window.deskTrack) window.deskTrack(e, p); } catch (x) { } };
// The interviewer's voice: a British English voice where the device has one.
function pickVoice() {
  const vs = TTS ? speechSynthesis.getVoices() : [];
  return vs.find(v => /en-GB/i.test(v.lang) && /(Google UK English|Daniel|Serena|Kate|Arthur|Martha|Libby|Ryan|Sonia)/i.test(v.name))
    || vs.find(v => /en-GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if (TTS) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }
// iPhone only lets a page talk after a tap: say nothing once, inside the tap.
function unlockSpeech() { if (!TTS || S.ttsUnlocked) return; S.ttsUnlocked = true; try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) { } }
// Server voice: decoded and played through the shared audio meter context, which a tap has already unlocked (iPhone).
const ttsCache = new Map();
async function serverSpeak(text) {
  const ac = audioCtx(); if (!ac) return false;
  let buf = ttsCache.get(text);
  if (!buf) {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 9000);
    try { const r = await fetch('/api/voice', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'tts', text }), signal: ctl.signal }); if (!r.ok) return false; buf = await ac.decodeAudioData(await r.arrayBuffer()); ttsCache.set(text, buf); }
    catch (e) { return false; } finally { clearTimeout(to); }
  }
  return new Promise(resolve => {
    try { if (S.ttsSrc) try { S.ttsSrc.stop(); } catch (e) { } const src = ac.createBufferSource(); S.ttsSrc = src; src.buffer = buf; src.connect(ac.destination); src.onended = () => resolve(true); src.start(); setTimeout(() => resolve(true), buf.duration * 1000 + 1500); }
    catch (e) { resolve(false); }
  });
}
function speak(text) {
  if (S.voiceOn && SERVER_VOICE && S.serverVoiceOn !== false) return serverSpeak(text).then(ok => ok || browserSpeak(text));
  return browserSpeak(text);
}
function browserSpeak(text) {
  return new Promise(resolve => {
    if (!S.voiceOn || !TTS) { resolve(false); return; }
    let u, v;
    try { speechSynthesis.cancel(); u = new SpeechSynthesisUtterance(text); v = pickVoice(); } catch (e) { resolve(false); return; }
    if (v) u.voice = v; u.lang = v ? v.lang : 'en-GB'; u.rate = 0.95;
    let done = false; const fin = () => { if (!done) { done = true; resolve(true); } };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, Math.max(4000, text.split(/\s+/).length * 650)); // some browsers never fire onend
    try { speechSynthesis.speak(u); } catch (e) { fin(); }
  });
}

async function api(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(d.error || 'Request failed'), { status: r.status });
  return d;
}
function firmBody() { const f = chosenFirm(); return { ...(f ? { firm: f } : {}), ...(S.division ? { division: S.division } : {}) }; }
function sampleBody() { return isSample ? { sample: 'amelia' } : assessmentId ? { assessmentId } : {}; }

// ---------------- screens ----------------
// ---------------- Step 1: a simple camera check and "say something" check ----------------
const STEPS = n => `<div class="steps-line"><span class="${n === 1 ? 'on' : 'done'}">1 · Check</span><span class="${n === 2 ? 'on' : ''}">2 · Choose</span><span>3 · Answer</span></div>`;
const isPhone = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
function setup() { checkScreen(); }

// One shared audio meter. Created inside a tap so iPhone doesn't start it "suspended" (which reads as silence).
function audioCtx() {
  if (!S.ac) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; try { S.ac = new AC(); } catch (e) { return null; } }
  if (S.ac.state === 'suspended') S.ac.resume().catch(() => { });
  return S.ac;
}
const live = s => s && s.getTracks().some(tr => tr.readyState === 'live');
const hasCam = () => !!(S.stream && S.stream.getVideoTracks().some(tr => tr.readyState === 'live'));
// Ask once for camera + microphone and keep the stream for the whole session.
// If the camera fails (no camera, in use, refused) we still try the microphone on its own.
async function getMedia() {
  if (live(S.stream)) return { stream: S.stream };
  const video = S.camera ? { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } : false;
  let camErr = null;
  if (video) {
    try { S.stream = await navigator.mediaDevices.getUserMedia({ audio: true, video }); return { stream: S.stream }; }
    catch (e) { camErr = e; }
  }
  try { S.stream = await navigator.mediaDevices.getUserMedia({ audio: true }); return { stream: S.stream, camErr }; }
  catch (e) { S.stream = null; return { error: e, camErr }; }
}
function attachVideo(el) {
  if (!el || !hasCam()) return;
  el.muted = true; el.setAttribute('muted', ''); el.setAttribute('playsinline', ''); el.autoplay = true;
  el.srcObject = S.stream;
  const p = el.play(); if (p && p.catch) p.catch(() => { });
}
function mediaHelp(e) {
  const n = e && e.name;
  if (n === 'NotAllowedError' || n === 'SecurityError') {
    if (window.self !== window.top) return 'This page is open inside another app, which blocks the camera and microphone. Open it directly in your browser.';
    return isIOS ? 'Access was blocked. On iPhone: tap “aA” in the address bar → Website Settings → set Camera and Microphone to Allow, then tap Try again.'
      : isPhone ? 'Access was blocked. Tap the padlock next to the web address → Permissions → allow Camera and Microphone, then tap Try again.'
      : 'Access was blocked. Click the camera icon or padlock in the address bar, choose Allow, then click Try again.';
  }
  if (n === 'NotFoundError' || n === 'OverconstrainedError') return 'No microphone was found. Plug in headphones with a mic, or try another device.';
  if (n === 'NotReadableError' || n === 'AbortError') return 'Another app (Zoom, Teams, FaceTime, a call) is using your microphone. Close it and try again.';
  if (!window.isSecureContext) return 'The camera and microphone only work on a secure https page. Open the page from thedesk.vercel.app.';
  return 'Your browser didn’t let this page use the microphone.';
}

function checkScreen() {
  clearTimers();
  const ctx = S.ctx || {};
  $('#ctxLine').textContent = isSample ? 'Sample: Amelia (fictional) · Barclays' : [ctx.firm, ctx.division].filter(Boolean).join(' · ');
  S.check = S.check || { cam: 'idle', mic: 'idle', words: '' };
  const blocked = !canMedia;
  app.innerHTML = `${STEPS(1)}
    ${isSample ? '<div class="notice small">You’re practising as our fictional candidate, Amelia. With Full Cycle, the questions come from your own CV.</div>' : ''}
    <h1 class="h-check">Quick check</h1>
    <p class="lede">Two things: can we see you, and can we hear you.</p>
    <div class="cam check-cam" id="testCam"><span id="camMsg">${blocked ? 'Camera not available in this browser' : 'Your camera will show here'}</span></div>
    <div class="checkrow" id="rowCam"></div>
    <div class="checkrow" id="rowMic"></div>
    <div class="meter"><i id="lvl"></i></div>
    <div class="heard" id="heard"></div>
    <p class="help" id="devHelp">${blocked ? (window.isSecureContext ? 'This browser can’t use a camera or microphone. Use Chrome or Safari, or type your answers.' : 'The camera and microphone only work on a secure https page. Open the page from thedesk.vercel.app.') : ''}</p>
    <div class="stack">
      <button class="btn or big" id="runCheck" ${blocked ? 'disabled' : ''}>Start the check</button>
      <button class="btn big hidden" id="toFormat">Continue →</button>
      <button class="linkbtn" id="noCam">${S.camera ? 'Practise without camera (audio only)' : 'Use my camera'}</button>
      <button class="linkbtn" id="typeOnly">Skip, I’ll type my answers</button>
    </div>`;
  drawChecks();
  if (hasCam()) { $('#testCam').innerHTML = '<video id="checkVid"></video>'; attachVideo($('#checkVid')); }
  $('#runCheck').onclick = runCheck;
  $('#toFormat').onclick = () => formatScreen();
  $('#noCam').onclick = () => { S.camera = !S.camera; if (!S.camera && S.stream) { S.stream.getVideoTracks().forEach(tr => { tr.stop(); S.stream.removeTrack(tr); }); } if (S.camera && S.stream && !S.stream.getVideoTracks().length) { S.stream.getTracks().forEach(tr => tr.stop()); S.stream = null; S.check = { cam: 'idle', mic: 'idle', words: '' }; } checkScreen(); };
  $('#typeOnly').onclick = () => { S.forceType = true; track('ip_type_only'); formatScreen(); };
  updateContinue();
}
function drawChecks() {
  const c = S.check, rc = $('#rowCam'), rm = $('#rowMic'); if (!rc) return;
  const row = (st, num, title, msg) => `<b class="ic ${st}">${st === 'ok' ? '✓' : st === 'bad' ? '!' : st === 'busy' ? '…' : num}</b><div><strong>${title}</strong><span>${msg}</span></div>`;
  rc.innerHTML = row(c.cam === 'ok' ? 'ok' : c.cam === 'bad' ? 'bad' : c.cam === 'busy' ? 'busy' : '', '1', 'Camera',
    { idle: S.camera ? 'Tap Start and allow access.' : 'Off. You’re practising audio only.', busy: 'Turning on…', ok: 'Working. You should see yourself above.', bad: S.check.camMsg || 'Not working. You can still practise audio only.' }[c.cam]);
  rm.innerHTML = row(c.mic === 'ok' ? 'ok' : c.mic === 'bad' ? 'bad' : c.mic === 'busy' ? 'busy' : '', '2', 'Say something',
    { idle: `Then say: <em>“I’m ready for my interview.”</em>`, busy: `Speak now: <em>“I’m ready for my interview.”</em>`, ok: c.words ? 'We heard you.' : 'We can hear you.', bad: 'We didn’t hear anything.' }[c.mic]);
}
function updateContinue() {
  const b = $('#toFormat'), run = $('#runCheck'); if (!b) return;
  const ok = S.check.mic === 'ok';
  b.classList.toggle('hidden', !ok); run.classList.toggle('or', !ok); run.classList.toggle('ghost', ok);
  if (ok) run.textContent = 'Run it again';
}

async function runCheck() {
  const btn = $('#runCheck'), help = $('#devHelp');
  audioCtx(); // must be created inside the tap on iPhone
  btn.disabled = true; btn.textContent = 'Checking…'; help.textContent = ''; $('#heard').textContent = '';
  const t0 = Date.now(); const sendCheck = () => track('ip_check', { cam: S.camera ? (S.check.cam === 'ok' ? 'ok' : 'bad') : 'off', mic: S.check.mic === 'ok' ? 'ok' : 'bad', words: !!S.check.words, sr: !!SR, secs: Math.round((Date.now() - t0) / 1000) });
  S.check = { cam: S.camera ? 'busy' : 'idle', mic: 'idle', words: '' }; drawChecks();
  const got = await getMedia();
  if (got.error) {
    S.check = { cam: S.camera ? 'bad' : 'idle', mic: 'bad', words: '', camMsg: 'Not available.' }; drawChecks();
    help.textContent = mediaHelp(got.error); btn.disabled = false; btn.textContent = 'Try again'; sendCheck(); return;
  }
  if (S.camera) {
    if (hasCam()) { S.check.cam = 'ok'; $('#testCam').innerHTML = '<video id="checkVid"></video>'; attachVideo($('#checkVid')); }
    else { S.check.cam = 'bad'; S.check.camMsg = got.camErr && got.camErr.name === 'NotReadableError' ? 'Another app is using your camera. Close it, or carry on audio only.' : got.camErr && got.camErr.name === 'NotAllowedError' ? 'Camera access was refused. That’s fine: carry on audio only, or allow it and try again.' : 'No camera found. That’s fine: you can practise audio only.'; $('#testCam').innerHTML = '<span>Audio only</span>'; }
  }
  S.check.mic = 'busy'; drawChecks();
  await listenTest();
  sendCheck();
  btn.disabled = false; btn.textContent = 'Try again';
  if (S.check.mic !== 'ok') help.textContent = isPhone ? 'Check your phone isn’t on silent-mic or a call, and speak close to it. Then tap Try again.' : 'Check your microphone isn’t muted and the right one is selected in your browser or computer settings. Then click Try again.';
  else if (!S.check.words) help.textContent = SR ? 'Your mic works, but live transcription didn’t catch the words. You can still practise: you’ll type or correct your answer afterwards.' : 'Your mic works. This browser can’t transcribe live, so you’ll type your answers. Chrome or Safari can transcribe.';
  if (S.check.mic === 'ok' && isIOS) help.textContent = (help.textContent ? help.textContent + ' ' : '') + 'Tip: to stop Safari asking every time, tap “aA” in the address bar → Website Settings → set Camera and Microphone to Allow.';
  drawChecks(); updateContinue();
}

// Listen for up to 8 seconds: pass as soon as we hear a voice (level) and, where supported, words.
function listenTest() {
  return new Promise(resolve => {
    const ac = audioCtx(); let an = null, src = null; const buf = new Float32Array(1024);
    try { if (ac && S.stream.getAudioTracks().length) { an = ac.createAnalyser(); an.fftSize = 1024; src = ac.createMediaStreamSource(S.stream); src.connect(an); } } catch (e) { an = null; }
    let voice = false, sr = null, ended = false; const t0 = Date.now(); S.checkDoneSoon = false;
    const done = () => {
      if (ended) return; ended = true; clearInterval(iv);
      if (sr) { S.checkSR = null; try { sr.abort(); } catch (e) { } }
      try { src && src.disconnect(); } catch (e) { }
      const el = $('#lvl'); if (el) el.style.width = '0';
      S.check.mic = voice || S.check.words ? 'ok' : 'bad'; drawChecks(); updateContinue(); resolve();
    };
    if (SR && !S.forceType) {
      try {
        sr = new SR(); S.checkSR = sr; sr.lang = 'en-GB'; sr.interimResults = true; sr.continuous = true;
        sr.onresult = e => { const w = Array.from(e.results).map(r => r[0].transcript).join(' ').trim(); if (w) { S.check.words = w; const h = $('#heard'); if (h) h.textContent = '“' + w + '”'; S.check.mic = 'ok'; drawChecks(); updateContinue(); if (!S.checkDoneSoon) { S.checkDoneSoon = true; setTimeout(done, Math.max(900, 2400 - (Date.now() - t0))); } } };
        sr.onerror = () => { };
        sr.onend = () => { if (!ended && S.checkSR === sr && Date.now() - t0 < 7000) { try { sr.start(); } catch (e) { } } };
        sr.start();
      } catch (e) { sr = null; }
    }
    const iv = setInterval(() => {
      if (an) { an.getFloatTimeDomainData(buf); let s = 0; for (let k = 0; k < buf.length; k++) s += buf[k] * buf[k]; const rms = Math.sqrt(s / buf.length); const el = $('#lvl'); if (el) el.style.width = Math.min(100, rms * 900) + '%'; if (rms > 0.015) voice = true; }
      if (voice && !S.check.words && S.check.mic !== 'ok') { S.check.mic = 'ok'; drawChecks(); updateContinue(); }
      const el = Date.now() - t0;
      if (el > 8000 || (voice && (!SR || S.forceType) && el > 2500)) done();
    }, 80);
  });
}

// ---------------- Step 2: choose the interview ----------------
// The report's own target firm is the default; students can practise for any other firm.
function reportFirm() { return (PREVIEW && S.baseCtx && S.baseCtx.firm) || (ME.assessment && ME.assessment.firm) || ''; }
function chosenFirm() { return (S.firmOther || '').trim() || S.firm || reportFirm(); }
function firmOptions() {
  const cur = S.firmOther ? '__other' : (S.firm || (Core.firmInfo(reportFirm()) || {}).name || '');
  const groups = [['UK banks', 'uk'], ['US banks', 'bulge'], ['European banks', 'europe'], ['Advisory boutiques', 'boutique'], ['Big Four', 'big4']];
  const first = PREVIEW ? '' : `<option value="" ${!cur ? 'selected' : ''}>My target firm (from my report)</option>`;
  return first + groups.map(([lab, g]) => `<optgroup label="${lab}">${Object.keys(Core.FIRMS).filter(k => Core.FIRMS[k].group === g).map(k => `<option ${k === cur ? 'selected' : ''}>${esc(k)}</option>`).join('')}</optgroup>`).join('') + `<option value="__other" ${cur === '__other' ? 'selected' : ''}>Another firm (type it)</option>`;
}
function divOptions() {
  const cur = S.division || (S.baseCtx && S.baseCtx.division) || '';
  const list = Core.DIVISIONS.slice(); if (cur && !list.some(d => d.toLowerCase() === cur.toLowerCase())) list.unshift(cur);
  return (PREVIEW ? '' : `<option value="" ${!cur ? 'selected' : ''}>My target division (from my report)</option>`) + list.map(d => `<option ${d.toLowerCase() === cur.toLowerCase() ? 'selected' : ''}>${esc(d)}</option>`).join('');
}
function firmNote() {
  const f = Core.firmInfo(chosenFirm());
  if (!f) return 'Questions use the firm and division from your report.';
  return f.values.length ? `Includes a question on ${f.name}’s ${f.label || 'values'}: ${f.values.join(' · ')}.` : `Questions will be asked as ${f.name}. We don’t hold ${f.name}’s published values yet, so there’s no values question.`;
}

function formatScreen() {
  clearTimers();
  S.typeMode = !!(S.forceType || !SR || !live(S.stream));
  app.innerHTML = `${STEPS(2)}
    <div class="eyebrow">Interview practice</div>
    <h1 style="margin-top:8px">Choose the interview you want to practise.</h1>
    <p style="font-size:18px;color:var(--ink2);max-width:42em;margin:10px 0 0">Five questions built from ${isSample ? 'Amelia’s' : 'your'} CV and target firm. ${S.typeMode ? 'You’ll type your answers.' : 'You’ll answer out loud.'}</p>
    <div class="pickgrid">
      <label><span class="label">Firm</span><select id="firmSel">${firmOptions()}</select></label>
      <label id="otherWrap" class="${S.firmOther ? '' : 'hidden'}"><span class="label">Firm name</span><input id="firmOther" maxlength="60" placeholder="e.g. Jefferies" value="${esc(S.firmOther || '')}"></label>
      <label><span class="label">Division</span><select id="divSel">${divOptions()}</select></label>
    </div>
    <p class="mute" id="firmNote" style="font-size:14px;margin:8px 0 0">${firmNote()}</p>
    <div class="modes" style="margin-top:22px">${Object.entries(Core.MODES).map(([k, m]) => `<button class="mode" data-mode="${k}" aria-pressed="${k === S.mode}"><b>${esc(m.label)}</b><span>${esc(m.blurb)}</span><small>${m.prepSec ? m.prepSec + 's to think · ' : ''}${Math.round(m.answerSec / 60 * 10) / 10} min per answer · 5 questions</small></button>`).join('')}</div>
    <div class="card" style="margin-top:20px">
      ${TTS ? `<label class="toggle" style="margin-top:0"><input type="checkbox" id="voiceToggle" ${S.voiceOn ? 'checked' : ''}> The interviewer reads each question aloud</label>` : ''}
      ${SERVER_VOICE ? `<label class="toggle"><input type="checkbox" id="sttToggle" ${S.serverSTT !== false ? 'checked' : ''}> Better transcription and a natural interviewer voice (your audio is sent securely to be transcribed and is not stored)</label>` : ''}
      <label class="toggle"><input type="checkbox" id="guideToggle" ${S.showGuide !== false ? 'checked' : ''}> Show me a short guide to answering each question (untick for exam conditions)</label>
      <label class="toggle" id="pbWrap"><input type="checkbox" id="pbToggle" ${S.pushBack !== false ? 'checked' : ''}> The interviewer pushes back with a follow-up question after each answer</label>
      <p class="mute" id="pbNote" style="font-size:13px;margin:4px 0 0 28px"></p>
      <div class="row"><button class="btn ghost" id="backCheck">← Back to the check</button><button class="btn or" id="start">Start the interview</button></div>
      <p class="mute" id="startNote" style="font-size:13px;margin:8px 0 0"></p>
    </div>
    <p class="foot">Feedback is generated by applying The Desk framework to your transcript and CV. It is practice, not a prediction of any firm’s decision. ${SERVER_VOICE && S.serverSTT !== false ? 'Your video stays on this device. Your audio is sent securely to be transcribed and is not stored; the transcript is used for feedback.' : 'Your video stays on this device; only the transcript is sent for feedback.'}</p>`;
  const pbNote = () => { const v = S.mode === 'video'; $('#pbToggle').disabled = v; $('#pbNote').textContent = v ? 'One-way video interviews never ask follow-ups, so this is off for that format.' : 'Like a real interviewer: one follow-up aimed at what you just said.'; };
  app.querySelectorAll('.mode').forEach(b => b.onclick = () => { S.mode = b.dataset.mode; app.querySelectorAll('.mode').forEach(x => x.setAttribute('aria-pressed', String(x === b))); pbNote(); });
  pbNote();
  $('#pbToggle').onchange = e => { S.pushBack = e.target.checked; };
  $('#firmSel').onchange = e => { const v = e.target.value; S.firm = v === '__other' ? '' : v; S.firmOther = v === '__other' ? (S.firmOther || ' ') : ''; $('#otherWrap').classList.toggle('hidden', v !== '__other'); if (v === '__other') $('#firmOther').focus(); $('#firmNote').textContent = firmNote(); };
  $('#firmOther').oninput = e => { S.firmOther = e.target.value; $('#firmNote').textContent = firmNote(); };
  $('#divSel').onchange = e => { S.division = e.target.value; };
  const vt = $('#voiceToggle'); if (vt) vt.onchange = () => { S.voiceOn = vt.checked; };
  $('#guideToggle').onchange = e => { S.showGuide = e.target.checked; };
  const st = $('#sttToggle'); if (st) st.onchange = e => { S.serverSTT = e.target.checked; S.serverVoiceOn = e.target.checked; };
  $('#backCheck').onclick = () => { S.forceType = false; checkScreen(); };
  $('#start').onclick = start;
}

// The personalised "How to answer this" card.
function guideHtml(q, open) {
  const g = q.guide; if (!g || S.showGuide === false) return '';
  return `<details class="guide" ${open ? 'open' : ''}><summary>How to answer this</summary><p>${esc(g.approach)}</p>${g.points && g.points.length ? `<ul>${g.points.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</details>`;
}

async function start() {
  audioCtx(); unlockSpeech();
  $('#start').disabled = true; $('#startNote').textContent = 'Building your questions…';
  try {
    if (PREVIEW) {
      S.ctx = Core.withFirm(S.baseCtx, chosenFirm(), S.division);
      S.questions = Core.buildQuestions(S.ctx, S.mode); S.source = 'framework';
    } else {
      const d = await api('/api/interview-questions', { ...sampleBody(), ...firmBody(), mode: S.mode });
      S.questions = d.questions; S.source = d.source; S.ctx = Object.assign(S.ctx || {}, d.context);
    }
  } catch (e) { $('#startNote').textContent = e.message; $('#start').disabled = false; return; }
  S.i = 0; S.results = []; S.usedFU = [];
  track('ip_start', { mode: S.mode, firm: S.ctx.firm || '', division: S.ctx.division || '', guide: S.showGuide !== false, pushback: S.pushBack !== false && S.mode !== 'video', typed: !!S.typeMode, voice: !!(S.voiceOn && TTS), sample: isSample }); $('#ctxLine').textContent = (isSample ? 'Sample: Amelia · ' : '') + [S.ctx.firm, S.ctx.division].filter(Boolean).join(' · ');
  if (canMedia && !S.forceType && !live(S.stream)) await getMedia();
  question();
}

function progressDots() { return `<div class="progress">${S.questions.map((q, k) => `<i class="${k < S.i ? 'done' : k === S.i ? 'on' : ''}"></i>`).join('')}</div>`; }
const TYPE_LABEL = { opening: 'Opening', motivation: 'Motivation', values: 'Firm values', cv: 'From your CV', competency: 'Competency', technical: 'Technical', commercial: 'Commercial awareness', closing: 'Closing' };

// Step 1: "Are you ready?"
function question() {
  clearTimers(); if (TTS) speechSynthesis.cancel();
  const q = S.questions[S.i];
  S.finalText = ''; S.interimText = ''; S.typed = !live(S.stream) || !SR || S.typeMode; S.main = null;
  const hasVideo = hasCam();
  const after = q.prepSec ? `You then get ${q.prepSec} seconds to think before recording starts on its own.` : 'Recording starts 3 seconds after the question, just like answering a real interviewer.';
  app.innerHTML = `${progressDots()}
    <div class="ready">
      <div class="label">Question ${S.i + 1} of ${S.questions.length} · ${esc(TYPE_LABEL[q.type] || q.type)}</div>
      <h2>Are you ready?</h2>
      <p>${S.voiceOn && TTS ? 'The interviewer will ask the question out loud and show it on screen.' : 'The question will appear on screen.'} ${after}</p>
      ${hasVideo ? '<div class="cam"><video id="vid" autoplay muted playsinline></video><span class="badge">Check your framing</span></div>' : ''}
      <button class="btn or big" id="askMe">I’m ready, ask me</button>
      ${TTS ? `<div style="margin-top:14px"><label class="toggle" style="justify-content:center;margin:0"><input type="checkbox" id="voiceT" ${S.voiceOn ? 'checked' : ''}> Read the question aloud</label></div>` : ''}
    </div>`;
  attachVideo($('#vid'));
  const vt = $('#voiceT'); if (vt) vt.onchange = () => { S.voiceOn = vt.checked; };
  $('#askMe').onclick = () => { audioCtx(); unlockSpeech(); ask(q); };
}

// Step 2: the interviewer asks; the question is shown large.
async function ask(q) {
  app.innerHTML = `${progressDots()}
    <div class="interviewer" id="iv"><span class="bars"><i></i><i></i><i></i><i></i></span><b>Interviewer</b><span id="ivState">${S.voiceOn && TTS ? (q.isFollowUp ? 'is pushing back…' : 'is asking…') : ''}</span>${TTS ? '<button class="linkbtn" id="repeat">↺ Repeat the question</button>' : ''}<span class="mute" style="margin-left:auto;font-size:14px">Question ${S.i + 1} of ${S.questions.length}</span></div>
    ${q.isFollowUp ? '<div class="fu-tag">Follow-up</div>' : ''}<div class="qtext big">${esc(q.text)}</div>
    <div class="qwhy">${esc(q.why || '')}</div>
    <div class="stage">
      <div>
        <div class="cam" id="cam">${hasCam() ? '<video id="vid" autoplay muted playsinline></video>' : '<span>' + (live(S.stream) ? 'Audio only' : 'No camera') + '</span>'}<span class="badge hidden" id="recBadge"><span class="dot"></span> Recording</span></div>
      </div>
      <div>
        <div id="phase"></div>
      </div>
    </div>
    <div class="lookfor ${(q.lookFor || []).length ? '' : 'hidden'}"><details><summary>What the interviewer is listening for</summary><ul>${(q.lookFor || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul>${q.evidence ? `<p class="mute" style="font-size:14px;margin:8px 0 0">Evidence to use: ${esc(q.evidence)}</p>` : ''}</details></div>`;
  attachVideo($('#vid'));
  const say = async () => {
    clearTimers();
    $('#phase').innerHTML = S.voiceOn && TTS ? '<p class="mute" style="margin:0">Listen to the question…</p>' : '';
    $('#iv').classList.add('speaking');
    const spoke = await speak(q.text);
    const iv = $('#iv'); if (!iv) return; // moved on
    iv.classList.remove('speaking'); $('#ivState').textContent = spoke ? (q.isFollowUp ? 'followed up' : 'asked the question') : '';
    if (q.prepSec) prepPhase(q); else if (q.guide && S.showGuide !== false) thinkPhase(q); else countdownPhase(q, spoke ? 3 : 5);
  };
  const rp = $('#repeat'); if (rp) rp.onclick = () => { S.voiceOn = true; say(); };
  say();
}

// Live-interview formats: a short countdown, then recording starts.
function countdownPhase(q, secs) {
  let left = secs;
  $('#phase').innerHTML = `<div class="label">Recording starts in</div><div class="count" id="cd">${left}</div><div class="row"><button class="btn rec" id="goNow">● Start now</button></div>`;
  $('#goNow').onclick = () => recordPhase(q);
  S.prepTimer = setInterval(() => { left--; const cd = $('#cd'); if (cd) cd.textContent = Math.max(left, 0); if (left <= 0) recordPhase(q); }, 1000);
}

// Live formats with the guide on: read the guide, then start when ready.
function thinkPhase(q) {
  $('#phase').innerHTML = `${guideHtml(q, true)}<div class="row"><button class="btn rec" id="goNow">● Start my answer</button></div>`;
  $('#goNow').onclick = () => recordPhase(q);
}
function prepPhase(q) {
  let left = q.prepSec;
  $('#phase').innerHTML = `<div class="label">Thinking time</div><div class="big-timer" id="pt">0:${String(left).padStart(2, '0')}</div><div class="tbar"><i id="pbar" style="width:100%"></i></div><p class="mute" style="font-size:14px">Recording starts automatically, just like a real video interview.</p><div class="row"><button class="btn or" id="goNow">Start answering now</button></div>${guideHtml(q, true)}`;
  $('#goNow').onclick = () => recordPhase(q);
  S.prepTimer = setInterval(() => { left--; const pt = $('#pt'); if (pt) pt.textContent = '0:' + String(Math.max(left, 0)).padStart(2, '0'); const pb = $('#pbar'); if (pb) pb.style.width = (left / q.prepSec * 100) + '%'; if (left <= 0) recordPhase(q); }, 1000);
}
function recordPhase(q) {
  audioCtx();
  clearTimers(); if (TTS) speechSynthesis.cancel();
  const rp = $('#repeat'); if (rp) rp.remove();
  S.startedAt = Date.now(); S.chunks = [];
  const limit = q.answerSec;
  $('#phase').innerHTML = `<div class="row" style="margin-top:0;justify-content:space-between"><div class="label" style="margin:0">${S.typed ? 'Type your answer' : 'Speak now'}</div><div style="font-weight:800;font-variant-numeric:tabular-nums" id="rt">${fmtTime(limit)}</div></div><div class="tbar"><i id="rbar" style="width:100%"></i></div>
    ${S.typed ? '<textarea class="ans" id="typed" placeholder="Write what you would say, in full sentences."></textarea>' : '<div class="live" id="live"><span class="interim">Listening…</span></div>'}
    <div class="row"><button class="btn" id="stop">■ Finish answer</button>${S.typed ? '' : '<button class="btn ghost" id="typeInstead">Type instead</button>'}</div>${guideHtml(q, false)}`;
  if (!S.typed) {
    $('#recBadge').classList.remove('hidden');
    try { if (window.MediaRecorder) { S.recorder = new MediaRecorder(S.stream); S.recorder.ondataavailable = e => e.data.size && S.chunks.push(e.data); S.recorder.start(1000); } } catch (e) { S.recorder = null; }
    S.audioRec = null; S.audioChunks = [];
    if (SERVER_VOICE && S.serverSTT !== false && window.MediaRecorder && S.stream.getAudioTracks().length) {
      try { const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'].find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || ''; S.audioRec = new MediaRecorder(new MediaStream(S.stream.getAudioTracks()), mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : undefined); S.audioRec.ondataavailable = e => e.data.size && S.audioChunks.push(e.data); S.audioRec.start(1000); } catch (e) { S.audioRec = null; }
    }
    startRecognition();
    startLevels();
  } else { const ta = $('#typed'); ta.focus(); }
  S.timer = setInterval(() => { const el = Math.round((Date.now() - S.startedAt) / 1000); const left = limit - el; const rt = $('#rt'); if (rt) rt.textContent = fmtTime(Math.max(left, 0)); const rb = $('#rbar'); if (rb) rb.style.width = Math.max(0, left / limit * 100) + '%'; if (left <= 0) finish(q, true); }, 500);
  $('#stop').onclick = () => finish(q, false);
  const ti = $('#typeInstead');
  if (ti) ti.onclick = () => { const so = S.finalText; const rec = S.recog; S.recog = null; if (rec) try { rec.stop(); } catch (e) { } S.typed = true; $('#live').outerHTML = '<textarea class="ans" id="typed"></textarea>'; $('#typed').value = so; $('#typed').focus(); ti.remove(); };
}

// Loudness every 100ms, on the device only, used to measure pauses and trailing off.
function startLevels() {
  S.levels = []; S.lastAudio = null;
  try {
    if (!S.stream || !S.stream.getAudioTracks().length) return;
    const ac = audioCtx(); if (!ac) return;
    const an = ac.createAnalyser(); an.fftSize = 1024; S.levelSrc = ac.createMediaStreamSource(S.stream); S.levelSrc.connect(an);
    const buf = new Float32Array(an.fftSize);
    S.levelTimer = setInterval(() => { an.getFloatTimeDomainData(buf); let s = 0; for (let k = 0; k < buf.length; k++) s += buf[k] * buf[k]; S.levels.push(Math.sqrt(s / buf.length)); }, 100);
  } catch (e) { S.levels = []; }
}
function stopLevels() {
  clearInterval(S.levelTimer); S.levelTimer = null;
  if (S.levelSrc) { try { S.levelSrc.disconnect(); } catch (e) { } S.levelSrc = null; }
  S.lastAudio = S.levels && S.levels.length ? Core.analysePauses(S.levels, 100) : null;
}

function startRecognition() {
  if (!SR) return;
  const r = new SR(); S.recog = r; r.lang = 'en-GB'; r.continuous = true; r.interimResults = true;
  r.onresult = e => { let interim = ''; for (let k = e.resultIndex; k < e.results.length; k++) { const t = e.results[k][0].transcript; if (e.results[k].isFinal) S.finalText += t.trim() + ' '; else interim += t; } S.interimText = interim; const live = $('#live'); if (live) { live.innerHTML = esc(S.finalText) + '<span class="interim">' + esc(interim) + '</span>'; live.scrollTop = live.scrollHeight; } };
  r.onend = () => { if (S.recog === r) { try { r.start(); } catch (e) { } } }; // keeps listening through pauses
  r.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { S.recog = null; S.typed = true; } };
  try { r.start(); } catch (e) { }
}

function finish(q, timedOut) {
  if (!S.timer) return;
  clearTimers();
  const durationSec = Math.min(q.answerSec, Math.round((Date.now() - S.startedAt) / 1000));
  let transcript = S.typed ? ($('#typed') ? $('#typed').value : '') : (S.finalText + ' ' + S.interimText);
  const rec = S.recog; S.recog = null; if (rec) try { rec.stop(); } catch (e) { }
  if (S.typed) S.lastAudio = null; if (S.levelTimer || S.levelSrc) stopLevels();
  const done = () => {
    const tx = transcript.replace(/\s+/g, ' ').trim();
    const nWords = (tx.match(/\S+/g) || []).length;
    track('ip_answer', { qtype: q.type, followup: !!q.isFollowUp, typed: !!S.typed, transcribed: !S.typed && nWords > 0, words: nWords, seconds: durationSec, timedOut: !!timedOut });
    if (q.isFollowUp) { if (S.blobUrl) { URL.revokeObjectURL(S.blobUrl); S.blobUrl = null; } const m = S.main; S.blobUrl = m.blobUrl; S.lastAudio = m.audio; return review(q.parent, m.transcript, m.durationSec, m.timedOut, { text: q.text, transcript: tx, durationSec }); }
    if (S.pushBack !== false && S.mode !== 'video' && (tx.match(/\S+/g) || []).length >= 5) { S.main = { transcript: tx, durationSec, timedOut, audio: S.lastAudio, blobUrl: S.blobUrl }; S.blobUrl = null; return followUpPhase(q, tx); }
    review(q, tx, durationSec, timedOut);
  };
  const stopRec = r => new Promise(res => { if (r && r.state !== 'inactive') { r.onstop = () => res(); try { r.stop(); } catch (e) { res(); } } else res(); });
  (async () => {
    const rec = S.recorder;
    await stopRec(rec);
    if (S.blobUrl) URL.revokeObjectURL(S.blobUrl);
    S.blobUrl = rec && S.chunks.length ? URL.createObjectURL(new Blob(S.chunks, { type: S.chunks[0].type })) : null;
    const ar = S.audioRec; S.audioRec = null;
    if (ar && !S.typed) {
      await stopRec(ar);
      if (S.audioChunks.length) {
        const ph = $('#phase'); if (ph) ph.innerHTML = '<p class="mute" style="margin:0">Transcribing your answer…</p>';
        const better = await serverTranscribe(new Blob(S.audioChunks, { type: (S.audioChunks[0].type || ar.mimeType || 'audio/webm') }), q.text);
        if (better) transcript = better;
      }
    }
    done();
  })();
}
// Sends the answer's audio to be transcribed (not stored). Falls back to the browser's transcript.
async function serverTranscribe(blob, context) {
  if (!blob || blob.size < 2000 || blob.size > 3 * 1024 * 1024) return '';
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 30000);
  try {
    const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = rej; fr.readAsDataURL(blob); });
    const r = await fetch('/api/voice', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'stt', audio: b64, mime: blob.type, context }), signal: ctl.signal });
    if (!r.ok) return '';
    const d = await r.json(); track('ip_stt', { ok: !!(d.text && d.text.length) }); return (d.text || '').trim();
  } catch (e) { track('ip_stt', { ok: false }); return ''; } finally { clearTimeout(to); }
}

// The interviewer pushes back with one follow-up aimed at the answer just given.
async function followUpPhase(q, tx) {
  app.innerHTML = `${progressDots()}<div class="interviewer speaking"><span class="bars"><i></i><i></i><i></i><i></i></span><b>Interviewer</b><span>is thinking about your answer…</span></div>`;
  S.usedFU = S.usedFU || [];
  let fu = Core.followUp(q, tx, Object.assign({}, S.ctx, { usedFollowUps: S.usedFU }));
  if (!PREVIEW) { try { const d = await Promise.race([api('/api/interview-feedback', { ...sampleBody(), ...firmBody(), stage: 'followup', question: { type: q.type, text: q.text,token:q.token }, transcript: tx }), new Promise((_, rej) => setTimeout(() => rej(new Error('slow')), 7000))]); if (d && d.followUp && d.followUp.text) fu = d.followUp; } catch (e) { } }
  else await new Promise(r => setTimeout(r, 700));
  if (!S.main) return; // left the question
  S.usedFU.push(fu.text);
  track('ip_followup', { qtype: q.type, source: fu.why === 'model' ? 'model' : 'rules' });
  S.finalText = ''; S.interimText = '';
  ask({ id: q.id + 'f', type: q.type, text: fu.text, why: 'The interviewer is pushing back. Answer directly, back it up, and stay calm.', lookFor: [], evidence: '', modelAnswer: '', prepSec: 0, answerSec: 60, guide: null, isFollowUp: true, parent: q });
}

function metricChips(m, q) {
  const over = m.durationSec >= q.answerSec;
  return `<div class="metrics"><span class="metric${over ? ' warn' : ''}">${fmtTime(m.durationSec)} of ${fmtTime(q.answerSec)}${over ? ' · cut off' : ''}</span><span class="metric">${m.words} words</span>${m.durationSec >= 20 ? `<span class="metric${m.wpm > 185 || (m.wpm && m.wpm < 95) ? ' warn' : ''}">${m.wpm} words/min</span>` : ''}<span class="metric${m.fillersPerMin > 4 ? ' warn' : ''}">${m.fillerTotal} filler word${m.fillerTotal === 1 ? '' : 's'}${m.fillerTotal ? ': ' + Object.entries(m.fillers).map(([k, v]) => k + ' ×' + v).join(', ') : ''}</span>${m.hedgeTotal ? `<span class="metric${m.hedgesPerMin > 3 ? ' warn' : ''}">Hedging: ${Object.entries(m.hedges).map(([k, v]) => Core.showPhrase(k) + ' ×' + v).join(', ')}</span>` : ''}${m.informalTotal ? `<span class="metric warn">Casual: ${Object.entries(m.informal).map(([k, v]) => k + ' ×' + v).join(', ')}</span>` : ''}${m.audio ? `<span class="metric${m.audio.stalls ? ' warn' : ''}">${m.audio.longPauses} pause${m.audio.longPauses === 1 ? '' : 's'} over 1.5s${m.audio.longestPauseSec ? ' · longest ' + m.audio.longestPauseSec + 's' : ''}</span><span class="metric${m.audio.startDelaySec > 4 ? ' warn' : ''}">Started after ${m.audio.startDelaySec}s</span>` : ''}${q.type === 'competency' ? `<span class="metric${m.weCount > m.iCount ? ' warn' : ''}">“I” ×${m.iCount} · “we” ×${m.weCount}</span>` : ''}</div>`;
}

function review(q, transcript, durationSec, timedOut, fu) {
  app.innerHTML = `${progressDots()}
    <div class="qtext" style="font-size:24px;margin-top:0">${esc(q.text)}</div>
    ${timedOut ? '<div class="notice" style="margin:12px 0 0">Time’s up. In a recorded interview your answer would be cut off here.</div>' : ''}
    <div class="stage">
      <div>${S.blobUrl ? `<div class="label">Watch it back</div><video class="playback" src="${S.blobUrl}" controls playsinline></video>` : '<div class="card mute" style="font-size:15px">No recording to play back. That’s fine: the feedback works from your words.</div>'}</div>
      <div>${transcript ? '' : '<div class="notice" style="margin:0 0 10px">We didn\u2019t catch any words. Type what you said below to get feedback.</div>'}<div class="label">Your answer (fix any transcription mistakes)</div><textarea class="ans" id="tx">${esc(transcript)}</textarea><div id="mx"></div>
      ${fu ? `<div class="label" style="margin-top:16px">The interviewer pushed back: <span style="text-transform:none;letter-spacing:0;color:var(--ink)">“${esc(fu.text)}”</span></div><textarea class="ans short" id="ftx" placeholder="What you said to the follow-up">${esc(fu.transcript)}</textarea>` : ''}
      <div class="row"><button class="btn or" id="fb">Get feedback</button><button class="btn ghost" id="redo">Try again</button></div><p class="mute" id="fbNote" style="font-size:13px;margin:8px 0 0"></p></div>
    </div>`;
  const audio = S.lastAudio;
  const upd = () => { $('#mx').innerHTML = metricChips(Core.deliveryMetrics($('#tx').value, durationSec, audio), q); };
  upd(); $('#tx').oninput = upd;
  $('#redo').onclick = () => { track('ip_retry', { qtype: q.type }); question(); };
  $('#fb').onclick = () => getFeedback(q, $('#tx').value.trim(), durationSec, audio, fu ? { text: fu.text, transcript: $('#ftx').value.trim() } : null);
}

async function getFeedback(q, transcript, durationSec, audio, fu) {
  if (transcript.length < 20) { $('#fbNote').textContent = 'Say or type a little more first.'; return; }
  $('#fb').disabled = true; $('#fbNote').textContent = 'Reading your answer…';
  const metrics = Core.deliveryMetrics(transcript, durationSec, audio);
  let quick = Core.quickCheck(q, transcript, metrics, S.ctx || { cvText: '' }), full = null, notice = '';
  try {
    if (PREVIEW) full = await previewFeedback(q, transcript, metrics, fu);
    else { const d = await api('/api/interview-feedback', { ...sampleBody(), ...firmBody(), question: q, transcript, durationSec, audio, followUp: fu }); full = d.feedback; quick = d.quick || quick; notice = d.notice || ''; }
  } catch (e) { notice = 'Full feedback is unavailable right now. Here is the automatic quick check.'; }
  if (!full && !notice) notice = 'Here is the automatic quick check.';
  S.results[S.i] = { q, transcript, metrics, quick, full, fu };
  if (canSave) saveAnswer(q, transcript, durationSec, full, quick, fu);
  track('ip_feedback', { qtype: q.type, kind: full ? 'full' : 'quick', overall: (full || quick).overall, followup: !!(fu && fu.text) });
  showFeedback(q, transcript, metrics, quick, full, notice, fu);
}

// Saves the practised answer to My Desk (signed-in Full Cycle students only).
function saveAnswer(q, transcript, durationSec, full, quick, fu) {
  const r = full || quick;
  fetch('/api/account', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'save', kind: 'interview', data: {
    session: SESSION_ID, mode: S.mode, firm: (S.ctx && S.ctx.firm) || '', division: (S.ctx && S.ctx.division) || '', qtype: q.type, question: q.text, transcript,
    followUp: fu && fu.text ? fu : null, durationSec, answerSec: q.answerSec, overall: r.overall, band: r.band, feedbackKind: full ? 'full' : 'quick',
    fixes: full ? full.fixes : (quick.tips || []) } }) })
    .then(res => { const n = document.getElementById('savedNote'); if (n) n.textContent = res.ok ? 'Saved to My Desk.' : ''; }).catch(() => { });
}

// Preview only: full feedback through the artifact's "sample" capability, validated by the same rules.
async function previewFeedback(q, transcript, metrics, fu) {
  const sample = window.claude && await window.claude.use('sample');
  if (!sample) return null;
  const prompt = Core.feedbackPrompt(S.ctx, q, transcript, metrics, fu) + '\nReturn ONLY a JSON object with keys: scores {relevance, structure, evidence, accuracy, convincing}, convincingNote, confidenceNote, followUpNote, verdict, strengths[], fixes[], strongerAnswer, checkTheseClaims[].';
  const out = await sample.json(prompt, { modelTier: 'default' });
  return Core.validateFeedback(out, S.ctx, q, transcript, fu);
}

function scoreBars(full, quick) {
  const rows = [['Answered the question', full ? full.scores.relevance : quick.scores.relevance], ['Structure', full ? full.scores.structure : quick.scores.structure], ['Your evidence', full ? full.scores.evidence : quick.scores.evidence]];
  if (full && full.scores.accuracy) rows.push(['Accuracy', full.scores.accuracy]);
  if (full) rows.push(['Convincing', full.scores.convincing]);
  rows.push(['Confidence', quick.scores.confidence], ['Delivery', quick.scores.delivery], ['Timing', quick.scores.timing]);
  return `<div class="crit">${rows.map(([l, v]) => `<div><span>${l}</span><span class="cbar"><i style="width:${v * 20}%"></i></span><b style="text-align:right">${v}/5</b></div>`).join('')}</div>`;
}
function acrossPanel(full, quick, m) {
  const c = quick.confidence || Core.confidenceAssessment(m);
  const bandCls = c.score >= 4 ? 'b-Strong' : c.score >= 3 ? 'b-Getting' : 'b-Needs';
  const conv = full ? full.scores.convincing : null;
  const convLabel = conv == null ? '' : conv >= 4 ? 'Convincing' : conv >= 3 ? 'Partly convincing' : 'Not yet convincing';
  const convCls = conv >= 4 ? 'b-Strong' : conv >= 3 ? 'b-Getting' : 'b-Needs';
  return `<div class="across">
    <div><h3>How confident you sounded <span class="bandpill ${bandCls}" style="font-size:11px;padding:3px 7px">${esc(c.label)}</span></h3>
      ${full && full.confidenceNote ? `<p class="note">${esc(full.confidenceNote)}</p>` : ''}
      ${c.minus.length ? `<ul>${c.minus.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      ${c.plus.length ? `<div class="lang">${c.plus.map(x => `<span class="ok">✓ ${esc(x)}</span>`).join('')}</div>` : ''}
      ${!m.audio ? '<p class="note mute" style="font-size:13px">Pauses are measured when you speak your answer with the microphone on.</p>' : ''}
    </div>
    <div><h3>Did you come across as convincing? ${conv != null ? `<span class="bandpill ${convCls}" style="font-size:11px;padding:3px 7px">${convLabel}</span>` : ''}</h3>
      ${full ? `<p class="note">${esc(full.convincingNote || '')}</p>` : '<p class="note">Judged in full feedback: a clear point of view, claims backed by specifics, a "so what" and ownership of what you did.</p>'}
    </div>
  </div>`;
}
const fmtConfirm = s => esc(s).replace(/\[confirm:\s*([^\]]+)\]/gi, '<span class="cf">$1</span>');

function showFeedback(q, transcript, metrics, quick, full, notice, fu) {
  const r = full || quick;
  const bandCls = 'b-' + r.band.split(' ')[0];
  const last = S.i >= S.questions.length - 1;
  app.innerHTML = `${progressDots()}
    ${notice ? `<div class="notice">${esc(notice)}</div>` : ''}
    <div class="qtext" style="font-size:22px;margin-top:0">${esc(q.text)}</div>
    <div class="card" style="margin-top:16px">
      <div class="fb-head"><div class="overall">${r.overall}<small> / 5</small></div><span class="bandpill ${bandCls}">${esc(r.band)}</span>${full ? '' : '<span class="mute" style="font-size:14px">Automatic quick check</span>'}</div>
      ${full && full.verdict ? `<div class="verdict">“${esc(full.verdict)}”</div>` : ''}
      ${scoreBars(full, quick)}
      ${metricChips(metrics, q)}
      ${acrossPanel(full, quick, metrics)}
      ${fu && fu.text ? `<div class="pushback"><h3>How you handled the push-back</h3><p class="mute" style="margin:4px 0 0;font-size:15px">“${esc(fu.text)}”</p><p class="note">${esc((full && full.followUpNote) || Core.followUpQuick(fu))}</p></div>` : ''}
      <div class="fbgrid">
        <div><div class="label" style="color:var(--gr)">What worked</div><ul>${(full ? full.strengths : quick.usedCvDetails.length ? ['You used real detail from your CV: ' + quick.usedCvDetails.slice(0, 4).join(', ')] : ['You gave an answer you can now improve']).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
        <div><div class="label" style="color:var(--or-ink)">Fix next time</div><ul>${(full ? full.fixes : quick.tips.length ? quick.tips : ['Add one specific example with a result.']).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
      </div>
      ${full && full.strongerAnswer ? `<div class="label" style="margin-top:22px">A stronger version, in your words (fill the yellow gaps)</div><div class="stronger">${fmtConfirm(full.strongerAnswer)}</div>` : ''}
      ${q.modelAnswer && !(full && full.strongerAnswer) ? `<div class="label" style="margin-top:22px">Model answer</div><div class="stronger">${esc(q.modelAnswer)}</div>` : ''}
      ${full && full.checkTheseClaims.length ? `<div class="claims"><b>Make sure you can back these up:</b> ${full.checkTheseClaims.map(esc).join(' · ')}</div>` : ''}
      <details style="margin-top:18px"><summary>Your transcript</summary><p style="color:var(--ink2)">${esc(transcript)}</p>${fu && fu.text ? `<p style="color:var(--ink2)"><b>Follow-up:</b> ${esc(fu.text)}<br>${esc(fu.transcript || '')}</p>` : ''}</details>
    </div>
    ${canSave ? '<p class="mute" id="savedNote" style="font-size:14px;margin:10px 0 0">Saving to My Desk…</p>' : ''}
    <div class="row"><button class="btn ghost" id="again">Try this question again</button><button class="btn or" id="next">${last ? 'See my summary' : 'Next question →'}</button></div>`;
  $('#again').onclick = () => { track('ip_retry', { qtype: q.type }); question(); };
  $('#next').onclick = () => { if (last) summary(); else { S.i++; question(); } };
}

function summary() {
  stopMedia();
  const done = S.results.filter(Boolean);
  const avg = done.length ? +(done.reduce((a, r) => a + (r.full || r.quick).overall, 0) / done.length).toFixed(1) : 0;
  const fixes = done.flatMap(r => r.full ? r.full.fixes.slice(0, 1) : r.quick.tips.slice(0, 1)).slice(0, 4);
  track('ip_complete', { answered: done.length, avg });
  const weakest = done.slice().sort((a, b) => (a.full || a.quick).overall - (b.full || b.quick).overall)[0];
  app.innerHTML = `<div class="eyebrow">Your practice summary</div><h1 style="margin-top:8px">${done.length ? `Average ${avg} / 5 across ${done.length} answer${done.length > 1 ? 's' : ''}.` : 'No answers scored yet.'}</h1>
    ${weakest ? `<p style="font-size:18px;color:var(--ink2);margin:12px 0 0">Practise first: <b>${esc(weakest.q.text)}</b></p>` : ''}
    <table class="sum"><thead><tr><th>Question</th><th>Score</th><th>Confidence</th><th>Biggest fix</th></tr></thead><tbody>
    ${S.questions.map((q, k) => { const r = S.results[k]; const x = r && (r.full || r.quick); return `<tr><td>${esc(q.text)}</td><td>${x ? `<b>${x.overall}</b> <span class="bandpill b-${x.band.split(' ')[0]}" style="font-size:11px;padding:3px 7px">${esc(x.band)}</span>` : '<span class="mute">Skipped</span>'}</td><td>${r && r.quick.confidence ? esc(r.quick.confidence.label) : ''}</td><td style="color:var(--ink2)">${r ? esc((r.full ? r.full.fixes[0] : r.quick.tips[0]) || 'Add one specific example with a result.') : ''}</td></tr>`; }).join('')}
    </tbody></table>
    ${fixes.length ? `<div class="card" style="margin-top:24px"><div class="label">Your three habits to work on</div><ul style="margin:6px 0 0;padding-left:18px">${[...new Set(fixes)].slice(0, 3).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    ${window.DESK_CONFIG && DESK_CONFIG.callUrl ? `<div class="card" style="margin-top:24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:240px"><b>${esc(DESK_CONFIG.callLabel)}</b><p class="mute" style="margin:4px 0 0;font-size:15px">${esc(DESK_CONFIG.callBlurb)}</p></div><a class="btn or" id="ctaCall" href="${esc(DESK_CONFIG.callUrl)}" target="_blank" rel="noopener">Book a call</a></div>` : ''}
    <div class="cta"><div><h2 style="font-size:24px;color:inherit">Want a real interviewer to hear this?</h2><p>Our practitioners have hired for these roles. A mock interview with one of them is the closest thing to the real day.</p></div><a class="btn or" href="/mentor.html" id="ctaMentor">Ask about a mock interview</a></div>
    ${canSave ? '<p class="mute" style="font-size:15px;margin:18px 0 0">Every answer is saved. See how you’re improving on <a href="/my.html">My Desk</a>.</p>' : ''}
    <div class="row" style="margin-top:22px"><button class="btn" id="again">Practise another set</button><button class="btn ghost" id="copy">Copy my answers</button></div>`;
  $('#ctaMentor').addEventListener('click', () => track('ip_cta', { target: 'mentor' }));
  const cc = $('#ctaCall'); if (cc) cc.addEventListener('click', () => { track('ip_cta', { target: 'call' }); track('call_click', { where: 'interview' }); });
  $('#again').onclick = () => { S.results = []; setup(); };
  $('#copy').onclick = async () => { const text = S.questions.map((q, k) => { const r = S.results[k]; return `Q: ${q.text}\nA: ${r ? r.transcript : '(skipped)'}\n${r && r.fu && r.fu.text ? 'Follow-up: ' + r.fu.text + '\nA: ' + (r.fu.transcript || '') + '\n' : ''}${r && r.full && r.full.strongerAnswer ? 'Stronger version: ' + r.full.strongerAnswer + '\n' : ''}`; }).join('\n'); try { await navigator.clipboard.writeText(text); $('#copy').textContent = 'Copied'; } catch (e) { $('#copy').textContent = 'Copy failed'; } };
}

// Show unexpected errors on screen so a tester can report them.
function showError(msg) { let b = document.getElementById('errBanner'); if (!b) { b = document.createElement('div'); b.id = 'errBanner'; b.className = 'notice'; b.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;z-index:99;border-color:#d92d20'; document.body.appendChild(b); } b.textContent = 'Something went wrong: ' + msg + ' (please tell us what you clicked)'; }
window.addEventListener('error', e => showError(e.message || 'unknown error'));
window.addEventListener('unhandledrejection', e => showError((e.reason && e.reason.message) || String(e.reason)));
window.addEventListener('pagehide', () => { if (S.stream) S.stream.getTracks().forEach(tr => tr.stop()); });
// ---------------- helpers ----------------
function fmtTime(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function clearTimers() { clearInterval(S.timer); clearInterval(S.prepTimer); S.timer = null; S.prepTimer = null; }
function stopMedia() { clearTimers(); if (S.checkSR) { try { S.checkSR.abort(); } catch (e) { } S.checkSR = null; } if (TTS) speechSynthesis.cancel(); const r = S.recog; S.recog = null; if (r) try { r.stop(); } catch (e) { } if (S.stream) { S.stream.getTracks().forEach(t => t.stop()); S.stream = null; } }
window.addEventListener('pagehide', stopMedia);

// Load context line for paid users before setup.
if (PREVIEW) { S.baseCtx = Core.contextFromReport(PREVIEW.report, PREVIEW.cvText); S.ctx = S.baseCtx; }
track('ip_view', { sample: isSample });
setup();
</script>
</body>
