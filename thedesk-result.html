<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>The Desk · Application Assessment</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--paper:#f7f3ee;--ink:#171512;--muted:rgba(23,21,18,.58);--line:rgba(23,21,18,.13);--terra:#b85c38;--navy:#102137;--white:#fffdfa}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}.nav{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.logo{font-family:'Fraunces',serif;font-size:21px}.logo em{color:var(--terra)}.navsmall{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:rgba(23,21,18,.4)}.wrap{max-width:760px;margin:0 auto;padding:50px 24px 90px}.demo{display:none;border:1px solid #e3c99c;background:#fff7e8;padding:10px 12px;font-size:11px;margin-bottom:28px}.ey{font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(23,21,18,.42);margin-bottom:10px}h1,h2,h3{font-family:'Fraunces',serif;font-weight:300}h1{font-size:clamp(40px,7vw,66px);line-height:1;letter-spacing:-2px;margin:0 0 26px}.intro{font-size:14px;line-height:1.7;color:var(--muted);max-width:620px}.verdict{margin:42px 0 0;padding:30px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.verdict-top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}.decision{font-family:'Fraunces',serif;font-size:32px;line-height:1.15;max-width:520px}.score{text-align:right;min-width:105px}.score strong{font-family:'Fraunces',serif;font-size:38px;font-weight:300}.score span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--terra)}.read{font-size:15px;line-height:1.75;margin-top:18px}.signals{margin:34px 0}.signal{display:grid;grid-template-columns:130px 1fr;gap:18px;padding:18px 0;border-top:1px solid var(--line)}.signal:last-child{border-bottom:1px solid var(--line)}.signal label{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:rgba(23,21,18,.43);padding-top:3px}.signal strong{display:block;font-family:'Fraunces',serif;font-size:20px;font-weight:300;margin-bottom:5px}.signal p{margin:0;font-size:13px;line-height:1.65;color:var(--muted)}.unlock{margin-top:42px;background:var(--white);border:1px solid var(--line);padding:30px}.unlock h2{font-size:31px;margin:0 0 8px}.unlock .sub{font-size:13px;line-height:1.7;color:var(--muted);margin-bottom:24px}.preview{padding:16px 0;border-top:1px solid var(--line)}.preview:first-of-type{border-top:2px solid var(--ink)}.preview .k{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:rgba(23,21,18,.42);margin-bottom:6px}.preview h3{font-size:20px;margin:0 0 6px}.preview p{font-size:12.5px;line-height:1.65;color:var(--muted);margin:0}.lockline{margin-top:7px;font-size:11px;color:var(--terra);font-weight:600}.cta{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-top:24px;padding-top:22px;border-top:1px solid var(--line)}.price{font-family:'Fraunces',serif;font-size:43px}.price small{font-family:'DM Sans',sans-serif;font-size:9px;display:block;text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}.btn{background:var(--terra);color:#fff;text-decoration:none;padding:13px 18px;font-size:12px;font-weight:600}.note{font-size:10px;color:var(--muted);margin-top:9px}.bank{font-style:italic}@media(max-width:600px){.wrap{padding:36px 20px 70px}.verdict-top{display:block}.score{text-align:left;margin-top:18px}.signal{grid-template-columns:1fr;gap:7px}.cta{display:block}.btn{display:block;text-align:center;margin-top:16px}}</style></head><body><div class="nav"><div class="logo">The<em>Desk</em></div><div class="navsmall">Free application assessment</div></div><main class="wrap"><div class="demo" id="demo">Sample result for testing. Complete the assessment to generate your own.</div><div class="ey">Your recruiter read</div><h1 id="headline">You are credible. But this version is not ready yet.</h1><div class="intro" id="intro"></div><div id="app"></div></main><script>
const sample={result:{overallScore:58,band:'Borderline',killerSentence:'I would not reject this immediately, but I would hesitate to progress it in a competitive IBD process.',diagnostic:'Warwick Economics gives you a credible academic base and the Oakbridge internship is genuinely relevant. The issue is that your strongest experience is under-framed and your numerical result creates avoidable doubt about technical readiness.',dimensions:[{name:'Academic signal',score:78,visibleSummary:'Warwick Economics and a predicted First are a positive signal.'},{name:'Relevant experience',score:74,visibleSummary:'Oakbridge gives you real transaction exposure, but the CV undersells it.'},{name:'Commercial awareness',score:60,visibleSummary:'Interest is visible, but commercial judgement is not yet distinctive.'},{name:'Technical readiness',score:42,visibleSummary:'A 2/5 numerical result is the clearest weakness.'}],priorityGaps:[{title:'Technical readiness',visibleRisk:'Your numerical score is below where we would want it before applications.'},{title:'Oakbridge is under-sold',visibleRisk:'Your comparable-company and buyer-research work reads as support activity rather than analytical contribution.'}],fullCycleCta:'Full Cycle turns this into a repair plan.'},firm:'Goldman Sachs',div:'Investment Banking',uni:'University of Warwick',crs:'Economics',gr:'First Class (predicted)',fS:3,nS:2,cvText:'Oakbridge Advisory — Spring Intern\n• Supported a small corporate finance team working with UK mid-market clients.\n• Researched potential acquisition targets.\n• Helped prepare comparable company analysis using revenue, EBITDA and valuation multiples.\nTesco — Customer Assistant\n• Worked 15–20 hours per week alongside university studies.',profile:{name:'James Walker'}};
let data=null;try{const raw=sessionStorage.getItem('tdesk_r');if(raw)data=JSON.parse(raw)}catch(e){}if(!data||!data.result){data=sample;document.getElementById('demo').style.display='block'}
const r=data.result||{},p=data.profile||{},dims=Array.isArray(r.dimensions)?r.dimensions:[],gaps=Array.isArray(r.priorityGaps)?r.priorityGaps:[];const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const firm=data.firm||p.targetFirm||'your target bank';const cv=data.cvText||'';const lines=cv.split(/\n+/).map(x=>x.trim()).filter(Boolean);const bullet=lines.find(x=>/comparable|valuation|buyer|client|transaction|research|analysis|intern/i.test(x))||lines.find(x=>x.length>35)||'one of your strongest CV bullets';const strongest=dims.slice().sort((a,b)=>(b.score||0)-(a.score||0))[0]||{};const weakest=dims.slice().sort((a,b)=>(a.score||0)-(b.score||0))[0]||{};const num=Number(data.nS??data.quiz?.technicalCorrect??0);const comm=Number(data.fS??data.quiz?.commercialCorrect??0);const verdict=(r.killerSentence||r.diagnostic||'Your application has credible ingredients, but the current version still gives a recruiter reasons to hesitate.');document.getElementById('intro').innerHTML=`<strong>${esc(p.name||data.name||'Candidate')}</strong> · ${esc(data.uni||p.university||'')} · ${esc(firm)} ${esc(data.div||p.targetDivision||'')}`;document.getElementById('headline').textContent=(r.band||'').toLowerCase().includes('strong')?'This is a profile I would keep reading.':'You are credible. But this version is not ready yet.';
const bankGuide=`Our ${firm} guide will show you what this bank is likely to reward, how to position your experience, and which parts of your profile need to do more work.`;const numText=num<=2?`Your ${num}/5 numerical result is a clear risk. In Full Cycle we would route you into the free maths drills, timed numerical practice and the specific topics you missed.`:num<=3?`Your ${num}/5 numerical result is workable, but not comfortable. Full Cycle would identify the weak topics and give you targeted maths practice before applications.`:`Your numerical score is a relative strength. Full Cycle would keep this maintained while focusing effort elsewhere.`;const commText=comm<=2?`Your commercial/technical score says you need more structured reading and concept work. Full Cycle will point you to the technical explainer content, commercial reading plan and bank-specific prep.`:comm<=3?`Your commercial/technical base is there, but it needs more depth. Full Cycle will show you which concepts to revise and what to read next.`:`Your commercial/technical base is credible. Full Cycle would focus on making your answers more bank-specific and interview-ready.`;
document.getElementById('app').innerHTML=`<section class="verdict"><div class="verdict-top"><div><div class="ey">Would I progress this?</div><div class="decision">${esc(verdict)}</div></div><div class="score"><strong>${esc(r.overallScore??'—')}/100</strong><span>${esc(r.band||'Assessment')}</span></div></div><div class="read">${esc(r.diagnostic||'')}</div></section><section class="signals"><div class="signal"><label>Strongest signal</label><div><strong>${esc(strongest.name||'Relevant evidence')}</strong><p>${esc(strongest.visibleSummary||'There is credible material here.')}</p></div></div><div class="signal"><label>Biggest risk</label><div><strong>${esc(weakest.name||gaps[0]?.title||'Positioning')}</strong><p>${esc(weakest.visibleSummary||gaps[0]?.visibleRisk||'The application is not yet sharp enough.')}</p></div></div><div class="signal"><label>Fix first</label><div><strong>${esc(gaps[0]?.title||'Your strongest CV evidence')}</strong><p>${esc(gaps[0]?.visibleRisk||'We would start with the evidence that should be carrying the application.')}</p></div></div></section><section class="unlock"><div class="ey">What Full Cycle would work on</div><h2>We already know where we would start.</h2><div class="sub">The free assessment tells you what is weakening the application. Full Cycle unlocks the actual rewrite, practice plan and bank-specific preparation.</div><div class="preview"><div class="k">CV rewrite preview</div><h3>We would work on this part of your CV</h3><p>“${esc(bullet.slice(0,180))}${bullet.length>180?'…':''}”</p><div class="lockline">Locked: exact rewrite + why it is stronger</div></div><div class="preview"><div class="k">Numerical + technical plan</div><h3>Your practice plan is not generic</h3><p>${esc(numText)} ${esc(commText)}</p><div class="lockline">Locked: drills, topic list, explanations and practice sequence</div></div><div class="preview"><div class="k">${esc(firm)} guide</div><h3 class="bank">How this profile should be positioned for ${esc(firm)}</h3><p>${esc(bankGuide)}</p><div class="lockline">Locked: bank guide + profile-specific positioning</div></div><div class="cta"><div><div class="price">£79<small>Full Cycle</small></div><div class="note">Your assessment is free. The actual repair plan sits inside Full Cycle.</div></div><a class="btn" href="/fullcycle.html">Show me exactly what to fix →</a></div></section>`;
</script></body></html>
