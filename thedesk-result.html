<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>The Desk · Application MOT</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#F7F3EE;color:#1A1714;font-family:'DM Sans',sans-serif}.nav{height:54px;border-bottom:1px solid rgba(26,23,20,.08);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;background:#F7F3EE;z-index:5}.logo{font-family:'Fraunces',serif;font-size:20px}.logo em{color:#B85C38}.badge{margin-left:12px;padding-left:12px;border-left:1px solid rgba(26,23,20,.15);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:rgba(26,23,20,.45)}.wrap{max-width:760px;margin:0 auto;padding:38px 22px 80px}.demo{display:none;background:#fff4df;border:1px solid #ead3a3;border-radius:5px;padding:10px 13px;font-size:12px;margin-bottom:22px}.ey{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:rgba(26,23,20,.45);margin-bottom:8px}h1,h2{font-family:'Fraunces',serif;font-weight:300}h1{font-size:42px;line-height:1.05;letter-spacing:-1px;margin:0 0 24px}h1 em{color:#B85C38;font-style:italic}.score{background:#1A1714;color:#F7F3EE;border-radius:7px;padding:26px;margin-bottom:18px}.scoretop{display:flex;justify-content:space-between;gap:20px}.scorelabel{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:rgba(247,243,238,.4)}.num{font-family:'Fraunces',serif;font-size:58px;font-weight:300;line-height:1;margin-top:5px}.num small{font-size:22px;opacity:.35}.band{display:inline-block;margin-top:9px;padding:4px 8px;border-radius:3px;background:rgba(184,92,56,.22);color:#e49a80;font-size:10px;text-transform:uppercase;letter-spacing:.1em}.target{text-align:right;color:rgba(247,243,238,.6);font-family:'Fraunces',serif;font-size:18px}.target small{font-family:'DM Sans',sans-serif;font-size:11px;color:rgba(247,243,238,.35);display:block;margin-top:5px}.killer{border-top:1px solid rgba(247,243,238,.1);margin-top:18px;padding-top:16px;color:rgba(247,243,238,.64);font-size:14px;line-height:1.65;font-style:italic}.profile{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(26,23,20,.08);margin:0 0 30px;border:1px solid rgba(26,23,20,.08)}.pitem{background:#FDFAF7;padding:13px}.pk{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:rgba(26,23,20,.4);margin-bottom:4px}.pv{font-size:12px}.section{margin:34px 0}.sectiontitle{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.13em;color:rgba(26,23,20,.45);padding-bottom:9px;border-bottom:1px solid rgba(26,23,20,.08);margin-bottom:4px}.dim{padding:15px 0;border-bottom:1px solid rgba(26,23,20,.08)}.dimhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}.dimname{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}.dimscore{font-family:'Fraunces',serif;font-size:18px}.bar{height:2px;background:rgba(26,23,20,.08);margin-bottom:9px}.fill{height:100%;background:#1A1714}.note{font-size:13px;color:rgba(26,23,20,.62);line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.comp,.gap{background:#FDFAF7;border:1px solid rgba(26,23,20,.08);border-radius:6px;padding:16px}.compname,.gaptitle{font-family:'Fraunces',serif;font-size:17px;margin-bottom:7px}.status{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:#1A6B3A;margin-bottom:9px}.gap{border-top:2px solid #B85C38}.gapnum{font-size:9px;color:#B85C38;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}.callout{border-left:3px solid #B85C38;padding:14px 17px;margin:18px 0;font-size:14px;line-height:1.65}.locked{margin-top:34px;background:#1A1714;color:#F7F3EE;border-radius:7px;padding:28px}.locked h2{font-size:29px;margin:0 0 9px}.locked p{color:rgba(247,243,238,.62);line-height:1.65;font-size:13px}.btn{display:inline-block;background:#F7F3EE;color:#1A1714;text-decoration:none;padding:12px 18px;border-radius:4px;margin-top:12px;font-size:13px;font-weight:600}@media(max-width:650px){.profile{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.scoretop{display:block}.target{text-align:left;margin-top:18px}h1{font-size:34px}}</style></head><body><div class="nav"><div class="logo">The<em>Desk</em></div><div class="badge">Application MOT</div></div><main class="wrap"><div class="demo" id="demo">Demo result — no completed assessment was found in this browser, so this page is showing the sample candidate for testing.</div><div class="ey">Your application MOT</div><h1>How your application is <em>really being read.</em></h1><div id="app"></div></main><script>const sample={result:{overallScore:58,band:'Borderline',archetype:'Relevant underdog · technical weakness',killerSentence:'This profile has more relevant evidence than the academic signal alone would suggest, but technical readiness is the likely failure point.',diagnostic:'The Oakbridge corporate finance internship and Warwick Finance Society work give this application credible transaction exposure. The weakness is that the technical score does not yet support the strength of the CV evidence.',dimensions:[{name:'Academic Signal',score:78,visibleSummary:'Strong academic profile from Warwick with relevant economics and finance modules.'},{name:'Experience',score:72,visibleSummary:'Relevant boutique corporate-finance exposure is a genuine positive signal.'},{name:'Commercial Awareness',score:60,visibleSummary:'Commercial understanding is present, but the reasoning is not yet consistently interview-ready.'},{name:'Technical Readiness',score:42,visibleSummary:'The numerical score is the clearest screening risk in the current profile.'},{name:'Positioning',score:55,visibleSummary:'The profile contains relevant evidence but does not yet read as a sharp Goldman IBD application.'},{name:'Clarity',score:64,visibleSummary:'The CV is readable, but some bullets describe activity rather than impact.'}],competencies:[{name:'Leadership',status:'Partially evidenced',visibleReason:'Some ownership is visible, but there is no standout leadership example yet.'},{name:'Analytical',status:'Evidenced',visibleReason:'Comparable-company analysis and the valuation project provide credible analytical evidence.'},{name:'Commercial',status:'Partially evidenced',visibleReason:'Finance interest is credible, but commercial reasoning is not yet consistently strong under test conditions.'},{name:'Communication',status:'Partially evidenced',visibleReason:'Presentations and client-support work suggest a reasonable communication base.'},{name:'Resilience',status:'Evidenced',visibleReason:'Part-time work alongside university is a credible reliability and workload signal.'},{name:'Teamwork',status:'Evidenced',visibleReason:'Internship, society and part-time work all show repeated team exposure.'}],priorityGaps:[{title:'Technical readiness — below screening threshold',visibleRisk:'A 2/5 numerical result is the clearest risk in an otherwise credible IBD profile.'},{title:'Relevant evidence is present but under-framed',visibleRisk:'The Oakbridge internship is useful, but several bullets still read as support activity rather than ownership.'},{title:'Commercial awareness is not yet distinctive',visibleRisk:'The profile looks interested in banking, but not yet differentiated by commercial judgement.'},{title:'Application positioning lacks a single clear story',visibleRisk:'The CV contains good ingredients, but the application does not yet have one obvious reason to progress this candidate.'}],recruiterMayMiss:'The boutique corporate-finance experience is more relevant than it first appears, especially the buyer research and comparable-company work.',uncomfortableTruth:'The CV is credible enough to get attention, but the current technical readiness could still stop the process early.',fullCycleCta:'You have usable material, but it is not yet landing as a Goldman Sachs application. Full Cycle shows what to lead with, what to cut, and how to rebuild the profile around the evidence that matters.'},firm:'Goldman Sachs',div:'Investment Banking / IBD',uni:'University of Warwick',crs:'Economics',gr:'First Class (predicted)',fS:3,nS:2,profile:{name:'James Walker',year:'2nd Year',programme:'Summer Internship'}};let data=null;try{const raw=sessionStorage.getItem('tdesk_r');if(raw)data=JSON.parse(raw)}catch(e){}if(!data||!data.result){data=sample;document.getElementById('demo').style.display='block'}const r=data.result||{},p=data.profile||{},dims=Array.isArray(r.dimensions)?r.dimensions:[],comps=Array.isArray(r.competencies)?r.competencies:[],gaps=Array.isArray(r.priorityGaps)?r.priorityGaps:[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));document.getElementById('app').innerHTML=`<div class="score"><div class="scoretop"><div><div class="scorelabel">Overall application score</div><div class="num">${esc(r.overallScore??'—')}<small>/100</small></div><div class="band">${esc(r.band||'Assessment')}</div></div><div class="target">${esc(data.firm||r.targetFirm||p.targetFirm||'Target firm')}<small>${esc(data.div||r.targetDivision||p.targetDivision||'')}</small></div></div><div class="killer">“${esc(r.killerSentence||r.diagnostic||'Your recruiter read will appear here.')}”</div></div><div class="profile"><div class="pitem"><div class="pk">Candidate</div><div class="pv">${esc(p.name||data.name||'—')}</div></div><div class="pitem"><div class="pk">University</div><div class="pv">${esc(data.uni||p.university||'—')}</div></div><div class="pitem"><div class="pk">Commercial</div><div class="pv">${esc(data.fS??data.quiz?.commercialCorrect??'—')}/5</div></div><div class="pitem"><div class="pk">Numerical</div><div class="pv">${esc(data.nS??data.quiz?.technicalCorrect??'—')}/5</div></div></div><div class="section"><div class="sectiontitle">The recruiter read</div><div class="callout"><strong>${esc(r.archetype||'Your profile')}</strong><br>${esc(r.diagnostic||'')}</div>${r.recruiterMayMiss?`<div class="note"><strong>What a recruiter may miss:</strong> ${esc(r.recruiterMayMiss)}</div>`:''}</div><div class="section"><div class="sectiontitle">What a recruiter sees today</div>${dims.map(d=>`<div class="dim"><div class="dimhead"><div class="dimname">${esc(d.name)}</div><div class="dimscore">${esc(d.score)}/100</div></div><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,Number(d.score)||0))}%"></div></div><div class="note">${esc(d.visibleSummary||d.note||'')}</div></div>`).join('')}</div><div class="section"><div class="sectiontitle">Competencies assessed</div><div class="grid">${comps.map(c=>`<div class="comp"><div class="compname">${esc(c.name)}</div><div class="status">${esc(c.status||'Assessed')}</div><div class="note">${esc(c.visibleReason||c.reason||'')}</div></div>`).join('')}</div></div><div class="section"><div class="sectiontitle">Priority gaps</div><div class="grid">${gaps.map((g,i)=>`<div class="gap"><div class="gapnum">Priority ${i+1}</div><div class="gaptitle">${esc(g.title||g)}</div><div class="note">${esc(g.visibleRisk||'')}</div></div>`).join('')}</div></div>${r.uncomfortableTruth?`<div class="section"><div class="sectiontitle">The uncomfortable truth</div><div class="callout">${esc(r.uncomfortableTruth)}</div></div>`:''}<div class="locked"><div class="ey" style="color:rgba(247,243,238,.35)">Full Cycle · £79</div><h2>Diagnosis is free. The rebuild is not.</h2><p>${esc(r.fullCycleCta||'Full Cycle turns the MOT into a detailed application repair plan: CV changes, positioning, technical gaps, commercial preparation and interview priorities.')}</p><a class="btn" href="/fullcycle.html">See the Full Cycle report →</a></div>`;</script></body></html>
