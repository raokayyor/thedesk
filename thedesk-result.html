<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Desk · Application MOT</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f3ee;--white:#fffdfa;--ink:#171512;--muted:rgba(23,21,18,.58);--line:rgba(23,21,18,.12);--terra:#b85c38;--green:#1a6b3a;--amber:#996018;--navy:#102137}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}.nav{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;background:rgba(247,243,238,.96);backdrop-filter:blur(10px);z-index:5}.logo{font-family:'Fraunces',serif;font-size:21px}.logo em{color:var(--terra)}.navnote{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:rgba(23,21,18,.4)}.wrap{max-width:980px;margin:0 auto;padding:54px 28px 100px}.demo{display:none;border:1px solid #e6cfa3;background:#fff7e8;padding:12px 14px;font-size:12px;margin-bottom:28px}.ey{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.16em;color:rgba(23,21,18,.43);margin-bottom:10px}.hero{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:46px;align-items:end;padding-bottom:38px;border-bottom:1px solid var(--line)}h1,h2,h3{font-family:'Fraunces',serif;font-weight:300}h1{font-size:clamp(42px,7vw,72px);line-height:.98;letter-spacing:-2.2px;margin:0;max-width:720px}h1 em{color:var(--terra)}.candidate{font-size:13px;line-height:1.7;color:var(--muted);padding-bottom:6px}.candidate strong{display:block;color:var(--ink);font-size:15px;font-weight:500}.decision{display:grid;grid-template-columns:210px minmax(0,1fr);gap:36px;padding:42px 0;border-bottom:1px solid var(--line)}.scorebox{background:var(--navy);color:#f7f3ee;padding:24px;align-self:start}.scorelabel{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:rgba(247,243,238,.45)}.score{font-family:'Fraunces',serif;font-size:66px;line-height:1;margin:7px 0 4px}.score small{font-size:22px;opacity:.35}.band{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#efb19b}.decisioncopy h2{font-size:34px;margin:0 0 13px;letter-spacing:-.8px}.decisionline{font-size:19px;line-height:1.55;margin-bottom:17px}.decisiondetail{font-size:14px;line-height:1.8;color:var(--muted);max-width:660px}.stamp{display:inline-block;margin-top:18px;border:1px solid var(--terra);color:var(--terra);padding:8px 11px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.12em}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:42px;padding:44px 0;border-bottom:1px solid var(--line)}.col h3{font-size:25px;margin:0 0 20px}.item{padding:14px 0;border-top:1px solid var(--line)}.item:first-of-type{border-top:2px solid var(--ink)}.itemtitle{font-size:13px;font-weight:600;margin-bottom:6px}.itemtext{font-size:13px;line-height:1.7;color:var(--muted)}.item.good:first-of-type{border-top-color:var(--green)}.item.risk:first-of-type{border-top-color:var(--terra)}.quote{padding:44px 0;border-bottom:1px solid var(--line)}.quote blockquote{font-family:'Fraunces',serif;font-size:clamp(26px,4vw,39px);line-height:1.28;margin:12px 0 16px;letter-spacing:-.7px;max-width:850px}.quote p{font-size:13px;line-height:1.75;color:var(--muted);max-width:760px}.section{padding:44px 0;border-bottom:1px solid var(--line)}.sectionhead{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:22px}.sectionhead h2{font-size:32px;margin:0;letter-spacing:-.6px}.sectionhead p{max-width:420px;margin:0;font-size:12px;line-height:1.65;color:var(--muted)}.dimensions{display:grid;grid-template-columns:1fr 1fr;column-gap:42px}.dim{padding:18px 0;border-top:1px solid var(--line)}.dimhead{display:flex;align-items:baseline;justify-content:space-between;gap:15px}.dimname{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}.dimscore{font-family:'Fraunces',serif;font-size:20px}.bar{height:2px;background:rgba(23,21,18,.08);margin:10px 0}.fill{height:100%;background:var(--ink)}.dimnote{font-size:12.5px;line-height:1.65;color:var(--muted)}.competencies{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}.competency{padding:19px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:150px;background:rgba(255,253,250,.45)}.competency h3{font-size:19px;margin:0 0 8px}.status{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--green);margin-bottom:10px}.competency p{font-size:12px;line-height:1.65;color:var(--muted);margin:0}.gaps{counter-reset:g}.gap{display:grid;grid-template-columns:52px 250px minmax(0,1fr);gap:22px;padding:20px 0;border-top:1px solid var(--line)}.gapnum{font-family:'Fraunces',serif;font-size:28px;color:var(--terra)}.gaptitle{font-size:14px;font-weight:600;line-height:1.45}.gaptext{font-size:13px;line-height:1.7;color:var(--muted)}.truth{background:var(--ink);color:#f7f3ee;padding:34px;margin-top:44px}.truth .ey{color:rgba(247,243,238,.4)}.truth p{font-family:'Fraunces',serif;font-size:28px;line-height:1.35;margin:0;max-width:820px}.paywall{margin-top:20px;background:var(--white);border:1px solid var(--line);padding:32px}.paygrid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:40px;align-items:center}.paywall h2{font-size:34px;margin:0 0 12px}.paywall p{font-size:13.5px;line-height:1.75;color:var(--muted);margin:0}.lockedlist{margin:20px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px 24px}.lockedlist li{font-size:12px;padding:8px 0;border-top:1px solid var(--line)}.price{text-align:center;border-left:1px solid var(--line);padding-left:34px}.price strong{font-family:'Fraunces',serif;font-size:48px;font-weight:300}.price span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:3px}.btn{display:block;text-decoration:none;background:var(--terra);color:white;padding:13px 16px;margin-top:16px;font-size:12px;font-weight:600}.footnote{font-size:10px!important;margin-top:10px!important}.profileline{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px}.tag{font-size:10px;border-top:1px solid var(--line);padding-top:7px;color:var(--muted)}@media(max-width:760px){.wrap{padding:36px 20px 70px}.nav{padding:0 20px}.hero,.decision,.twocol,.paygrid{grid-template-columns:1fr}.hero{gap:22px}.decision{gap:22px}.scorebox{width:180px}.dimensions{grid-template-columns:1fr}.competencies{grid-template-columns:1fr 1fr}.gap{grid-template-columns:38px 1fr}.gaptext{grid-column:2}.price{text-align:left;border-left:0;border-top:1px solid var(--line);padding:24px 0 0}.lockedlist{grid-template-columns:1fr}}@media(max-width:480px){.competencies{grid-template-columns:1fr}h1{font-size:43px}.decisioncopy h2,.sectionhead h2,.paywall h2{font-size:28px}}
</style>
</head>
<body>
<div class="nav"><div class="logo">The<em>Desk</em></div><div class="navnote">Application MOT · recruiter view</div></div>
<main class="wrap">
<div class="demo" id="demo">Sample result shown for design testing. Complete the assessment to generate your own recruiter read.</div>
<div class="ey">Free application MOT</div>
<div class="hero"><div><h1>The question is not whether your CV is <em>good.</em> It is whether it gets progressed.</h1></div><div class="candidate" id="candidate"></div></div>
<div id="app"></div>
</main>
<script>
const sample={result:{overallScore:58,band:'Borderline',archetype:'Relevant experience, but not yet interview-safe',killerSentence:'I would pause on this application rather than reject it immediately — the relevant experience is real, but the technical weakness creates enough doubt that it may not survive a competitive screen.',diagnostic:'There is more here than the score suggests. The Oakbridge corporate-finance internship gives the profile credible banking evidence, and Warwick is a strong academic base. The problem is that the application currently asks the recruiter to do too much work: the strongest experience is under-framed, the technical result is weak, and the overall story is not yet sharp enough for a highly competitive IBD process.',dimensions:[{name:'Academic signal',score:78,visibleSummary:'Warwick Economics and a predicted First give you a credible academic platform. This is not the part of the application holding you back.'},{name:'Relevant experience',score:74,visibleSummary:'The boutique corporate-finance internship is genuinely useful. Buyer research, comparable-company analysis and transaction support are all relevant — but the CV needs to make your contribution feel more substantial.'},{name:'Commercial awareness',score:60,visibleSummary:'You sound interested in banking, but not yet commercially distinctive. The profile needs evidence that you can connect markets, companies and transactions rather than simply follow finance news.'},{name:'Technical readiness',score:42,visibleSummary:'This is the clearest weakness. A 2/5 numerical score creates avoidable doubt around valuation, accounting and interview readiness.'},{name:'Positioning',score:53,visibleSummary:'The raw ingredients are better than the current story. At the moment the application reads as “interested in banking” rather than “already building towards IBD”.'},{name:'Clarity',score:66,visibleSummary:'The CV is readable, but several bullets describe tasks rather than judgement, ownership or outcome. That makes relevant experience look lighter than it is.'}],competencies:[{name:'Analytical',status:'Credible evidence',visibleReason:'Comparable-company work and valuation-related experience support this.'},{name:'Commercial',status:'Needs strengthening',visibleReason:'Interest is visible, but commercial judgement is not yet differentiated.'},{name:'Communication',status:'Some evidence',visibleReason:'Presentation and client-support exposure help, but impact is under-described.'},{name:'Leadership',status:'Light evidence',visibleReason:'There is ownership, but no clear high-conviction leadership example.'},{name:'Resilience',status:'Credible evidence',visibleReason:'Part-time work alongside university is a positive reliability signal.'},{name:'Teamwork',status:'Credible evidence',visibleReason:'Repeated exposure across internship, society and part-time roles.'}],priorityGaps:[{title:'Technical readiness is below the rest of the profile',visibleRisk:'Your CV can create interest, but a weak numerical/technical signal gives the recruiter a reason not to take the risk. This needs fixing before the application, not after you get an interview.'},{title:'Your strongest experience is under-sold',visibleRisk:'The Oakbridge internship is relevant enough to matter, yet the current framing makes you sound like support rather than someone who understood the transaction work.'},{title:'There is no sharp “why you” story',visibleRisk:'Warwick + boutique corporate finance + finance society should combine into a coherent IBD trajectory. At present they read as separate facts rather than one convincing progression.'},{title:'Commercial awareness is competent, not memorable',visibleRisk:'You need one or two areas where your thinking is genuinely specific — sectors, transactions, valuation debates or market themes — rather than broad banking interest.'}],recruiterMayMiss:'The boutique corporate-finance experience is more relevant than a quick scan may suggest. The buyer research and comparable-company work are usable IBD evidence if they are rewritten with more ownership and specificity.',uncomfortableTruth:'You are close enough to be credible, but not strong enough to rely on the recruiter giving you the benefit of the doubt. In a crowded process, the current version can lose to candidates with weaker experience but cleaner positioning and better technical readiness.',fullCycleCta:'The free MOT tells you where the application is leaking. Full Cycle shows exactly how to rebuild it: which CV bullets to rewrite, what your application story should be, where your technical gaps sit, what commercial topics to prepare, and what a recruiter is likely to challenge in interview.'},firm:'Goldman Sachs',div:'Investment Banking',uni:'University of Warwick',crs:'Economics',gr:'First Class (predicted)',fS:3,nS:2,profile:{name:'James Walker',year:'2nd Year',programme:'Summer Internship'}};
let data=null;try{const raw=sessionStorage.getItem('tdesk_r');if(raw)data=JSON.parse(raw)}catch(e){}
if(!data||!data.result){data=sample;document.getElementById('demo').style.display='block'}
const r=data.result||{},p=data.profile||{},dims=Array.isArray(r.dimensions)?r.dimensions:[],comps=Array.isArray(r.competencies)?r.competencies:[],gaps=Array.isArray(r.priorityGaps)?r.priorityGaps:[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const firm=data.firm||r.targetFirm||p.targetFirm||'Target firm',div=data.div||r.targetDivision||p.targetDivision||'',name=p.name||data.name||'Candidate';
document.getElementById('candidate').innerHTML=`<strong>${esc(name)}</strong>${esc(data.uni||p.university||'')}<br>${esc(data.crs||p.course||'')} · ${esc(data.gr||p.grade||'')}<div class="profileline"><span class="tag">${esc(firm)}</span><span class="tag">${esc(div)}</span></div>`;
const decisionWord=(r.band||'Assessment').toLowerCase().includes('strong')?'Progress':(r.band||'').toLowerCase().includes('competitive')?'Progress with questions':'Borderline / needs work';
const helps=dims.filter(d=>Number(d.score)>=65).slice(0,3);const hurts=dims.filter(d=>Number(d.score)<65).sort((a,b)=>(a.score||0)-(b.score||0)).slice(0,3);
const compReason=(c)=>c.visibleReason||c.reason||'';
document.getElementById('app').innerHTML=`
<section class="decision"><div class="scorebox"><div class="scorelabel">Application strength</div><div class="score">${esc(r.overallScore??'—')}<small>/100</small></div><div class="band">${esc(r.band||'Assessment')}</div></div><div class="decisioncopy"><div class="ey">Would I progress this?</div><h2>${esc(decisionWord)}</h2><div class="decisionline">${esc(r.killerSentence||r.diagnostic||'Your recruiter verdict will appear here.')}</div><div class="decisiondetail">${esc(r.diagnostic||'')}</div><div class="stamp">Recruiter read · ${esc(firm)} ${esc(div)}</div></div></section>
<section class="twocol"><div class="col"><div class="ey">What is helping you</div><h3>The reasons I keep reading</h3>${helps.map(d=>`<div class="item good"><div class="itemtitle">${esc(d.name)}</div><div class="itemtext">${esc(d.visibleSummary||d.note||'')}</div></div>`).join('')||'<div class="item good"><div class="itemtext">No clear strength is carrying the application yet.</div></div>'}</div><div class="col"><div class="ey">What is stopping you</div><h3>The reasons I hesitate</h3>${hurts.map(d=>`<div class="item risk"><div class="itemtitle">${esc(d.name)}</div><div class="itemtext">${esc(d.visibleSummary||d.note||'')}</div></div>`).join('')}</div></section>
<section class="quote"><div class="ey">The 15-second recruiter read</div><blockquote>“${esc(r.archetype||'Your profile')}.”</blockquote><p>${esc(r.recruiterMayMiss||'')}</p></section>
<section class="section"><div class="sectionhead"><div><div class="ey">Six-part assessment</div><h2>Where the application actually stands</h2></div><p>The score is only useful if it explains why the application feels stronger or weaker. These are the six signals doing the work.</p></div><div class="dimensions">${dims.map(d=>`<div class="dim"><div class="dimhead"><div class="dimname">${esc(d.name)}</div><div class="dimscore">${esc(d.score)}/100</div></div><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,Number(d.score)||0))}%"></div></div><div class="dimnote">${esc(d.visibleSummary||d.note||'')}</div></div>`).join('')}</div></section>
<section class="section"><div class="sectionhead"><div><div class="ey">Evidence check</div><h2>What your CV currently proves</h2></div><p>Recruiters do not score “potential”; they infer it from evidence. This is how the current profile maps to the usual competencies.</p></div><div class="competencies">${comps.map(c=>`<div class="competency"><h3>${esc(c.name)}</h3><div class="status">${esc(c.status||'Assessed')}</div><p>${esc(compReason(c))}</p></div>`).join('')}</div></section>
<section class="section"><div class="sectionhead"><div><div class="ey">Priority issues</div><h2>The four things I would fix first</h2></div><p>These are not generic CV tips. They are the specific reasons this profile is currently losing strength.</p></div>${gaps.map((g,i)=>`<div class="gap"><div class="gapnum">0${i+1}</div><div class="gaptitle">${esc(g.title||g)}</div><div class="gaptext">${esc(g.visibleRisk||'')}</div></div>`).join('')}</section>
<div class="truth"><div class="ey">The uncomfortable truth</div><p>${esc(r.uncomfortableTruth||'The application needs a sharper story and clearer evidence before it is ready for a competitive process.')}</p></div>
<section class="paywall"><div class="paygrid"><div><div class="ey">Full Cycle</div><h2>You now know the problem. The paid report shows the rebuild.</h2><p>${esc(r.fullCycleCta||'Full Cycle turns this diagnosis into a specific application repair plan.')}</p><ul class="lockedlist"><li>Exact CV bullets to rewrite</li><li>Your strongest application story</li><li>Technical gaps to close</li><li>Commercial topics to prepare</li><li>Likely interview challenge areas</li><li>Firm-specific positioning</li></ul></div><div class="price"><strong>£79</strong><span>one complete application review</span><a class="btn" href="/fullcycle.html">Open Full Cycle →</a><p class="footnote">Not another score. A concrete rebuild plan.</p></div></div></section>`;
</script>
</body></html>
