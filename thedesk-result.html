<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>The Desk · Recruiter Read</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--paper:#f7f3ee;--ink:#171512;--muted:rgba(23,21,18,.6);--line:rgba(23,21,18,.13);--terra:#b85c38;--green:#245f3d;--amber:#996018;--white:#fffdfa}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}.nav{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(247,243,238,.95);position:sticky;top:0;z-index:5}.logo{font-family:'Fraunces',serif;font-size:21px}.logo em{color:var(--terra)}.navsmall,.ey{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(23,21,18,.42)}.wrap{max-width:860px;margin:0 auto;padding:48px 24px 90px}.demo{display:none;border:1px solid #e3c99c;background:#fff7e8;padding:10px 12px;font-size:11px;margin-bottom:26px}h1,h2,h3{font-family:'Fraunces',serif;font-weight:300}h1{font-size:clamp(42px,7vw,68px);line-height:1;letter-spacing:-2px;margin:7px 0 20px}.intro{font-size:14px;color:var(--muted);line-height:1.7}.verdict{margin-top:38px;padding:30px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.verdictTop{display:flex;justify-content:space-between;gap:24px}.decision{font-family:'Fraunces',serif;font-size:30px;line-height:1.2;max-width:610px}.score{text-align:right;min-width:120px}.score strong{font-family:'Fraunces',serif;font-size:42px;font-weight:300}.score span{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--terra)}.read{font-size:15px;line-height:1.8;margin-top:18px;max-width:760px}.section{padding:38px 0;border-bottom:1px solid var(--line)}.section h2{font-size:30px;margin:5px 0 9px}.sectionLead{font-size:13px;line-height:1.7;color:var(--muted);max-width:690px;margin-bottom:22px}.signals{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}.signal{padding:20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(255,253,250,.45)}.signal strong{font-family:'Fraunces',serif;font-size:20px;font-weight:300;display:block;margin:7px 0}.signal p{font-size:12.5px;line-height:1.65;color:var(--muted);margin:0}.competencies{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}.comp{padding:22px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(255,253,250,.45)}.compHead{display:flex;justify-content:space-between;gap:18px;align-items:baseline}.comp h3{font-size:21px;margin:0}.compScore{font-family:'Fraunces',serif;font-size:23px}.bar{height:2px;background:rgba(23,21,18,.08);margin:12px 0 15px}.fill{height:100%;background:var(--ink)}.mini{font-size:9px;text-transform:uppercase;letter-spacing:.11em;color:rgba(23,21,18,.42);margin:11px 0 5px}.comp p{font-size:12px;line-height:1.65;color:var(--muted);margin:0}.improve{color:var(--ink)!important}.tests{display:grid;grid-template-columns:1fr 1fr;gap:18px}.test{padding:20px;border:1px solid var(--line);background:var(--white)}.test strong{font-family:'Fraunces',serif;font-size:26px;font-weight:300}.test p{font-size:12.5px;line-height:1.65;color:var(--muted)}.unlock{margin-top:38px;background:var(--white);border:1px solid var(--line);padding:30px}.unlock h2{font-size:31px;margin:6px 0 8px}.preview{padding:15px 0;border-top:1px solid var(--line)}.preview:first-of-type{border-top:2px solid var(--ink)}.preview h3{font-size:20px;margin:4px 0 6px}.preview p{font-size:12.5px;line-height:1.65;color:var(--muted);margin:0}.lockline{font-size:11px;color:var(--terra);font-weight:600;margin-top:7px}.cta{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-top:24px;padding-top:22px;border-top:1px solid var(--line)}.price{font-family:'Fraunces',serif;font-size:44px}.price small{display:block;font-family:'DM Sans',sans-serif;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.btn{background:var(--terra);color:#fff;text-decoration:none;padding:13px 18px;font-size:12px;font-weight:600}@media(max-width:700px){.signals,.competencies,.tests{grid-template-columns:1fr}.verdictTop,.cta{display:block}.score{text-align:left;margin-top:18px}.btn{display:block;text-align:center;margin-top:16px}}</style></head><body><div class="nav"><div class="logo">The<em>Desk</em></div><div class="navsmall">Free Application Assessment</div></div><main class="wrap"><div class="demo" id="demo">Sample result for testing. Complete the assessment to generate your own.</div><div class="ey">Your Recruiter Read</div><h1 id="headline">You are credible. But this version is not ready yet.</h1><div class="intro" id="intro"></div><div id="app"></div></main><script>const sample={result:{overallScore:67,band:'Competitive',killerSentence:'I would keep reading. You have enough relevant evidence to be taken seriously for IBD, but I would still hesitate in a crowded Barclays process.',diagnostic:'Bristol Economics & Finance is a solid academic base, Redcliffe Partners gives you genuine transaction-related experience, and the LVMH valuation project gives you something concrete to discuss technically. The problem is that your strongest experience is under-sold and your 3/5 numerical result says you are not yet completely interview-safe.',dimensions:[{name:'Academic signal',score:78,visibleSummary:'Strong enough academically for a serious IBD application.'},{name:'Relevant experience',score:76,visibleSummary:'Redcliffe is genuinely useful and should carry more of the application.'},{name:'Commercial awareness',score:63,visibleSummary:'Good base, but not yet distinctive enough in a competitive process.'},{name:'Technical readiness',score:59,visibleSummary:'Workable, but the testing suggests more repetition is needed.'},{name:'Positioning',score:61,visibleSummary:'Good ingredients, but the story is not yet sharp enough.'},{name:'Clarity',score:68,visibleSummary:'Readable, but too many bullets sound supportive rather than analytical.'}],competencies:[{name:'Analytical ability',score:76,evidence:'Comparable-company analysis at Redcliffe and the LVMH DCF/comps project show real analytical exposure.',improve:'Show more of what you concluded, not just the analysis you performed.'},{name:'Teamwork',score:72,evidence:'Repeated team-based evidence across Redcliffe, investment society and part-time restaurant work.',improve:'Add one example where your contribution changed an outcome or helped the team perform better.'},{name:'Communication',score:70,evidence:'Presented an investment idea to 40 students and handled customer issues in a busy service environment.',improve:'Make the scale and outcome of the presentation/client-facing work clearer.'},{name:'Leadership',score:58,evidence:'Training three new members of staff is useful evidence, but there is no standout leadership example yet.',improve:'Promote a moment where you took ownership, influenced others or drove something forward.'},{name:'Resilience & reliability',score:78,evidence:'Part-time work alongside university is a strong signal of consistency and work ethic.',improve:'Keep it concise, but quantify hours or responsibility if it strengthens the story.'},{name:'Commercial judgement',score:62,evidence:'M&A research, luxury-sector work and investment-society activity create a credible base.',improve:'Move from describing markets to explaining why a deal, sector or valuation matters.'},{name:'Technical finance',score:59,evidence:'DCF, comparables, EBITDA and valuation multiples are present in the CV and test responses.',improve:'Build speed and confidence on EV/equity value, accounting links, margins and valuation maths.'}],priorityGaps:[{title:'Make Redcliffe do more work',visibleRisk:'The experience is stronger than the wording. “Helped” and “supported” make you sound more junior than the underlying exposure.'},{title:'Raise technical confidence',visibleRisk:'3/5 is not weak, but it is not safe enough for a competitive process.'},{title:'Sharpen the Barclays story',visibleRisk:'Redcliffe + LVMH + Women in Finance should combine into a clearer reason for IBD.'}],fullCycleCta:'Full Cycle turns the diagnosis into the actual rebuild.'},firm:'Barclays',div:'Investment Banking / IBD',uni:'University of Bristol',crs:'Economics and Finance',gr:'First Class (predicted)',fS:3,nS:3,cvText:'Redcliffe Partners — Corporate Finance Intern\n• Researched UK consumer and healthcare companies for potential acquisition opportunities.\n• Helped prepare company profiles and buyer lists for live and prospective mandates.\n• Analysed revenue growth, EBITDA margins and valuation multiples across comparable companies.\n• Supported preparation of presentation materials for senior bankers ahead of client meetings.\nLVMH Valuation Project\n• Built a basic DCF and comparable-company valuation for LVMH.\nPho House — Waitress\n• Trained three new members of staff.',profile:{name:'Amelia Chen'}};let data=null;try{const raw=sessionStorage.getItem('tdesk_r');if(raw)data=JSON.parse(raw)}catch(e){}if(!data||!data.result){data=sample;document.getElementById('demo').style.display='block'}const r=data.result||{},p=data.profile||{},dims=Array.isArray(r.dimensions)?r.dimensions:[],gaps=Array.isArray(r.priorityGaps)?r.priorityGaps:[],comps=Array.isArray(r.competencies)?r.competencies:[];const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const firm=data.firm||p.targetFirm||'your target bank';const cv=data.cvText||'';const lines=cv.split(/\n+/).map(x=>x.trim()).filter(Boolean);const bullet=lines.find(x=>/comparable|valuation|buyer|client|transaction|research|analysis|intern/i.test(x))||lines.find(x=>x.length>35)||'one of your strongest CV bullets';const strongest=dims.slice().sort((a,b)=>(b.score||0)-(a.score||0))[0]||{};const weakest=dims.slice().sort((a,b)=>(a.score||0)-(b.score||0))[0]||{};const num=Number(data.nS??data.quiz?.technicalCorrect??0);const comm=Number(data.fS??data.quiz?.commercialCorrect??0);document.getElementById('intro').innerHTML=`<strong>${esc(p.name||data.name||'Candidate')}</strong> · ${esc(data.uni||p.university||'')} · ${esc(firm)} ${esc(data.div||p.targetDivision||'')}`;document.getElementById('headline').textContent=(r.band||'').toLowerCase().includes('strong')?'This is a profile I would keep reading.':'You are credible. But this version is not ready yet.';const fallbackComps=[{name:'Analytical ability',score:Math.round((Number(strongest.score)||65)),evidence:strongest.visibleSummary||'There is some analytical evidence in the profile.',improve:'Make the analysis and outcome more explicit.'},{name:'Teamwork',score:65,evidence:'Team-based experience is present across work and activities.',improve:'Add one stronger example of contribution and outcome.'},{name:'Communication',score:64,evidence:'The CV contains some presentation or client-facing evidence.',improve:'Show scale, audience and outcome.'},{name:'Leadership',score:56,evidence:'Some ownership is visible, but leadership evidence is light.',improve:'Surface one example of taking responsibility for others or an outcome.'},{name:'Resilience & reliability',score:68,evidence:'Consistency across study, work and activities is a positive signal.',improve:'Quantify responsibility where helpful.'},{name:'Commercial judgement',score:Math.round((Number(dims.find(d=>/commercial/i.test(d.name))?.score)||60)),evidence:'Commercial interest is present.',improve:'Show judgement, not just interest.'},{name:'Technical finance',score:Math.round((Number(dims.find(d=>/technical/i.test(d.name))?.score)||58)),evidence:'Technical exposure exists in the profile and assessment.',improve:'Build speed and depth on the weak topics.'}];const cc=comps.length?comps:fallbackComps;const numCopy=num<=2?'Below where we would want it. More basic maths repetition is needed before applications.':num===3?'Workable, but not safe yet. More repetition on valuation maths, percentages and timed arithmetic would help.':'A relative strength. Maintain it while focusing effort elsewhere.';const commCopy=comm<=2?'Needs more structured reading and technical/commercial revision.':comm===3?'The base is there, but you need more depth and bank-specific thinking.':'A credible base; the next step is making answers more specific and interview-ready.';document.getElementById('app').innerHTML=`<section class="verdict"><div class="verdictTop"><div><div class="ey">Would I progress this?</div><div class="decision">${esc(r.killerSentence||r.diagnostic||'Your recruiter verdict will appear here.')}</div></div><div class="score"><strong>${esc(r.overallScore??'—')}/100</strong><span>${esc(r.band||'Assessment')}</span></div></div><div class="read">${esc(r.diagnostic||'')}</div></section><section class="section"><div class="ey">What stands out</div><h2>The three things I would notice first</h2><div class="signals"><div class="signal"><div class="ey">Strongest signal</div><strong>${esc(strongest.name||'Relevant evidence')}</strong><p>${esc(strongest.visibleSummary||'There is credible material here.')}</p></div><div class="signal"><div class="ey">Biggest risk</div><strong>${esc(weakest.name||gaps[0]?.title||'Positioning')}</strong><p>${esc(weakest.visibleSummary||gaps[0]?.visibleRisk||'The application still gives a recruiter reasons to hesitate.')}</p></div><div class="signal"><div class="ey">Fix first</div><strong>${esc(gaps[0]?.title||'Your strongest CV evidence')}</strong><p>${esc(gaps[0]?.visibleRisk||'Start with the evidence that should be carrying the application.')}</p></div></div></section><section class="section"><div class="ey">Competency assessment</div><h2>How your evidence currently scores</h2><div class="sectionLead">This is how the profile currently reads against the behaviours banks usually look for. Each score is based on evidence in the CV plus the assessment — not just keywords.</div><div class="competencies">${cc.map(c=>`<div class="comp"><div class="compHead"><h3>${esc(c.name)}</h3><div class="compScore">${esc(c.score??'—')}/100</div></div><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,Number(c.score)||0))}%"></div></div><div class="mini">What we saw</div><p>${esc(c.evidence||c.visibleReason||c.reason||'')}</p><div class="mini">What would improve it</div><p class="improve">${esc(c.improve||c.nextStep||'Add stronger, more specific evidence and quantify the outcome where possible.')}</p></div>`).join('')}</div></section><section class="section"><div class="ey">Assessment performance</div><h2>What your tests are telling us</h2><div class="tests"><div class="test"><div class="ey">Numerical</div><strong>${esc(num)}/5</strong><p>${esc(numCopy)}</p></div><div class="test"><div class="ey">Commercial / technical</div><strong>${esc(comm)}/5</strong><p>${esc(commCopy)}</p></div></div></section><section class="unlock"><div class="ey">What Full Cycle would work on</div><h2>We have identified the gaps. Full Cycle shows the rebuild.</h2><div class="preview"><div class="ey">CV rewrite preview</div><h3>We would work on this part of your CV</h3><p>“${esc(bullet.slice(0,190))}${bullet.length>190?'…':''}”</p><div class="lockline">Locked: exact rewrite + why it is stronger</div></div><div class="preview"><div class="ey">Numerical + technical plan</div><h3>Your practice plan is based on your result</h3><p>${esc(numCopy)} ${esc(commCopy)} Full Cycle routes you into the relevant maths drills, technical explainers and practice sequence.</p><div class="lockline">Locked: drills, topic list, explanations and practice order</div></div><div class="preview"><div class="ey">${esc(firm)} guide</div><h3>How this profile should be positioned for ${esc(firm)}</h3><p>We would use your strongest evidence and gaps to show which parts of the ${esc(firm)} guide matter most for your application, rather than giving you a generic bank overview.</p><div class="lockline">Locked: bank guide + profile-specific positioning</div></div><div class="cta"><div class="price">£79<small>Full Cycle</small></div><a class="btn" href="/fullcycle.html">Show me exactly what to fix →</a></div></section>`;</script></body></html>
