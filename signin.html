<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in | The Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/desk-app.css">
<script src="/desk-track.js" defer></script>
<style>.box{max-width:480px;margin:20px auto 0}</style>
</head>
<body>
<header class="top"><div class="top-in"><a class="logo" href="/">The <i>Desk</i></a></div></header>
<main>
  <div class="box">
    <div class="eyebrow">Your account</div>
    <h1 style="margin-top:8px" id="title">Sign in to The Desk</h1>
    <p class="lede" id="lede">Enter the email you use for your Desk account. We’ll email you a link that signs you in. No password needed.</p>
    <form class="card" id="form" style="margin-top:22px">
      <label class="field"><span class="label">Email</span><input type="email" id="email" autocomplete="email" required></label>
      <div class="row"><button class="btn or" id="send">Email me a sign-in link</button></div>
      <p class="mute" id="msg" role="status" style="font-size:15px;margin:12px 0 0"></p>
    </form>
    <p class="foot">Already signed in? Go to <a href="/my.html">My Desk</a>.</p>
  </div>
</main>
<script type="module">
const $ = s => document.querySelector(s);
const post = async body => { const r = await fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'Something went wrong. Try again.'); return d; };
const token = new URLSearchParams(location.search).get('token');
if (token) {
  // Arriving from the email link: sign this device in, then go to My Desk.
  $('#title').textContent = 'Signing you in…'; $('#lede').textContent = ''; $('#form').classList.add('hidden');
  history.replaceState(null, '', '/signin.html');
  try { await post({ action: 'verify', token }); location.replace('/my.html'); }
  catch (e) { $('#title').textContent = 'That link didn’t work'; $('#lede').textContent = e.message; $('#form').classList.remove('hidden'); }
}
$('#form').addEventListener('submit', async e => {
  e.preventDefault(); $('#send').disabled = true; $('#msg').textContent = 'Sending…';
  try { const d = await post({ action: 'request', email: $('#email').value }); $('#msg').textContent = d.message; }
  catch (err) { $('#msg').textContent = err.message; $('#send').disabled = false; }
});
</script>
</body>
</html>
