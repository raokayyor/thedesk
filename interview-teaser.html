<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>30-second interview check | The Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#11191e;--mute:#5f6b76;--paper:#f8f4ed;--card:#fffdfa;--accent:#ff5a14;--accent-ink:#c2410c;--line:#ddd7cf;--soft:#eee7dd;--warm:#fff7ed;--warm-line:#fed7aa;--ok:#15803d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "DM Sans",Arial,sans-serif}
a{color:var(--ink)}a:hover{color:var(--accent-ink)}
header.top{background:var(--card);border-bottom:1px solid var(--line)}.hin{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font:600 24px/1 "Fraunces",Georgia,serif;color:inherit;text-decoration:none}
main{max-width:760px;margin:0 auto;padding:28px 16px 80px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:"Fraunces",Georgia,serif;font-weight:500;line-height:1.2;margin:0}h1{font-size:clamp(26px,4vw,34px)}h2{font-size:22px}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.q{background:var(--ink);color:#fff;border-radius:16px;padding:24px}.q .kicker{color:#ffb38f}.q p{font:500 26px/1.25 Fraunces,Georgia,serif;margin:10px 0 0}
.btn{font:700 15px "DM Sans",Arial,sans-serif;border:1px solid var(--ink);border-radius:999px;padding:12px 20px;background:var(--ink);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:44px}
.btn.hot{background:var(--accent);border-color:var(--accent)}.btn.ghost{background:transparent;color:var(--ink)}.btn:disabled{opacity:.45;cursor:default}
.mute{color:var(--mute);font-size:14px}
.clock{font:500 56px/1 Fraunces,Georgia,serif;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0}
textarea{width:100%;font:inherit;font-size:15px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;min-height:120px}
.live{min-height:80px;font-size:15px;color:#3b4652;white-space:pre-wrap}
.score{display:flex;align-items:baseline;gap:14px}.score b{font:500 56px/1 Fraunces,Georgia,serif;color:var(--accent-ink)}
.lockbox{background:var(--warm);border:1px solid var(--warm-line);border-radius:16px;padding:22px}
.lockbox ul{margin:10px 0 0;padding-left:18px;font-size:14px;line-height:1.7;color:#3b4652}
</style>
<script src="/desk-nav.js" defer></script>
</head>
<body>
<header class="top"><div class="hin"><a class="logo" href="/">The Desk</a><a href="/my.html" style="font-weight:700;font-size:14px">My Desk</a></div></header>
<main id="app"><p class="mute">Loading…</p></main>
<script src="/interview-teaser-media.js"></script>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app'),LIMIT=30;

let Q='',firm='',role='',rec=null,finalText='',started=0,timer=null;
async function init(){
  const d=await fetch('/api/desk-home',{credentials:'same-origin'}).then(r=>r.ok?r.json():null).catch(()=>null);
  firm=d?.profile?.targetFirm||'';role=d?.profile?.targetDivision||d?.profile?.targetSector||'';
  if(d?.member){location.href='/interview-start.html';return}
  Q='Tell me about yourself, and why this career.';
  intro();
}
function intro(){
  app.innerHTML=`<div class="kicker">Free · 30-second interview check</div><h1>Answer one question. Get a straight read on it.</h1><div class="q"><div class="kicker">Your question</div><p>${esc(Q)}</p></div><section class="card" id="teaserMedia"></section>`;
  window.DeskTeaserMedia.mount(document.getElementById('teaserMedia'),Q,submit);
}
async function submit(text,secs){
  text=String(text||'').trim();
  if((text.match(/\S+/g)||[]).length<20){app.innerHTML=`<div class="card">We only caught ${text?'a few words':'silence'}. Answers need at least 20 words to mark. <a href="/interview-teaser.html">Try again</a></div>`;return}
  app.innerHTML='<p class="mute">Marking your answer…</p>';
  const r=await fetch('/api/interview-feedback',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:Q,transcript:text,seconds:secs,firm,role,kind:'teaser'})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){app.innerHTML=`<div class="card">${esc(d.error||'We couldn’t mark that answer. Try again.')}</div>${lock()}`;bindJoin();return}
  const f=d.feedback,s=f.strengths?.[0],x=f.fixes?.[0];
  app.innerHTML=`<div class="kicker">Your 30-second check</div>
  <div class="card"><div class="score"><b>${esc(f.overall)}</b><div><div style="font:500 22px/1.25 Fraunces,Georgia,serif">${esc(f.verdictTitle)}</div><div class="mute">out of 100, on your opening 30 seconds</div></div></div>
  ${f.verdict?`<p style="margin:14px 0 0">${esc(f.verdict)}</p>`:''}
  ${s?`<p style="margin:14px 0 0"><b style="color:var(--ok)">What worked:</b> ${esc(s.point)}${s.quote?` <span class="mute">(“${esc(s.quote)}”)</span>`:''}</p>`:''}
  ${x?`<p style="margin:8px 0 0"><b style="color:var(--accent-ink)">Fix first:</b> ${esc(x.fix)}${x.quote?` <span class="mute">You said: “${esc(x.quote)}”</span>`:''}</p>`:''}
  <p class="mute" style="margin:14px 0 0">Your answer: ${esc(text)}</p></div>${lock()}`;
  bindJoin();
}
function lock(){
  return `<div class="lockbox"><div class="kicker" style="color:#9a3412">Members get the full interview coach</div><h2 style="margin-top:6px">The interviewer would push back on that answer.</h2>
  <p style="margin:6px 0 0;font-size:14px;color:#3b4652">Members answer the follow-up, get marked on full two-minute answers and practise the questions their firms ask.</p>
  <ul><li>Full feedback on structure, evidence, relevance and delivery</li><li>The interviewer’s follow-up question, and feedback on your answer to it</li><li>Seven model answers built from your own CV</li><li>Up to 60 answers a day, HireVue-style timing</li><li>Notes from practitioners who’ve hired for banks</li></ul>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button class="btn hot" id="joinT">£89 for the whole year</button><a class="btn ghost" href="/fullcycle.html?sample=amelia">See a member’s report</a></div></div>`;
}
async function bindJoin(){
  const b=document.getElementById('joinT');if(!b)return;
  b.onclick=async()=>{const d=await fetch('/api/desk-home',{credentials:'same-origin'}).then(r=>r.json()).catch(()=>null);const id=d?.report?.assessmentId;if(!id){location.href='/assessment.html';return}
    const r=await fetch('/api/start-checkout',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({assessmentId:id})});const o=await r.json().catch(()=>({}));location.href=o.url||d.report.url};
}
init();
</script>
</body>
</html>
