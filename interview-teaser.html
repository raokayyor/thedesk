<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>30-second interview check | The Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#11191e;--mute:#5f6b76;--paper:#f8f4ed;--card:#fffdfa;--accent:#ff5a14;--accent-ink:#c2410c;--line:#ddd7cf;--soft:#eee7dd;--warm:#fff7ed;--warm-line:#fed7aa;--ok:#15803d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "DM Sans",Arial,sans-serif}
a{color:var(--ink)}a:hover{color:var(--accent-ink)}
header.top{background:var(--card);border-bottom:1px solid var(--line)}.hin{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font:600 24px/1 "Fraunces",Georgia,serif;color:inherit;text-decoration:none}
main{max-width:760px;margin:0 auto;padding:28px 16px 80px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:"Fraunces",Georgia,serif;font-weight:500;line-height:1.2;margin:0}h1{font-size:clamp(26px,4vw,34px)}h2{font-size:22px}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.q{background:var(--ink);color:#fff;border-radius:16px;padding:24px}.q .kicker{color:#ffb38f}.q p{font:500 26px/1.25 Fraunces,Georgia,serif;margin:10px 0 0}
.btn{font:700 15px "DM Sans",Arial,sans-serif;border:1px solid var(--ink);border-radius:999px;padding:12px 20px;background:var(--ink);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:44px}
.btn.hot{background:var(--accent);border-color:var(--accent)}.btn.ghost{background:transparent;color:var(--ink)}.btn:disabled{opacity:.45;cursor:default}
.mute{color:var(--mute);font-size:14px}
.clock{font:500 56px/1 Fraunces,Georgia,serif;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0}
textarea{width:100%;font:inherit;font-size:15px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;min-height:120px}
.live{min-height:80px;font-size:15px;color:#3b4652;white-space:pre-wrap}
.score{display:flex;align-items:baseline;gap:14px}.score b{font:500 56px/1 Fraunces,Georgia,serif;color:var(--accent-ink)}
.lockbox{background:var(--warm);border:1px solid var(--warm-line);border-radius:16px;padding:22px}
.lockbox ul{margin:10px 0 0;padding-left:18px;font-size:14px;line-height:1.7;color:#3b4652}
main{max-width:1120px}.trial-workspace{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}.trial-guidance{display:grid;gap:12px}.trial-guidance h2{font-size:21px;margin-top:6px}.trial-guidance p,.trial-guidance li{font-size:14px}.trial-guidance details{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.trial-guidance summary{cursor:pointer;font-weight:700;font-size:14px}@media(max-width:750px){.trial-workspace{grid-template-columns:1fr}}</style>
<script src="/desk-nav.js" defer></script>
</head>
<body>
<header class="top"><div class="hin"><a class="logo" href="/">The Desk</a><a href="/my.html" style="font-weight:700;font-size:14px">My Desk</a></div></header>
<main id="app"><p class="mute">Loading…</p></main>
<script src="/interview-teaser-transcript.js"></script><script src="/interview-teaser-media.js"></script>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app'),LIMIT=30;

let sampleStudent=null;let Q='',firm='',role='',rec=null,finalText='',started=0,timer=null;
async function init(){
  const d=await fetch('/api/desk-home',{credentials:'same-origin'}).then(r=>r.ok?r.json():null).catch(()=>null);
  sampleStudent=await fetch('/data/preview-student.json').then(r=>r.json());
  firm='Goldman Sachs';role='Investment Banking / IBD';
  Q='Tell me about yourself and which experience has prepared you for investment banking at Goldman Sachs.';
  intro();
}
function intro(){
  app.innerHTML=`<div class="kicker">Free · One-question interview preview</div><h1>See an interview answer, from CV to feedback.</h1><p class="mute">One question, Jamie’s preloaded CV and a worked assessment below. You can also record your own 30-second opening using the same tool.</p><p class="mute">Goldman Sachs · Investment banking · Question 1 of 1. Our independent practice question, not a confirmed employer question.</p><div class="q"><div class="kicker">Your question</div><p>${esc(Q)}</p></div><div class="trial-workspace"><section class="card" id="teaserMedia"></section><aside class="trial-guidance"><section class="card"><div class="kicker">What to demonstrate</div><h2>A clear opening, backed by evidence.</h2><ol><li>Introduce your studies in one sentence.</li><li>Choose one relevant experience and explain your own contribution.</li><li>Connect it to the work you want to do.</li></ol></section><section class="card"><div class="kicker">Sample CV loaded</div><h2>Jamie Patel · University of Bristol</h2><p class="mute">Second-year Economics student · Predicted 2:1 · Preparing for a first banking application. This sample has no banking internship or completed valuation project yet.</p><details><summary>View CV evidence</summary><p>Part-time café team member: balanced weekend shifts with studies and helped prioritise orders during busy periods.</p><p>Economics group project: compared UK retailers’ annual reports and presented a summary of revenue trends. The CV does not yet explain Jamie’s individual conclusion.</p></details><details><summary>See an example opening</summary><p>${esc(sampleStudent.opening)}</p><p class="mute">Illustrative wording from Jamie’s sample CV. Adapt it; do not claim this experience as your own.</p></details></section><section class="card"><img src="/assets/kayyor-rao.jpg" alt="Kayyor Rao" width="44" height="44" style="border-radius:50%;object-fit:cover"><div class="kicker">Practitioner preparation · Kayyor Rao</div><h2>Make your contribution visible.</h2><p>A modest example with a clear personal action is more useful than a grand claim. Explain what you compared or decided, and what you learned.</p><details><summary>Goldman Sachs preparation</summary><p>Research the division and its work. Connect your example to analysis, teamwork and client judgement; avoid a generic answer about prestige.</p><p class="mute">The Desk’s preparation guidance, not Goldman Sachs’ internal scoring criteria or a personal review of your answer.</p></details></section></aside></div><section class="card" id="sampleAssessment"><div class="kicker">Worked example · Jamie’s answer</div><h2>An answer — and what to improve.</h2><blockquote style="margin:18px 0;padding:16px;background:#f7f2ea;border-left:3px solid #ff5a14">“I’m a second-year Economics student at the University of Bristol, predicted a 2:1. In a group project I compared annual reports for three retailers and helped present revenue trends. Alongside my course, I work weekend shifts at Campus Café, prioritising orders and keeping customers informed during busy periods. I’m interested in investment banking because I want to develop my financial analysis and understand how businesses make funding decisions. I’d like to build those skills at Goldman Sachs.”</blockquote><div class="score"><b>58<span style="font-size:18px">/100</span></b><div><strong>A clear start, but the evidence needs depth.</strong><p class="mute">Illustrative assessment of the written example, prepared for this walkthrough. It is not a new model assessment or an assessment of your voice or video.</p></div></div><div class="trial-workspace"><div><h3>What worked</h3><ul><li>A concise introduction covering studies, experience and motivation.</li><li>Two genuine examples supported by Jamie’s sample CV.</li><li>A sensible connection between Economics and financial analysis.</li></ul><h3>Improve first</h3><ul><li>Explain Jamie’s own analytical contribution and conclusion in the retail project.</li><li>Add one researched reason for Goldman Sachs and the chosen division.</li><li>Show what was learned, rather than only listing tasks.</li></ul></div><div><h3>A stronger answer structure</h3><p>“I’m a second-year Economics student at Bristol, predicted a 2:1. In a retail analysis project, I compared [specific measures] and found [your supported conclusion]. My contribution was [your personal work]. Weekend café shifts have also taught me to prioritise competing demands and communicate clearly. I want to build on this through investment banking, and Goldman Sachs interests me because [your researched reason for this division].”</p><p class="mute">Brackets are missing facts to supply, not achievements to claim.</p><h3>The follow-up</h3><p><strong>What did you personally conclude from comparing those retailers, and how did the evidence support it?</strong></p></div></div><a class="btn hot" href="/signup.html?plan=member">Practise with my own CV — explore membership →</a></section>`;
  window.DeskTeaserMedia.mount(document.getElementById('teaserMedia'),Q,submit);
}
async function submit(text,secs){
  text=String(text||'').trim();
  if((text.match(/\S+/g)||[]).length<20){app.innerHTML=`<div class="card">We only caught ${text?'a few words':'silence'}. Answers need at least 20 words to mark. <a href="/interview-teaser.html">Try again</a></div>`;return}
  app.innerHTML='<p class="mute">Marking your answer…</p>';
  const r=await fetch('/api/interview-feedback',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:Q,transcript:text,seconds:secs,firm,role,cv:sampleStudent.cvText+' Assess the actual spoken answer; do not assume the speaker is Jamie or penalise different genuine experience.',kind:'teaser'})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){app.innerHTML=`<div class="card">${esc(d.error||'We couldn’t mark that answer. Try again.')}</div>${lock()}`;bindJoin();return}
  const f=d.feedback,s=f.strengths?.[0],x=f.fixes?.[0];
  app.innerHTML=`<div class="kicker">Your 30-second check</div>
  <div class="card"><div class="score"><b>${esc(f.overall)}</b><div><div style="font:500 22px/1.25 Fraunces,Georgia,serif">${esc(f.verdictTitle)}</div><div class="mute">out of 100, on your opening 30 seconds</div></div></div>
  <div class="feedback-preview" style="margin-top:16px"><p>${esc(f.verdict||'Focus on a clear introduction that answers the question.')}</p><p><b>What worked:</b> ${esc(s?.point||'No clear strength was evidenced in this short sample.')}</p><p><b>Improve first:</b> ${esc(x?.fix||'Connect your experience directly to your chosen career.')}</p></div>
  </div><section class="card" style="position:relative;overflow:hidden"><h2>Unlock your detailed feedback</h2><p class="mute">Structure, evidence, delivery, a stronger opening and your follow-up question. Available to members.</p><div aria-hidden="true" style="filter:blur(5px);user-select:none;pointer-events:none;opacity:.45"><p>Answer structure &nbsp; ▰▰▰▰▰▰▰▰▰▰▰▰</p><p>Your evidence &nbsp; ▰▰▰▰▰▰▰▰▰▰</p><p>A stronger opening &nbsp; ▰▰▰▰▰▰▰▰▰▰▰</p><p>Prepare for the follow-up &nbsp; ▰▰▰▰▰▰▰▰</p></div><p class="mute">Detailed feedback is locked with membership.</p></section>${lock()}`;
  bindJoin();
}
function lock(){
  return `<div class="lockbox"><div class="kicker" style="color:#9a3412">Members get the full interview coach</div><h2 style="margin-top:6px">The interviewer would push back on that answer.</h2>
  <p style="margin:6px 0 0;font-size:14px;color:#3b4652">Members get the detailed review, answer the follow-up and practise full two-minute answers for their chosen firm and role.</p>
  <ul><li>Full feedback on structure, evidence, relevance and delivery</li><li>The interviewer’s follow-up question, and feedback on your answer to it</li><li>Seven model answers built from your own CV</li><li>Up to 60 answers a day, HireVue-style timing</li><li>Notes from practitioners who’ve hired for banks</li></ul>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button class="btn hot" id="joinT">£89 for the whole year</button><a class="btn ghost" href="/fullcycle.html?sample=amelia">See a member’s report</a></div></div>`;
}
async function bindJoin(){
  const b=document.getElementById('joinT');if(!b)return;
  b.onclick=async()=>{const d=await fetch('/api/desk-home',{credentials:'same-origin'}).then(r=>r.json()).catch(()=>null);const id=d?.report?.assessmentId;if(!id){location.href='/assessment.html';return}
    const r=await fetch('/api/start-checkout',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({assessmentId:id})});const o=await r.json().catch(()=>({}));location.href=o.url||d.report.url};
}
init();
</script>
</body>
</html>
