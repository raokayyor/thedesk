<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preparing your Full Cycle report · Preview</title><link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/fullcycle-build-screen.css"></head><body class="fc-build-preview-body"><header><a href="/">The Desk</a></header><main id="buildingPreview"></main><script type="module">import {mountBuildScreen} from '/fullcycle-build-screen.mjs';const screen=mountBuildScreen(document.getElementById('buildingPreview'),{preview:true});const stages=[['evidence','Reviewing your CV and confirmed experience…'],['verdict','Building your application priorities…'],['repair','Preparing CV fixes and interview answers…'],['plan','Putting your preparation plan together…'],['cv','Assembling your CV…']];let index=0;screen.message(stages[0][1]);screen.stage(stages[0][0],'active');const timer=setInterval(()=>{screen.stage(stages[index][0],'done');index++;if(index===stages.length){clearInterval(timer);screen.finishPreview();return;}screen.stage(stages[index][0],'active');screen.message(stages[index][1]);},3500);</script></body></html>
