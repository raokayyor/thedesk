<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Practitioner review | The Desk</title><link rel="stylesheet" href="/programme-guides.css"><style>form{display:grid;gap:10px}input,select,textarea{padding:10px;border:1px solid #ccc}textarea{min-height:180px}article{padding:24px 0;border-top:1px solid #ccc}.staff-main{max-width:850px}.reply-note{font-size:13px}</style></head><body><main class="staff-main"><a class="logo" href="/">The Desk</a><h1>Practitioner question queue.</h1><p>Staff access. Write and approve replies here. Students view answers in their private question page. Email delivery is not connected.</p><form id="login"><label for="key">Staff access key</label><input id="key" type="password" autocomplete="off" required><button class="btn">Open the queue</button></form><p id="status" role="status"></p><div id="queue"></div></main><script type="module">let access;const status=document.getElementById('status');async function load(){const r=await fetch('/api/practitioner-review',{headers:{Authorization:'Bearer '+access}}),data=await r.json();if(!r.ok)throw Error(data.error||'Cannot load queue.');const queue=document.getElementById('queue');queue.replaceChildren();status.textContent=data.questions.length+' questions';for(const q of data.questions){const article=document.createElement('article'),h=document.createElement('h2'),meta=document.createElement('p');h.textContent=q.question;meta.textContent=q.email+' · Reply target '+new Date(q.dueAt).toLocaleString('en-GB',{timeZone:'Europe/London'});article.append(h,meta);const form=document.createElement('form'),select=document.createElement('select');for(const name of ['Rao','Peter Cheley','Neil Robertson','Jim Staples']){const option=document.createElement('option');option.textContent=name;select.append(option);}select.setAttribute('aria-label','Replying practitioner');if(q.practitioner)select.value=q.practitioner;const answer=document.createElement('textarea');answer.setAttribute('aria-label','Written reply');answer.minLength=40;answer.maxLength=6000;answer.required=true;answer.value=q.answer||'';const label=document.createElement('label'),publish=document.createElement('input');publish.type='checkbox';publish.disabled=!q.publishConsent;label.append(publish,document.createTextNode(q.publishConsent?' Publish anonymously (student consent given)':' Student has not consented to publication'));const button=document.createElement('button');button.className='btn';button.textContent='Approve and save written reply';form.append(select,answer,label,button);form.onsubmit=async e=>{e.preventDefault();button.disabled=true;try{const r=await fetch('/api/practitioner-review',{method:'POST',headers:{Authorization:'Bearer '+access,'Content-Type':'application/json'},body:JSON.stringify({id:q.id,answer:answer.value,practitioner:select.value,publish:publish.checked})}),data=await r.json();if(!r.ok)throw Error(data.error||'Could not save reply.');status.textContent='Reply saved. Notify the student with their private question link. An email has not been sent.';}catch(e){status.textContent=e.message;}finally{button.disabled=false;}};article.append(form);queue.append(article);}}document.getElementById('login').onsubmit=async e=>{e.preventDefault();access=document.getElementById('key').value;document.getElementById('key').value='';try{await load();}catch(e){status.textContent=e.message;}};</script></body></html>
