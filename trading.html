<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading game | The Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#11191e;--mute:#5f6b76;--paper:#f8f4ed;--card:#fffdfa;--accent:#ff5a14;--accent-ink:#c2410c;--line:#ddd7cf;--soft:#eee7dd;--warm:#fff7ed;--warm-line:#fed7aa;--ok:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "DM Sans",Arial,sans-serif}
a{color:var(--ink)}a:hover{color:var(--accent-ink)}
header.top{background:var(--card);border-bottom:1px solid var(--line)}.hin{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font:600 24px/1 "Fraunces",Georgia,serif;color:inherit;text-decoration:none}
main{max-width:1200px;margin:0 auto;padding:24px 16px 80px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:500;line-height:1.2;margin:0}h1{font-size:clamp(26px,4vw,36px)}h2{font-size:22px}h3{font-size:18px}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.btn{font:700 14px "DM Sans",Arial,sans-serif;border:1px solid var(--ink);border-radius:999px;padding:10px 16px;background:var(--ink);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:40px}
.btn.hot{background:var(--accent);border-color:var(--accent)}.btn.ghost{background:transparent;color:var(--ink)}.btn.sm{min-height:34px;padding:6px 12px;font-size:13px}.btn:disabled{opacity:.4;cursor:default}
.mute{color:var(--mute);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px}.stat b{display:block;font:500 28px/1.1 Fraunces,Georgia,serif;color:#ff8a52}.stat span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#cfd6db;font-weight:700}
.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}.layout>*{min-width:0}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:11px;letter-spacing:.08em;color:var(--mute);padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:8px 6px;border-bottom:1px solid var(--soft);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--ok);font-weight:700}.down{color:var(--bad);font-weight:700}
.scroll{overflow-x:auto}
.trade{display:flex;gap:6px;align-items:center;justify-content:flex-end}.trade input{width:72px;font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;text-align:right}
.news{border-top:1px solid var(--soft);padding:12px 0}.news:first-of-type{border-top:0;padding-top:4px}
.why{display:flex;gap:8px;margin-top:8px;font-size:14px;background:var(--warm);border:1px solid var(--warm-line);border-radius:10px;padding:10px 12px}
.av{width:26px;height:26px;border-radius:50%;background:#dbe5f1;color:#123459;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips span{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;background:#fff}
.lockbox{background:var(--warm);border:1px solid var(--warm-line);border-radius:16px;padding:20px}
input.t{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.filters input{flex:2;min-width:200px;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.filters select{flex:1;min-width:180px;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.ticket td{background:#fff7ed;border-bottom:2px solid var(--accent)}
.tk{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;padding:8px 4px}
.tk .tabs{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden}.tk .tabs button{border:0;background:#fff;padding:7px 16px;font:700 13px 'DM Sans',Arial,sans-serif;cursor:pointer}.tk .tabs button.on{background:var(--ink);color:#fff}
.tk .mode{display:flex;gap:12px;font-size:13px;margin:10px 0 6px}.tk input[type=number]{width:100%;font:inherit;font-size:18px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-align:right;background:#fff}
.tk .quick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.tk .quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font:600 12px 'DM Sans',Arial,sans-serif;cursor:pointer}
.tk .sum{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}.tk .sum div{display:flex;justify-content:space-between;padding:3px 0}.tk .sum .big{font-weight:700;font-size:16px;border-top:1px solid var(--soft);margin-top:4px;padding-top:7px}
.tk .err{color:var(--bad);font-weight:700;font-size:13px;margin-top:8px;min-height:18px}
.tk .stop{margin-top:10px;font-size:13px}.tk .stop input[type=number]{font-size:14px;padding:6px 8px;width:80px;display:inline-block}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--ink);text-decoration:underline;cursor:pointer}
@media(max-width:760px){.tk{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:50}
tr.you td{background:var(--warm);font-weight:700}
@media(max-width:960px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.hide-sm{display:none}}
</style>
<script src="/desk-nav.js" defer></script>
</head>
<body>
<header class="top"><div class="hin"><a class="logo" href="/">The Desk</a><a href="/my.html" style="font-weight:700;font-size:14px">My Desk</a></div></header>
<main id="app"><p class="mute">Loading the market…</p></main>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app');
const lvl=(x,dp)=>Number(x).toLocaleString('en-GB',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const qty=x=>Number(x).toLocaleString('en-GB',{maximumFractionDigits:Math.abs(x)>=1?2:5});
const gbp=(x,dp=0)=>'£'+Number(x).toLocaleString('en-GB',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const pct=x=>`<span class="${x>0?'up':x<0?'down':''}">${x>0?'+':''}${Number(x).toFixed(2)}%</span>`;
const initials=n=>String(n||'').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
let G=null,P=null,showOld=false;const F={q:'',s:'all'};let SECTS=[];
function spark(h){if(!h||h.length<2)return '';const v=h.map(x=>+x[1]),mn=Math.min(...v),mx=Math.max(...v),w=70,ht=22;const pts=v.map((y,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(ht-(mx===mn?ht/2:(y-mn)/(mx-mn)*ht)).toFixed(1)}`).join(' ');const c=v[v.length-1]>=v[0]?'#15803d':'#b91c1c';return `<svg width="${w}" height="${ht}" viewBox="0 0 ${w} ${ht}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.6"/></svg>`}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
async function load(){
  const [g,d]=await Promise.all([fetch('/api/game',{credentials:'same-origin'}).then(async r=>r.status===402?{locked:true}:r.ok?r.json():null).catch(()=>null),fetch('/api/desk-home',{credentials:'same-origin'}).then(r=>r.ok?r.json():null).catch(()=>null)]);
  if(g?.locked){app.innerHTML='<section class="lockbox"><div class="kicker">Members only</div><h1>Trading game</h1><p>Trade with £100,000 of virtual cash, react to market news and join the league with Full Cycle membership.</p><a class="btn hot" href="/my.html">See membership in My Desk</a> <a class="btn ghost" href="/signin.html">Already a member? Sign in</a></section>';return;}
  if(!g){app.innerHTML='<div class="card">We couldn’t load the market. Refresh to try again.</div>';return}
  G=g;P=d?.profile||{};SECTS=[...new Set((g.prices||[]).filter(p=>p.region).map(p=>p.sector))].sort();render();
}
function newsBlock(){
  if(!G.news.length)return `<div class="card"><div class="kicker">Market news</div><p class="mute" style="margin:6px 0 0">No news yet. Prices move when the day’s news is published.</p></div>`;
  const today=G.news.filter(n=>n.day===G.game.day),older=G.news.filter(n=>n.day!==G.game.day);
  const item=n=>`<div class="news"><div class="mute">Day ${n.day}</div><b style="font-size:16px">${esc(n.headline)}</b>${n.body?`<p style="margin:4px 0 0">${esc(n.body)}</p>`:''}
    ${n.why?`<div class="why"><span class="av" aria-hidden="true">${esc(initials(n.practitioner)||'TD')}</span><span><b>${n.practitioner?'Why it moved · '+esc(n.practitioner):'Why it moved'}:</b> ${esc(n.why)}</span></div>`:''}
    <div class="chips">${n.effects.bankRate?`<span>Bank Rate ${n.effects.bankRate>0?"+":""}${n.effects.bankRate.toFixed(2)}</span>`:''}${n.effects.market?`<span>Market ${pct(n.effects.market)}</span>`:''}${Object.entries(n.effects.sectors||{}).map(([s,v])=>`<span>${esc(s)} ${pct(v)}</span>`).join('')}${Object.entries(n.effects.stocks||{}).map(([s,v])=>`<span>${esc(s)} ${pct(v)}</span>`).join('')}</div></div>`;
  return `<div class="card"><div class="kicker">Today’s news · Day ${G.game.day}</div>${today.map(item).join('')||'<p class="mute">No news today.</p>'}
    ${older.length?`<button class="btn ghost sm" id="old" style="margin-top:10px">${showOld?'Hide':'Show'} earlier news (${older.length})</button>${showOld?older.map(item).join(''):''}`:''}</div>`;
}
function marketBlock(){
  const me=G.me,canTrade=!!me;
  const byS={};G.prices.forEach(p=>{const k=p.region?(p.region==='UK'?'UK · ':'US · ')+p.sector:p.sector;(byS[k]=byS[k]||[]).push(p)});
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><h2>Market</h2><span class="mute">${G.prices.length} investments: about 110 UK and US shares, indices, crypto, oil, gold, copper, currencies and gilts · simulated prices</span></div>
  <div class="filters"><input type="search" id="fq" placeholder="Search, e.g. Shell, Nvidia, gold" aria-label="Search the market" value="${esc(F.q)}"><select id="fs" aria-label="Show">${[['all','Everything'],['mine','My investments'],['markets','Markets, crypto, commodities, currencies'],['UK','UK shares (FTSE 100)'],['US','US shares'],...SECTS.map(x=>['s:'+x,x])].map(([v,l])=>`<option value="${esc(v)}" ${F.s===v?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
  <div class="scroll" style="margin-top:8px"><table id="mkt"><thead><tr><th>ASSET</th><th class="num">SELL<br><span style="font-weight:500">bid</span></th><th class="num">BUY<br><span style="font-weight:500">offer</span></th><th class="num">TODAY</th><th class="num hide-sm">SINCE START</th><th class="hide-sm">TREND</th><th class="num">YOU HOLD</th>${canTrade?'<th class="num">TRADE</th>':''}</tr></thead><tbody>
  ${Object.entries(byS).map(([s,list])=>`<tr data-head="${esc(s)}"><td colspan="8" class="mute" style="font-weight:700;padding-top:14px">${esc(s)}</td></tr>`+list.map(p=>{const held=me?.positions?.[p.ticker]||0;return `<tr data-row data-grp="${esc(s)}" data-region="${esc(p.region||'')}" data-sector="${esc(p.sector)}" data-held="${held?1:0}" data-text="${esc((p.name+' '+p.ticker+' '+p.sector+' '+(p.hint||'')).toLowerCase())}"><td><b>${esc(p.name)}</b>${p.hint?`<div class="mute">${esc(p.hint)}</div>`:''}</td><td class="num">${lvl(p.bid,p.dp)}</td><td class="num"><b>${lvl(p.offer,p.dp)}</b></td><td class="num">${pct(p.change)}</td><td class="num hide-sm">${pct((p.price/p.start-1)*100)}</td><td class="hide-sm">${spark(p.history)}</td><td class="num">${held?qty(held):'—'}</td>
    ${canTrade?`<td><div class="trade"><button class="btn sm" data-buy="${esc(p.ticker)}">Buy</button><button class="btn ghost sm" data-sell="${esc(p.ticker)}" ${held?'':'disabled'}>Sell</button></div></td>`:''}</tr>`}).join('')).join('')}
  </tbody></table></div>${canTrade?'<p class="mute" style="margin:10px 0 0">You buy at the offer and sell at the bid, like a real broker; the gap (spread) is the cost of trading. Cash earns the Bank Rate on every news day. Press Buy or Sell to open a trade ticket: it shows the cost and your cash before you confirm. Part-units are fine (e.g. 0.25 Bitcoin). For the game every price counts as pounds. Prices only move when the day’s news is published, so take your time.</p>':''}</div>`;
}
function sideBlock(){
  const me=G.me;let h='';
  if(me){
    const pos=Object.entries(me.positions||{}).map(([t,q])=>{const p=G.prices.find(x=>x.ticker===t);return {t,q,v:q*(p?.bid??p?.price??0),p}}).sort((a,b)=>b.v-a.v);
    h+=`<div class="card"><h3>Your holdings</h3>${pos.length?`<div class="scroll"><table style="margin-top:6px"><thead><tr><th>ASSET</th><th class="num">UNITS</th><th class="num">PAID (AVG)</th><th class="num">VALUE</th><th class="num">PROFIT/LOSS</th><th class="num">STOP</th></tr></thead><tbody>${pos.map(x=>{const cost=Number(me.costs?.[x.t]||0),avg=x.q?cost/x.q:0,pl=x.v-cost;return `<tr><td><b>${esc(x.p?.name||x.t)}</b><div class="mute">sell now at ${lvl(x.p?.bid??0,x.p?.dp??2)}</div></td><td class="num">${qty(x.q)}</td><td class="num">${cost?lvl(avg,x.p?.dp??2):'—'}</td><td class="num">${gbp(x.v)}</td><td class="num">${cost?pct2(pl,cost):'—'}</td><td class="num"><button class="linkbtn" data-stopedit="${esc(x.t)}">${me.stops?.[x.t]?lvl(me.stops[x.t],x.p?.dp??2):'Set'}</button></td></tr>`}).join('')}<tr><td>Cash<div class="mute">earns ${G.game.cashRate.toFixed(2)}% a year</div></td><td></td><td></td><td class="num">${gbp(me.cash)}</td><td class="num">${me.interest?`<span class="up">+${gbp(me.interest,2)}</span><div class="mute">interest</div>`:''}</td><td></td></tr></tbody></table></div>`:'<p class="mute">All cash. Press Buy on anything in the market.</p>'}</div>`;
    if(me.trades.length)h+=`<div class="card"><h3>Your recent trades</h3><table style="margin-top:6px"><tbody>${me.trades.slice(0,8).map(t=>`<tr><td class="mute">Day ${t.day}</td><td>${t.side==='buy'?'Bought':t.side==='stop'?'<span class="down">Stop loss sold</span>':'Sold'} ${qty(t.shares)} <b>${esc((G.prices.find(p=>p.ticker===t.ticker)||{}).name||t.ticker)}</b></td><td class="num">${lvl(t.price,(G.prices.find(p=>p.ticker===t.ticker)||{}).dp??2)}</td></tr>`).join('')}</tbody></table></div>`;
  }
  if(G.league.length)h+=`<div class="card"><h3>League</h3><p class="mute" style="margin:2px 0 8px">${G.players} player${G.players===1?'':'s'}</p><table><thead><tr><th>#</th><th>STUDENT</th><th class="num">RETURN</th></tr></thead><tbody>${G.league.map(r=>`<tr class="${r.you?'you':''}"><td>${r.rank}</td><td>${esc(r.name)}</td><td class="num">${pct(r.returnPct)}</td></tr>`).join('')}</tbody></table>${me&&me.rank>10?`<p style="margin:8px 0 0">You’re ${me.rank} of ${me.players}.</p>`:''}</div>`;
  return h;
}
function render(){
  if(!G.game){app.innerHTML=`<div class="kicker">Trading game</div><h1>The market opens soon.</h1><div class="card">No game is running right now. Check back shortly.</div>`;return}
  const me=G.me;let h=`<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"><div><div class="kicker">Trading game · Day ${G.game.day}</div><h1>${esc(G.game.name)}</h1></div><span class="mute">Real markets, simulated prices: they move with the news we publish, not live markets. Virtual money; practice, not advice.</span></div>`;
  if(me){const ret=(me.value/G.startingCash-1)*100;h+=`<div class="stats"><div class="stat"><b>${gbp(me.value)}</b><span>Portfolio value</span></div><div class="stat"><b>${ret>0?'+':''}${ret.toFixed(2)}%</b><span>Return</span></div><div class="stat"><b>${gbp(me.cash)}</b><span>Cash · earns ${G.game.cashRate.toFixed(2)}% · ${Object.keys(me.positions||{}).length} of ${G.maxHoldings} investments</span></div><div class="stat"><b>${me.rank} / ${me.players}</b><span>League position</span></div></div>`}
  else h+=`<form class="card" id="join" style="display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end"><div><div class="kicker">Join the game</div><p style="margin:4px 0 8px">You start with ${gbp(G.startingCash)} of virtual cash to spread across up to ${G.maxHoldings} investments.</p><label class="mute" for="dn">Name on the league</label><input class="t" id="dn" maxlength="40" value="${esc((P.name||'').split(' ')[0]+(P.name&&P.name.split(' ')[1]?' '+P.name.split(' ')[1][0]+'.':''))}"></div><div><label class="mute" for="uni">University (optional)</label><input class="t" id="uni" maxlength="60" value="${esc(P.university||'')}"></div><button class="btn hot">Start with ${gbp(G.startingCash)}</button></form>`;
  h+=`<div class="layout"><div style="display:flex;flex-direction:column;gap:16px">${newsBlock()}${marketBlock()}</div><div style="display:flex;flex-direction:column;gap:16px">${sideBlock()}</div></div>`;
  app.innerHTML=h;bind();
}
function applyFilter(){
  const q=F.q.trim().toLowerCase();
  document.querySelectorAll('#mkt tr[data-row]').forEach(tr=>{const d=tr.dataset;let ok=!q||d.text.includes(q);
    if(F.s==='mine')ok=ok&&d.held==='1';else if(F.s==='markets')ok=ok&&!d.region;else if(F.s==='UK'||F.s==='US')ok=ok&&d.region===F.s;else if(F.s.startsWith('s:'))ok=ok&&d.sector===F.s.slice(2);
    tr.hidden=!ok});
  document.querySelectorAll('#mkt tr[data-head]').forEach(h=>{h.hidden=![...document.querySelectorAll(`#mkt tr[data-row][data-grp="${CSS.escape(h.dataset.head)}"]`)].some(r=>!r.hidden)});
}
// ---------- trade ticket ----------
// The form is drawn once when the ticket opens; typing only updates the summary, so the cursor never jumps.
let TK=null;
async function openTicket(t,side,focusStop){
  document.querySelectorAll('tr.ticket').forEach(r=>r.remove());
  const row=document.querySelector(`#mkt tr[data-row] [data-buy="${CSS.escape(t)}"]`)?.closest('tr');if(!row)return;
  TK={t,side,mode:'gbp',stopOn:!!G.me.stops?.[t],stopPct:10,fresh:false};
  const tr=document.createElement('tr');tr.className='ticket';tr.innerHTML=`<td colspan="8"></td>`;row.after(tr);drawTicket(focusStop);
  tr.scrollIntoView({block:'nearest',behavior:'smooth'});
  // Load the latest price (it may have moved with news since this page loaded).
  try{const r=await fetch('/api/game?view=quote&ticker='+encodeURIComponent(t),{credentials:'same-origin'});const d=await r.json();const p=G.prices.find(x=>x.ticker===t);
    if(r.ok&&p&&TK&&TK.t===t){const moved=d.price!==p.price;p.price=d.price;p.bid=d.bid;p.offer=d.offer;TK.fresh=true;if(moved)toast('Price updated to the latest: '+lvl(d.price,p.dp));updateTicket()}}catch(e){}
}
function ticketCalc(){
  const td=document.querySelector('tr.ticket td');const p=G.prices.find(x=>x.ticker===TK.t),me=G.me,held=Number(me.positions?.[TK.t]||0);
  const raw=td?.querySelector('[data-k=val]')?.value||'';const v=parseFloat(raw.replace(/,/g,''))||0;
  const px=TK.side==='buy'?p.offer:p.bid;const units=TK.mode==='units'?v:(px?v/px:0),u=Math.floor(units*1e6+1e-7)/1e6,cost=Math.round(u*px*100)/100,spreadCost=Math.round(u*(p.offer-p.bid)/2*100)/100;
  const nHeld=Object.keys(me.positions||{}).length;let err='';
  if(v<0)err='Enter a positive amount.';
  else if(TK.side==='buy'){if(u>0&&cost>me.cash+0.005)err=`Not enough cash: this costs ${gbp(cost,2)} and you have ${gbp(me.cash,2)}.`;else if(u>0&&!held&&nHeld>=G.maxHoldings)err=`You already hold ${G.maxHoldings} investments. Sell one first.`}
  else if(u>held+1e-9)err=`You only hold ${qty(held)} units (worth ${gbp(held*p.bid,2)}).`;
  const stopPrice=TK.side==='buy'&&TK.stopOn?Math.round(p.bid*(1-TK.stopPct/100)*100)/100:null;
  return {p,px,spreadCost,held,u,cost,err,stopPrice,cashAfter:TK.side==='buy'?me.cash-cost:me.cash+cost};
}
function drawTicket(focusStop){
  const td=document.querySelector('tr.ticket td');if(!td)return;const p=G.prices.find(x=>x.ticker===TK.t),me=G.me,buy=TK.side==='buy',held=Number(me.positions?.[TK.t]||0),curStop=me.stops?.[TK.t];
  td.innerHTML=`<div class="tk"><div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div class="tabs" role="tablist"><button data-side="buy" class="${buy?'on':''}" aria-pressed="${buy}">Buy</button><button data-side="sell" class="${buy?'':'on'}" aria-pressed="${!buy}" ${held?'':'disabled title="You don’t hold any yet"'}>Sell</button></div><b data-k="title"></b><button class="linkbtn" data-k="close">Close</button></div>
    <div class="mode"><label><input type="radio" name="tkm" value="gbp" ${TK.mode==='gbp'?'checked':''}> Amount in £</label><label><input type="radio" name="tkm" value="units" ${TK.mode==='units'?'checked':''}> Units</label></div>
    <input type="text" inputmode="decimal" autocomplete="off" data-k="val" placeholder="${TK.mode==='units'?'How many units, e.g. 10':'How much in £, e.g. 5000'}" aria-label="${TK.mode==='units'?'Units':'Amount in pounds'}">
    <div class="quick">${buy?[[0.1,'10% of cash'],[0.25,'25%'],[0.5,'50%'],[1,'All my cash']].map(([f,l])=>`<button data-fill="${f}">${l}</button>`).join(''):[[0.25,'Quarter'],[0.5,'Half'],[1,'All']].map(([f,l])=>`<button data-fill="${f}">${l}</button>`).join('')}</div>
    ${buy?`<div class="stop"><label><input type="checkbox" data-k="stopon" ${TK.stopOn?'checked':''}> Add a stop loss: sell automatically if it falls</label> <input type="number" min="1" max="90" step="1" data-k="stoppct" value="${TK.stopPct}" aria-label="Stop loss percent below the price">% below <span data-k="stopat"></span></div>`
      :`<div class="stop">Stop loss on your holding: ${curStop?`<b>${lvl(curStop,p.dp)}</b>`:'none'} · set at <input type="number" step="any" data-k="stopv" value="${curStop||''}" placeholder="${lvl(p.bid*0.9,p.dp).replace(/,/g,'')}" aria-label="Stop loss price"> <button class="btn ghost sm" data-k="stopset">${curStop?'Update':'Set'}</button>${curStop?` <button class="linkbtn" data-k="stopclear">Remove</button>`:''}</div>`}
  </div><div>
    <div class="sum" data-k="sum"></div><div class="err" role="status" data-k="err"></div>
    <button class="btn ${buy?'hot':''}" data-k="go" style="width:100%"></button>
  </div></div>`;
  bindTicket();updateTicket();
  const f=td.querySelector(focusStop?'[data-k=stopv]':'[data-k=val]');if(f)f.focus();
}
function updateTicket(){
  const td=document.querySelector('tr.ticket td');if(!td||!TK)return;const c=ticketCalc(),p=c.p,me=G.me,buy=TK.side==='buy';const q=k=>td.querySelector(`[data-k="${k}"]`);
  const avg=c.held&&me.costs?.[TK.t]?me.costs[TK.t]/c.held:null;
  q('title').textContent=`${p.name} · ${lvl(p.bid,p.dp)} / ${lvl(p.offer,p.dp)}${TK.fresh?' (latest)':''}`;
  q('sum').innerHTML=`<div><span>${buy?'You buy at the offer':'You sell at the bid'}</span><span><b>${lvl(c.px,p.dp)}</b></span></div><div class="mute" style="font-size:12px"><span>Bid ${lvl(p.bid,p.dp)} · offer ${lvl(p.offer,p.dp)} · spread ${p.spreadPct}%</span><span>${c.u?'spread costs you ≈ '+gbp(c.spreadCost,2):''}</span></div><div><span>Units</span><span>${qty(c.u)}</span></div>
    <div class="big"><span>${buy?'Cost':'You receive'}</span><span>${gbp(c.cost,2)}</span></div>
    <div><span>Cash now</span><span>${gbp(me.cash,2)}</span></div><div><span>Cash after</span><span class="${c.cashAfter<0?'down':''}">${gbp(c.cashAfter,2)}</span></div>
    <div><span>You’ll hold</span><span>${qty(buy?c.held+c.u:Math.max(0,c.held-c.u))} units</span></div>
    ${!buy&&avg?`<div><span>Profit/loss on this sale</span><span>${pct2(c.u*(c.px-avg),c.u*avg)}</span></div>`:''}`;
  q('err').textContent=c.err;
  const go=q('go');go.disabled=!c.u||!!c.err;go.textContent=c.u?`${buy?'Buy':'Sell'} ${qty(c.u)} for ${gbp(c.cost,2)}`:(buy?'Enter an amount to buy':'Enter an amount to sell');
  if(q('stopat'))q('stopat').innerHTML=TK.stopOn?`the price · at <b>${lvl(c.stopPrice,p.dp)}</b>`:'the price';
}
const pct2=(pl,base)=>`<span class="${pl>=0?'up':'down'}">${pl>=0?'+':'−'}${gbp(Math.abs(pl),2)}${base?` (${pl>=0?'+':'−'}${Math.abs(pl/base*100).toFixed(1)}%)`:''}</span>`;
function bindTicket(){
  const td=document.querySelector('tr.ticket td');const q=k=>td.querySelector(`[data-k="${k}"]`);
  td.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{if(b.disabled)return;TK.side=b.dataset.side;drawTicket()});
  td.querySelectorAll('input[name=tkm]').forEach(r=>r.onchange=()=>{TK.mode=r.value;drawTicket()});
  q('val').addEventListener('input',e=>{const c=e.target.value.replace(/[^0-9.,]/g,'');if(c!==e.target.value)e.target.value=c;updateTicket()});
  q('val').addEventListener('keydown',e=>{if(e.key==='Enter'&&!q('go').disabled)q('go').click()});
  td.querySelectorAll('[data-fill]').forEach(b=>b.onclick=()=>{const f=+b.dataset.fill,p=G.prices.find(x=>x.ticker===TK.t);let v;
    if(TK.side==='buy'){const amt=Math.floor(G.me.cash*f*100)/100;v=TK.mode==='gbp'?amt:Math.floor(amt/p.offer*1e6)/1e6}
    else{const h=Number(G.me.positions?.[TK.t]||0)*f;v=TK.mode==='units'?Math.floor(h*1e6)/1e6:Math.floor(h*p.bid*100)/100}
    q('val').value=String(v);updateTicket()});
  q('close').onclick=()=>{document.querySelectorAll('tr.ticket').forEach(r=>r.remove());TK=null};
  if(q('stopon')){q('stopon').onchange=e=>{TK.stopOn=e.target.checked;updateTicket()};q('stoppct').oninput=e=>{TK.stopPct=Math.max(1,Math.min(90,parseFloat(e.target.value)||10));updateTicket()}}
  if(q('stopset'))q('stopset').onclick=async()=>{const r=await post({action:'stop',ticker:TK.t,stopPrice:parseFloat(q('stopv').value)});if(r.ok){G.me={...G.me,...r.data.account};toast('Stop loss saved.');const t=TK.t;render();openTicket(t,'sell')}else toast(r.data.error||'Could not set that.')};
  if(q('stopclear'))q('stopclear').onclick=async()=>{const r=await post({action:'stop',ticker:TK.t,stopPrice:null});if(r.ok){G.me={...G.me,...r.data.account};toast('Stop loss removed.');const t=TK.t;render();openTicket(t,'sell')}};
  q('go').onclick=async()=>{const c=ticketCalc();if(!c.u||c.err)return;q('go').disabled=true;q('go').textContent='Placing your trade…';
    const r=await post({action:'trade',ticker:TK.t,side:TK.side,shares:c.u,stopPrice:c.stopPrice});
    if(!r.ok){toast(r.data.error||'Trade failed.');updateTicket();return}
    const a=r.data.account,map=Object.fromEntries(G.prices.map(x=>[x.ticker,x.bid]));
    G.me={...G.me,...a,value:a.cash+Object.entries(a.positions).reduce((s,[k,v])=>s+v*(map[k]||0),0),trades:[{day:G.game.day,ticker:TK.t,side:TK.side,shares:c.u,price:r.data.price},...(G.me.trades||[])]};
    toast(`${TK.side==='buy'?'Bought':'Sold'} ${qty(c.u)} ${c.p.name} at ${lvl(r.data.price,c.p.dp)} for ${gbp(r.data.cost,2)}${c.stopPrice?` · stop loss at ${lvl(c.stopPrice,c.p.dp)}`:''}`);
    TK=null;render();load()};
}
function bind(){
  const fq=document.getElementById('fq'),fs=document.getElementById('fs');
  if(fq){fq.oninput=()=>{F.q=fq.value;applyFilter()};fs.onchange=()=>{F.s=fs.value;applyFilter()};applyFilter()}
  const o=document.getElementById('old');if(o)o.onclick=()=>{showOld=!showOld;render()};
  const j=document.getElementById('join');if(j)j.onsubmit=async e=>{e.preventDefault();const r=await post({action:'join',displayName:document.getElementById('dn').value,university:document.getElementById('uni').value});if(r.ok){toast('You’re in. £100,000 to invest.');load()}else toast(r.data.error||'Could not join.')};
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>openTicket(b.dataset.buy,'buy'));
  document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>openTicket(b.dataset.sell,'sell'));
  document.querySelectorAll('[data-stopedit]').forEach(b=>b.onclick=()=>{F.q='';F.s='mine';const fs=document.getElementById('fs');if(fs){fs.value='mine';document.getElementById('fq').value='';applyFilter()}openTicket(b.dataset.stopedit,'sell',true)});
}
const post=b=>fetch('/api/game',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(async r=>({ok:r.ok,data:await r.json().catch(()=>({}))}));
load();
</script>
</body>
