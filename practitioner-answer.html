<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your practitioner answer | The Desk</title><link rel="stylesheet" href="/programme-guides.css"></head><body><main><a class="logo" href="/">The Desk</a><section class="hero"><div class="kicker">Your practitioner question</div><h1>Your question. Your written reply.</h1><p id="status" role="status">Loading your question…</p><div id="answer"></div><a href="/deutsche-bank.html#ask-practitioner">Back to the DB guide →</a></section></main><script type="module">const status=document.getElementById('status');try{const id=new URLSearchParams(location.search).get('id'),r=await fetch('/api/practitioner-questions?id='+encodeURIComponent(id||'')),data=await r.json();if(!r.ok)throw Error(data.error||'Question unavailable.');const q=data.question,box=document.getElementById('answer'),title=document.createElement('h2'),text=document.createElement('p');title.textContent=q.question;box.append(title);if(q.answer){text.textContent=q.answer;text.style.whiteSpace='pre-wrap';box.append(text);status.textContent='Answered by '+q.practitioner+' · '+new Date(q.answeredAt).toLocaleString('en-GB',{timeZone:'Europe/London'});}else status.textContent='In the practitioner review queue. Reply target: '+new Date(q.dueAt).toLocaleString('en-GB',{timeZone:'Europe/London'})+'.';}catch(e){status.textContent=e.message;}</script></body></html>
